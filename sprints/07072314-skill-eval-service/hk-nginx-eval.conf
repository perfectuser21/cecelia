# HK nginx snippet — Skill Evaluator 反代 + 静态目录
# 放入 /etc/nginx/conf.d/skill-eval.conf 或 include 进主 server{} 块
#
# 依赖：
#   - Brain 运行在 127.0.0.1:5221
#   - 静态报告目录 /data/docs/skill-evals/ 已存在
#   - htpasswd 文件 /etc/nginx/.htpasswd-eval 已创建（Basic Auth 保护上传页）
#
# 使用方法：
#   sudo cp hk-nginx-eval.conf /etc/nginx/conf.d/skill-eval.conf
#   sudo nginx -t && sudo systemctl reload nginx

# /eval-api/ — 反代至 Brain，注入令牌，Basic Auth 保护
location /eval-api/ {
    # Basic Auth 保护（防止未授权的外部直接调用）
    auth_basic "Skill Evaluator";
    auth_basic_user_file /etc/nginx/.htpasswd-eval;

    # 注入 Proxy Token（由 nginx 层面统一注入，HK→Brain 内网传输）
    proxy_set_header X-Eval-Proxy-Token $EVAL_PROXY_TOKEN;

    # 反代至 Brain
    proxy_pass http://127.0.0.1:5221/api/eval/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 上传超时（zip 最大 10MB，网络慢时留余量）
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # multipart 上传 body 限制
    client_max_body_size 12m;
}

# /skill-eval/ — 静态上传表单 + 评估报告目录（无 Basic Auth，公开可读）
location /skill-eval/ {
    alias /data/docs/skill-evals/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    charset utf-8;

    # 报告 HTML 缓存策略
    location ~* \.(html|htm)$ {
        alias /data/docs/skill-evals/;
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 静态资源长缓存
    location ~* \.(css|js|png|jpg|woff2?)$ {
        alias /data/docs/skill-evals/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# 环境变量注入说明：
# nginx 本身不支持直接读环境变量，需通过 envsubst 预处理或 lua 模块。
# 推荐在 nginx 启动前用 envsubst 替换：
#   envsubst '$EVAL_PROXY_TOKEN' < hk-nginx-eval.conf.tmpl > /etc/nginx/conf.d/skill-eval.conf
# 或直接硬编码（不推荐）：
#   proxy_set_header X-Eval-Proxy-Token "your-token-here";
