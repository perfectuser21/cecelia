    availability: gap
    test_command:
    expected_result:
    observed_result:
    evidence_refs: []
    effect_receipt_id:

  missing_provider_matrix: &missing_provider_matrix
    claude:
      normal: *missing_proof_cell
      violation: *missing_proof_cell
      recovery: *missing_proof_cell
    codex:
      normal: *missing_proof_cell
      violation: *missing_proof_cell
      recovery: *missing_proof_cell
    grok:
      normal: *missing_proof_cell
      violation: *missing_proof_cell
