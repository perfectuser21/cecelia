core: []

# ============================================================================
# API 回归索引（新增 Brain 路由必须登记）
# ============================================================================
ci:
  - id: brain-api-harness-attempts-attemptid-heartbeat
    description: "Provider attempt lease heartbeat"
    endpoint: "/harness/attempts/:attemptId/heartbeat"
    method: "POST"
    trigger: [PR, Release]

  - id: brain-api-harness-attempts-attemptid-callback
    description: "Idempotent structured HarnessResult callback"
    endpoint: "/harness/attempts/:attemptId/callback"
    method: "POST"
    trigger: [PR, Release]

  - id: brain-api-release-runs-authorize
    description: "Exact ReleaseRun staging/production effect authorization"
    endpoint: "/release-runs/authorize"
    method: "POST"
    trigger: [PR, Release]

  - id: brain-api-release-runs-verification-claim
    description: "Leased server-owned ReleaseRun verification claim"
    endpoint: "/release-runs/verification-claim"
    method: "POST"
    trigger: [PR, Release]

  - id: brain-api-deploy-rollback-authorityid
    description: "Durable typed rollback settlement observation"
    endpoint: "/deploy/rollback/:authorityId"
    method: "GET"
    trigger: [PR, Release]

