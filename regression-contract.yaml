  contract_version: "kernel-equivalence-2026-07-28"
  report_as_of: "2026-07-28T00:00:00.000Z"

  journey:
    key: "kernel-harness-golden-path"
    steps:
      - { id: S0, name: "task born and admitted" }
      - { id: S1, name: "requirements and acceptance frozen" }
      - { id: S2, name: "controller and attempt assigned" }
      - { id: S3, name: "workspace and branch isolated" }
      - { id: S4, name: "generator executes under guards" }
      - { id: S5, name: "CI and DevGate evaluate without merge authority" }
      - { id: S6, name: "independent evaluator measures the artifact" }
      - { id: S7, name: "judge resolves evidence and convergence" }
      - { id: S8, name: "human review policy is resolved" }
      - { id: S9, name: "authorized exact SHA is merged" }
      - { id: S10, name: "the merged SHA is deployed to staging" }
      - { id: S11, name: "staging E2E promotes the same SHA to production" }
      - { id: S12, name: "effects, report, and learning are closed" }

  dimensions:
    - fr
    - nfr
    - invariant
    - checkpoint
    - freshness
    - death_alert
    - failure_semantics
    - effect_confirmation
    - adversarial_surface
    - ledger_freshness
    - axis_alignment

