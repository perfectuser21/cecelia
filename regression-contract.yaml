# ============================================================================
# Kernel Harness P0/P1 Behavior Equivalence
# ============================================================================
# 这是唯一行为清单；不是第二套 lifecycle，也不创建 behavior_ledger 表。
# gap 是合规状态：只有 exact artifact + freshness + effect receipt + 3 providers ×
# normal/violation/recovery 全部真实触发后，才允许改成 proven。
behavior_equivalence:
  schema_version: "1.1.0"
  contract_version: "kernel-atomic-equivalence-2026-07-29"
  required_behavior_count: 11
  required_atomic_invariant_count: 43
  proof_required_atomic_invariant_count: 42
  required_probe_definition_count: 446
  proof_required_probe_definition_count: 442
  required_provider_probe_assertion_count: 1326
  required_retired_absence_probe_count: 4
  report_as_of: "2026-07-28T00:00:00.000Z"
  drill_trust_registry:
    schema_version: "kernel-equivalence-trust-registry/v1"
    algorithm: ed25519
    grant_max_age_seconds: 900
    effect_receipt_max_age_seconds: 86400
    collector_bundle_max_age_seconds: 86400
    replay_nonce:
      single_use: true
      atomic_consumer_required: true
    # Public keys are registered only after the owning service deploys a signer.
    # No private or synthetic key may be committed here.
    keys: []
  drill_bundle_chain:
    schema_version: "kernel-equivalence-bundle-chain/v1"
    genesis_hash:
    head_hash:

  journey:
    key: "kernel-harness-golden-path"
    steps:
      - { id: S0, name: "Task Born" }
      - { id: S1, name: "Intent / PrepPRD" }
      - { id: S2, name: "Planner" }
      - { id: S3, name: "Contract GAN" }
      - { id: S4, name: "Generator" }
      - { id: S5, name: "CI" }
      - { id: S6, name: "Evaluator" }
      - { id: S7, name: "Independent Judge" }
      - { id: S8, name: "Risk-based Human Review" }
      - { id: S9, name: "Merge" }
      - { id: S10, name: "Staging" }
      - { id: S11, name: "Production" }
      - { id: S12, name: "Report / Learning / Complete" }

  dimensions:
    - fr
    - nfr
    - invariant
    - checkpoint
    - freshness
    - death_alert
    - failure_semantics
    - effect_confirmation
    - adversarial_surface
    - ledger_freshness
    - axis_alignment

  # An explicit empty matrix is deliberate evidence of absence, not proof.
  missing_proof_cell: &missing_proof_cell
    availability: gap
    test_command:
    expected_result:
    observed_result:
    evidence_refs: []
    effect_receipt_id:

  missing_provider_matrix: &missing_provider_matrix
    claude:
      normal: *missing_proof_cell
      violation: *missing_proof_cell
      recovery: *missing_proof_cell
    codex:
      normal: *missing_proof_cell
      violation: *missing_proof_cell
      recovery: *missing_proof_cell
    grok:
      normal: *missing_proof_cell
      violation: *missing_proof_cell
      recovery: *missing_proof_cell

  behaviors:
    - behavior_id: KERNEL-P0-01-BRANCH-PROTECTION
      priority: P0
      owner: engine-platform
      contract_version: "1.0.0"
      status: gap
      legacy_behavior: "Claude Code branch-protect/main-repo-write hooks deny protected-branch mutation."
      legacy_evidence:
        - packages/engine/tests/hooks/branch-protect.test.ts
        - packages/engine/tests/hooks/main-repo-write-guard.test.ts
      unified_constructs:
        - "Kernel workspace admission and protected-ref mutation policy"
        - "central GitHub mutation broker"
      steps: [S4]
      dimensions: [nfr, invariant, checkpoint, failure_semantics, effect_confirmation, adversarial_surface]
      atomic_invariant_count: 4
      probe_definition_count: 31
      atomic_invariants:
        - invariant_id: KERNEL-INV-P0-01-01-WORKSPACE-WRITE-ADMISSION
          priority: P0
          classification: active_required
          proof_status: gap
          steps:
            - S4
          dimensions:
            - invariant
            - checkpoint
            - failure_semantics
            - effect_confirmation
            - adversarial_surface
          single_effect_owner_seam: kernel.workspace.write_admission
          probe_definition_count: 8
          probe_definitions:
            - probe_id: KERNEL-PROBE-P0-01-01-001
              scenario: normal
              assertion: A valid protected-file Write in an admitted `cp-*` linked worktree with its matching dev-mode marker succeeds and is independently observed.
