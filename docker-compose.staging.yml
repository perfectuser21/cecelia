# == Staging Environment ==
# Brain staging 实例，端口 5222，独立 DB（cecelia_staging）。
# Tick 禁用，防止 staging 与 production 竞争任务派发。
#
# 部署: bash scripts/staging-deploy.sh
# 验证: bash scripts/staging-verify.sh

# 独立 compose project，与生产 project `cecelia` 隔离——否则 staging 部署会把
# 生产容器(cecelia-node-brain/cecelia-frontend)当 orphan 误扫（issue f38f989f 次因）。
#
# 改名安全性核查（不影响现有 staging 流程）：
#   - staging-deploy.sh 用 `docker compose -f docker-compose.staging.yml up -d`（无 -p），
#     直接吃本文件的 name: → 自动落到 cecelia-staging project，无需改脚本。
#   - container_name 显式指定（cecelia-node-brain-staging），改 project 不改容器名。
#   - 全仓无脚本假设 staging 挂在旧 project `cecelia` 下（grep 核查为空）。
#   - 环境变量(.env.staging)/网络(network_mode:host)由本文件承载，与 project 名无关。
name: cecelia-staging

services:
  node-brain-staging:
    image: cecelia-brain:${BRAIN_VERSION:-latest}
    container_name: cecelia-node-brain-staging
    network_mode: host
    pid: host
    read_only: true
    tmpfs:
      - /tmp:size=100M
    volumes:
      # Skills + cecelia-run (read-only)
      - /home/xx/.claude:/home/xx/.claude:ro
      - /home/xx/bin:/home/xx/bin:ro
      # Credentials (read-only)
      - /home/xx/.credentials:/home/cecelia/.credentials:ro
      # Claude account credentials
      - /home/xx/.claude-account1:/home/cecelia/.claude-account1:ro
      - /home/xx/.claude-account2:/home/cecelia/.claude-account2:ro
      - /home/xx/.claude-account3:/home/cecelia/.claude-account3:ro
      # Workflows (read-only)
      - /home/xx/perfect21/cecelia/packages/workflows:/home/xx/perfect21/cecelia/packages/workflows:ro
      # Config (read-only)
      - /home/xx/perfect21/cecelia/packages/config:/config:ro
      # HEARTBEAT.md (read-write)
      - /home/xx/perfect21/cecelia/HEARTBEAT.md:/HEARTBEAT.md:rw
      # workers.config.json (read-write)
      - /home/xx/perfect21/cecelia/packages/workflows/staff/workers.config.json:/home/xx/perfect21/cecelia/packages/workflows/staff/workers.config.json:rw
      # Timezone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env.staging
      - path: ${CECELIA_INTERNAL_ENV_FILE:-/Users/administrator/.credentials/cecelia-internal.env}
        required: false
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - ENV_REGION=${ENV_REGION:-us}
      - CECELIA_MAP_REPO_SCOPES=${CECELIA_MAP_REPO_SCOPES:-perfectuser21/cecelia=cecelia,cecelia=cecelia}
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=cecelia_staging
      - DB_USER=${DB_USER:-cecelia}
      - DB_PASSWORD=${DB_PASSWORD:-cecelia}
      - BRAIN_PORT=5222
      # Staging: 禁用 tick，防止抢 production 任务。
      # HARD_OFF 是硬关（无视 DB 值与缺省 true，也不启 watchdog/auto-recover）——
      # 2026-07-06 实锤：仅靠 TICK_ENABLED=false 时 staging tick 越权跑、调度打到生产 bridge。
      - CECELIA_TICK_ENABLED=false
      - CECELIA_TICK_HARD_OFF=1
      - CECELIA_MAX_SEATS=3
      - CECELIA_BUDGET_SLOTS=2
      - CECELIA_TICK_INTERVAL_MS=5000
      - DISPATCH_TIMEOUT_MINUTES=60
      - FEISHU_BOT_WEBHOOK=${FEISHU_BOT_WEBHOOK:-}
      - CECELIA_RUN_PATH=/home/xx/bin/cecelia-run
      - HOST_HOME=/home/xx
    deploy:
      resources:
        limits:
          # 同 production：node --max-old-space-size=3072 → 3G 堆，cap 必须 ≥ 堆 + 开销。
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5222/api/brain/tick/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  frontend-staging:
    image: node:20-alpine
    container_name: cecelia-frontend-staging
    network_mode: host
    working_dir: /app
    volumes:
      - ./apps/dashboard/dist:/app
      - /Users/administrator/perfect21/cecelia/apps/dashboard/dist:/Users/administrator/perfect21/cecelia/apps/dashboard/dist:ro
      - ./frontend-proxy.js:/frontend-proxy.js:ro
    environment:
      - FRONTEND_PORT=5212
      - BRAIN_PORT_TARGET=5222
      - LANGFUSE_PROXY_PORT=3002
    command: node /frontend-proxy.js
    depends_on:
      node-brain-staging:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
