name: Implementation impact
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_revision: {description: '固定基线40位SHA（须已有中央历史定义）', required: true, type: string}
      export_infra_baseline: {description: '可信main首次导出独立infra基线；不启用业务或替代原双scope', required: false, type: boolean, default: false}
      source_baseline_recovery: {description: '仅已独立准入并合并的来源bootstrap：隔离编译来源基线，不声明部署就绪', required: false, type: boolean, default: false}
      source_reviewed_head: {description: '仅来源恢复：已独立审查的最终main SHA，必须等于本次运行SHA', required: false, type: string}
      export_device_patrol_source_identity: {description: '仅可信main导出已登记巡查来源身份；不执行候选源码', required: false, type: boolean, default: false}
  workflow_call:
    inputs:
      source_repo: {required: true, type: string}
      scope: {required: true, type: string}
      base_revision: {required: true, type: string}
      head_revision: {required: true, type: string}
      mode: {required: true, type: string}
      tooling_revision: {required: true, type: string}
      admission_scopes: {required: false, type: string, default: ''}
    secrets:
      TS_AUTHKEY: {required: true}
      CECELIA_INTERNAL_TOKEN: {required: true}
      BRAIN_DEPLOY_URL: {required: false}
      CECELIA_ACTIONS_READ_TOKEN: {required: false}
      SKILLS_SOURCE_SSH_KEY: {required: false}
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: implementation-impact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-runtime-ready:
    if: inputs.export_device_patrol_source_identity != true && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 判定原生main来源就绪适用范围
        id: scope
        env:
          REQUIRED: ${{ github.repository == 'perfectuser21/cecelia' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (!inputs.source_repo || inputs.source_repo == github.repository) && (!inputs.head_revision || inputs.head_revision == github.sha) && (!inputs.tooling_revision || inputs.tooling_revision == github.sha) && (!inputs.mode || inputs.mode == 'main') && (inputs.scope || vars.IMPLEMENTATION_MAP_SCOPE || 'cecelia-kr') == 'cecelia-kr' }}
        run: |
          echo "applicable=$REQUIRED" >> "$GITHUB_OUTPUT"
          echo "applicable=$REQUIRED"
      - uses: actions/checkout@v4
        if: steps.scope.outputs.applicable == 'true'
        with:
          repository: perfectuser21/cecelia
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: 核实可信已发布main工具
        if: steps.scope.outputs.applicable == 'true'
        working-directory: tooling
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.applicable == 'true'
        with:
          node-version: '22'
      - uses: tailscale/github-action@v2
        if: steps.scope.outputs.applicable == 'true'
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: 已合并来源恢复工具依赖
        if: steps.scope.outputs.applicable == 'true' && github.event_name == 'workflow_dispatch' && inputs.source_baseline_recovery == true
        working-directory: tooling
        run: npm ci --ignore-scripts
      - name: 只读等待实际来源收集器就绪
        if: steps.scope.outputs.applicable == 'true'
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
          CECELIA_INTERNAL_TOKEN: ${{ secrets.CECELIA_INTERNAL_TOKEN }}
          GH_TOKEN: ${{ secrets.CECELIA_ACTIONS_READ_TOKEN || github.token }}
          HEAD: ${{ github.sha }}
          BASE: ${{ inputs.base_revision || github.event.before }}
          SOURCE_BASELINE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.source_baseline_recovery == true }}
        run: node tooling/scripts/ci/implementation-source-ready.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.applicable == 'true'
        with:
          name: implementation-source-readiness-${{ github.sha }}
          path: evidence/source-readiness/
          retention-days: 90
          if-no-files-found: warn
  snapshot-main:
    needs: [source-runtime-ready]
    if: inputs.export_device_patrol_source_identity != true && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.source_baseline_recovery == true && 45 || 15 }}
    services:
      postgres:
        image: ${{ inputs.source_baseline_recovery == true && 'mirror.gcr.io/pgvector/pgvector:pg15' || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: cecelia_scratch
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: perfectuser21/cecelia
          ref: ${{ github.repository == 'perfectuser21/cecelia' && github.sha || inputs.tooling_revision }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: 仅可信已发布main工具读取中央凭据
        working-directory: tooling
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: tooling
      - name: 下载本次真实来源身份观察
        if: github.event_name == 'workflow_dispatch' && inputs.source_baseline_recovery == true
        uses: actions/download-artifact@v4
        with:
          name: implementation-source-readiness-${{ github.sha }}
          path: evidence/source-readiness
      - name: 来源恢复隔离scratch及固定Skill准备
        if: github.event_name == 'workflow_dispatch' && inputs.source_baseline_recovery == true
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_scratch
          DB_USER: ci
          DB_PASSWORD: isolated-ci
          SKILLS_SOURCE_SSH_KEY: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
        run: |
          set -euo pipefail
          node tooling/packages/brain/src/migrate.js
          bash tooling/scripts/ensure-skills-source.sh "$GITHUB_WORKSPACE/tooling"
      - uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: 固定main中央定义导出
        env:
          IMPLEMENTATION_SKILLS_SOURCE_DIR: ${{ github.workspace }}/tooling/.skills-source
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
          CECELIA_INTERNAL_TOKEN: ${{ secrets.CECELIA_INTERNAL_TOKEN }}
          GH_TOKEN: ${{ secrets.CECELIA_ACTIONS_READ_TOKEN || github.token }}
          MAP_SCOPE: ${{ inputs.scope || vars.IMPLEMENTATION_MAP_SCOPE || 'cecelia-kr' }}
          SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
          BASE: ${{ inputs.base_revision || github.event.before }}
          HEAD: ${{ inputs.head_revision || github.sha }}
          SOURCE_BASELINE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.source_baseline_recovery == true }}
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_scratch
          DB_USER: ci
          DB_PASSWORD: isolated-ci
        run: |
          set -euo pipefail
          node tooling/scripts/ci/implementation-main-snapshot.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: implementation-snapshot-${{ inputs.head_revision || github.sha }}
          path: evidence/head.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: implementation-baseline-${{ inputs.head_revision || github.sha }}
          path: evidence/base.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implementation-snapshot-diagnostics-${{ inputs.head_revision || github.sha }}
          path: evidence/diagnostics/
          retention-days: 90
          if-no-files-found: warn
  snapshot-infra:
    needs: [source-runtime-ready]
    if: inputs.source_baseline_recovery != true && inputs.export_device_patrol_source_identity != true && github.repository == 'perfectuser21/cecelia' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.export_infra_baseline == true || vars.IMPLEMENTATION_INFRA_ADMISSION == 'true') && (!inputs.source_repo || inputs.source_repo == github.repository) && (!inputs.head_revision || inputs.head_revision == github.sha) && (!inputs.tooling_revision || inputs.tooling_revision == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: tooling
      - uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: 固定main独立infra来源导出
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
          CECELIA_INTERNAL_TOKEN: ${{ secrets.CECELIA_INTERNAL_TOKEN }}
          GH_TOKEN: ${{ secrets.CECELIA_ACTIONS_READ_TOKEN || github.token }}
          MAP_SCOPE: cecelia-infra
          SOURCE_REPO: perfectuser21/cecelia
          BASE: ${{ github.sha }}
          HEAD: ${{ github.sha }}
        run: node tooling/scripts/ci/implementation-main-snapshot.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: implementation-infra-snapshot-${{ github.sha }}
          path: evidence/head.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implementation-infra-diagnostics-${{ github.sha }}
          path: evidence/diagnostics/
          retention-days: 90
          if-no-files-found: warn
  gate:
    name: Implementation impact gate
    needs: [snapshot-main, snapshot-infra]
    if: always() && (github.event_name == 'pull_request' || needs.snapshot-main.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: cecelia_scratch
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: cecelia_scratch
      DB_USER: ci
      DB_PASSWORD: isolated-ci
      SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
      MAP_SCOPE: ${{ inputs.scope || vars.IMPLEMENTATION_MAP_SCOPE || 'cecelia-kr' }}
      INFRA_ADMISSION: ${{ inputs.source_baseline_recovery != true && vars.IMPLEMENTATION_INFRA_ADMISSION == 'true' && github.repository == 'perfectuser21/cecelia' && (inputs.scope || vars.IMPLEMENTATION_MAP_SCOPE || 'cecelia-kr') == 'cecelia-kr' && 'true' || 'false' }}
      ADMISSION_SCOPES: ${{ inputs.admission_scopes || vars.IMPLEMENTATION_ADMISSION_SCOPES || (github.event_name == 'pull_request' && github.repository == 'perfectuser21/cecelia' && '{"schema_version":1,"scopes":["cecelia-kr","cecelia-factory"]}' || '') }}
      BASE: ${{ inputs.base_revision || (github.event_name == 'pull_request' && github.event.pull_request.base.sha == '061a8a1784ffd02fdf1e3071390b2036e70d9395' && github.event.pull_request.head.ref == 'cp-10301020-source-pr-link' && github.event.pull_request.head.repo.full_name == 'perfectuser21/cecelia' && 'e3a01021ee7100b83d8ed5a0be219d0b543b5dff' || github.event.pull_request.base.sha) || github.event.before }}
      HEAD: ${{ inputs.head_revision || github.event.pull_request.head.sha || github.sha }}
      MODE: ${{ inputs.mode || (github.event_name == 'pull_request' && 'pr' || 'main') }}
      IMPLEMENTATION_MAIN_SCOPES: ${{ github.repository == 'perfectuser21/cecelia' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (!inputs.source_repo || inputs.source_repo == github.repository) && (!inputs.head_revision || inputs.head_revision == github.sha) && (!inputs.tooling_revision || inputs.tooling_revision == github.sha) && (!inputs.mode || inputs.mode == 'main') && (inputs.scope || vars.IMPLEMENTATION_MAP_SCOPE || 'cecelia-kr') == 'cecelia-kr' && inputs.export_device_patrol_source_identity != true && '{"schema_version":1,"scopes":["cecelia-kr","cecelia-factory"]}' || '' }}
      TOOLING_REVISION: ${{ inputs.tooling_revision || github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: perfectuser21/cecelia
          ref: ${{ inputs.tooling_revision || github.event.pull_request.base.sha || github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo || github.repository }}
          ref: ${{ inputs.head_revision || github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 固定回归依赖
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh jq libxml2-utils python3
      - run: npm ci --ignore-scripts
        working-directory: tooling
      - run: npm ci --ignore-scripts
        working-directory: source
      - name: 来源机制完整单元回归
        if: github.repository == 'perfectuser21/cecelia' && (!inputs.source_repo || inputs.source_repo == github.repository)
        working-directory: source
        run: node --test scripts/ci/__tests__/implementation-main-snapshot.test.mjs scripts/ci/__tests__/workspace-ci-source-bundle.test.mjs scripts/ci/__tests__/implementation-skill-source.test.mjs scripts/ci/__tests__/device-patrol-governance.test.mjs
      - name: scratch正式迁移
        run: node tooling/packages/brain/src/migrate.js
      - name: 三来源联合门真实PG与回归退出码守卫
        if: github.repository == 'perfectuser21/cecelia' && (!inputs.source_repo || inputs.source_repo == github.repository)
        working-directory: source
        run: node --test scripts/ci/__tests__/implementation-infra-joint.pg.test.mjs
      - name: 巡查独立可信工具main身份baseline
        if: env.MAP_SCOPE == 'cecelia-device-patrol'
        env:
          GH_TOKEN: ${{ secrets.CECELIA_ACTIONS_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          node tooling/scripts/ci/implementation-patrol-baseline.mjs "$TOOLING_REVISION" "$RUNNER_TEMP/implementation-input"
          printf 'ADMISSION_SCOPES=\n' >> "$GITHUB_ENV"
      - name: 下载固定SHA中央bundle（PR无中央写凭据）
        if: env.MAP_SCOPE != 'cecelia-device-patrol'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          NATIVE_PR_BASELINE: ${{ github.repository == 'perfectuser21/cecelia' && github.event_name == 'pull_request' && !inputs.source_repo && !inputs.tooling_revision && !inputs.scope && !inputs.head_revision && !inputs.base_revision && !inputs.mode && !inputs.admission_scopes }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/implementation-input" "$RUNNER_TEMP/implementation-output"
          gap_code=IMPLEMENTATION_CI_ARTIFACT_DOWNLOAD_FAILED
          record_download_gap() {
            result=$?
            trap - ERR
            jq -n --arg code "$gap_code" --arg base "$BASE" --arg head "$HEAD" \
              '{status:"unknown",stage:"snapshot_download",code:$code,base_revision:$base,head_revision:$head}' > "$RUNNER_TEMP/implementation-output/gap.json"
            exit "$result"
          }
          trap record_download_gap ERR
          gap_code=IMPLEMENTATION_CI_REVISION_INVALID
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          gap_code=IMPLEMENTATION_CI_ARTIFACT_DOWNLOAD_FAILED
          if [[ "$MODE" == main ]]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "implementation-snapshot-$HEAD" -D "$RUNNER_TEMP/implementation-input/head"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "implementation-baseline-$HEAD" -D "$RUNNER_TEMP/implementation-input/base"
          else
            if [[ "${NATIVE_PR_BASELINE:-false}" == true ]]; then
              # 原PRbase只固定可信工具；有效基线可沿第一父链恢复，仍跑全部累积差分。
              test "$MAP_SCOPE" = cecelia-kr
              test "$ADMISSION_SCOPES" = '{"schema_version":1,"scopes":["cecelia-kr","cecelia-factory"]}'
              BASE="$(node source/scripts/ci/implementation-pr-baseline.mjs \
                --repo-root "$GITHUB_WORKSPACE/source" --tooling-root "$GITHUB_WORKSPACE/tooling" \
                --input-dir "$RUNNER_TEMP/implementation-input" --output-dir "$RUNNER_TEMP/implementation-output")"
              [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
              printf 'BASE=%s\n' "$BASE" >> "$GITHUB_ENV"
            else
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=implementation-snapshot-$BASE" | jq -r --arg base "$BASE" '.artifacts | map(select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_sha == $base and .workflow_run.repository_id == .workflow_run.head_repository_id)) | sort_by(.created_at, .id) | reverse | first | .id // empty')
            if [[ -z "$artifact" ]]; then
              gap_code=IMPLEMENTATION_CI_BASE_ARTIFACT_MISSING
              echo '::error::固定base中央snapshot artifact缺失，不能用latest'
              false
            fi
            artifact_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" --jq '.workflow_run.id')
            gap_code=IMPLEMENTATION_CI_ARTIFACT_ORIGIN_INVALID
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run" --jq '.event + " " + .path' | grep -Eq '^(push|workflow_dispatch) .github/workflows/implementation-impact.yml$'
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run" | jq -e --arg sha "$BASE" --arg repo "$GITHUB_REPOSITORY" --argjson run "$artifact_run" \
              '.id == $run and .head_sha == $sha and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch") and .path == ".github/workflows/implementation-impact.yml" and .repository.full_name == $repo and .head_repository.full_name == $repo' >/dev/null
            gap_code=IMPLEMENTATION_CI_SNAPSHOT_PROVIDER_FAILED
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run/jobs?per_page=100" | jq -e \
              '.total_count <= 100 and any(.jobs[]; .name == "snapshot-main" and .status == "completed" and .conclusion == "success")' >/dev/null
            gap_code=IMPLEMENTATION_CI_ARTIFACT_DOWNLOAD_FAILED
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/implementation-input/base.zip"
            mkdir -p "$RUNNER_TEMP/implementation-input/base"
            unzip -p "$RUNNER_TEMP/implementation-input/base.zip" head.json > "$RUNNER_TEMP/implementation-input/base/base.json"
            gap_code=IMPLEMENTATION_CI_SNAPSHOT_PROVIDER_FAILED
            jq -e 'type == "object" and .error == null and (.snapshot | type == "object")' "$RUNNER_TEMP/implementation-input/base/base.json" >/dev/null
            mkdir -p "$RUNNER_TEMP/implementation-input/head"
            cp "$RUNNER_TEMP/implementation-input/base/base.json" "$RUNNER_TEMP/implementation-input/head/head.json"
            fi
            if [[ -n "${ADMISSION_SCOPES:-}" ]]; then
              jq -e 'type == "object" and keys == ["schema_version", "scopes"] and .schema_version == 1 and (.scopes | type == "array" and length > 0 and all(.[]; type == "string" and test("^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$")) and length == (unique | length))' <<< "$ADMISSION_SCOPES" >/dev/null
              gap_code=IMPLEMENTATION_CI_SCOPE_COMPANION_INVALID
              printf '%s\n' "$ADMISSION_SCOPES" > "$RUNNER_TEMP/implementation-input/admission-scopes.json"
              node tooling/scripts/ci/implementation-pr-gate.mjs --extract-scopes \
                --snapshot-file "$RUNNER_TEMP/implementation-input/base/base.json" \
                --scopes-file "$RUNNER_TEMP/implementation-input/admission-scopes.json" \
                --side base --output-dir "$RUNNER_TEMP/implementation-input/base"
              node tooling/scripts/ci/implementation-pr-gate.mjs --extract-scopes \
                --snapshot-file "$RUNNER_TEMP/implementation-input/head/head.json" \
                --scopes-file "$RUNNER_TEMP/implementation-input/admission-scopes.json" \
                --side head --output-dir "$RUNNER_TEMP/implementation-input/head"
            fi
          fi
      - name: 独立infra固定来源加入联合输入
        if: env.INFRA_ADMISSION == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tooling/scripts/ci/implementation-infra-inputs.mjs "$RUNNER_TEMP/implementation-input"
          printf 'IMPLEMENTATION_INFRA_INPUT_DIR=%s\n' "$RUNNER_TEMP/implementation-input" >> "$GITHUB_ENV"
      - name: 准备固定中央Skill对象缓存
        id: skill-cache
        env:
          SKILLS_SOURCE_SSH_KEY: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
          NATIVE_PR: ${{ github.repository == 'perfectuser21/cecelia' && github.event_name == 'pull_request' && !inputs.source_repo && !inputs.tooling_revision && !inputs.scope && !inputs.head_revision && !inputs.base_revision && !inputs.mode && !inputs.admission_scopes }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/implementation-output"
          trap 'code=$?; if (( code != 0 )); then printf "%s\n" "{\"status\":\"unknown\",\"stage\":\"skill_cache_prepare\",\"code\":\"SKILL_CACHE_PREPARATION_FAILED\"}" > "$RUNNER_TEMP/implementation-output/gap.json"; fi' EXIT
          tooling_sha="$(git -C tooling rev-parse --verify HEAD)"
          test "$tooling_sha" = "$TOOLING_REVISION"
          # 仅精确已发布、reader及锁字节一致的旧工具；仍运行原完整双scope gate。
          if [[ "$NATIVE_PR" == true && "$GITHUB_REPOSITORY" == perfectuser21/cecelia && "$GITHUB_EVENT_NAME" == pull_request && "$SOURCE_REPO" == perfectuser21/cecelia && "$MODE" == pr && ( "$BASE" == 821dac5ae926cd5120d7b94fcd8012dd1f09bc23 || "$BASE" == b8985542133fb7dcf87a2adf9151de43d0694185 || "$BASE" == a72ff8372d4eb2100e1b9b7572d88a22969bef2f || "$BASE" == b977d068919ff699318581214ddb07c314629e56 || "$BASE" == 8665e5683c972f5a88649b5783e3d196b32e9a38 ) && "$TOOLING_REVISION" == "$BASE" && "$MAP_SCOPE" == cecelia-kr && "$ADMISSION_SCOPES" == '{"schema_version":1,"scopes":["cecelia-kr","cecelia-factory"]}' ]]; then
            node --input-type=module <<'JS'
          import {readImplementationSource} from './tooling/scripts/ci/implementation-skill-source.mjs';
          import {readFixedLocalGitBlob} from './tooling/scripts/ci/fixed-local-git.mjs';
          import {lstatSync} from 'node:fs';
          import {join} from 'node:path';
          const base=process.env.BASE,head=process.env.HEAD,root=join(process.cwd(),'source'),tooling=join(process.cwd(),'tooling'),cache=join(root,'.skills-source');
          const trusted=readFixedLocalGitBlob(tooling,{revision:base,path:'.skills-source.json'});
          for(const revision of [base,head])if(!readFixedLocalGitBlob(root,{revision,path:'.skills-source.json'}).equals(trusted))throw Error('SKILL_LEGACY_821_LOCK_MISMATCH');
          if(!process.env.SKILLS_SOURCE_SSH_KEY?.trim())throw Error('SKILL_SOURCE_SSH_KEY_REQUIRED');
          try{lstatSync(cache);throw Error('SKILL_LEGACY_821_CACHE_EXISTS');}catch(e){if(e.code!=='ENOENT')throw e;}
          const path='packages/engine/skills/dev/SKILL.md';
          if(readFixedLocalGitBlob(root,{revision:head,path},{allowMissing:true})!==null)throw Error('SKILL_LEGACY_821_PATH_NOT_MIGRATED');
          readImplementationSource(root,head,path,{source:cache});
          readFixedLocalGitBlob(cache,{revision:JSON.parse(trusted).revision,path:'distribution/catalog.json'});
          JS
            printf 'legacy_821=true\n' >> "$GITHUB_OUTPUT"
          else
            args=(--prepare-ci-cache "$GITHUB_WORKSPACE/source" "$SOURCE_REPO" "$BASE" "$HEAD")
            scoped="${ADMISSION_SCOPES:-${IMPLEMENTATION_MAIN_SCOPES:-}}"
            if [[ -n "$scoped" ]]; then
              printf '%s\n' "$scoped" > "$RUNNER_TEMP/implementation-input/cache-scopes.json"
              if [[ "$MODE" == main ]]; then
                for side in base head; do
                  IMPLEMENTATION_MAIN_SCOPES='' node tooling/scripts/ci/implementation-pr-gate.mjs --extract-scopes --snapshot-file "$RUNNER_TEMP/implementation-input/$side/$side.json" --scopes-file "$RUNNER_TEMP/implementation-input/cache-scopes.json" --side "$side" --output-dir "$RUNNER_TEMP/implementation-input/$side"
                done
              fi
              while IFS= read -r scope; do
                args+=(--snapshot "$RUNNER_TEMP/implementation-input/base/base-$scope.json" --snapshot "$RUNNER_TEMP/implementation-input/head/head-$scope.json")
              done < <(jq -r '.scopes[]' "$RUNNER_TEMP/implementation-input/cache-scopes.json")
            else
              for side in base head; do
                jq -e '.snapshot | select(type=="object")' "$RUNNER_TEMP/implementation-input/$side/$side.json" > "$RUNNER_TEMP/implementation-input/$side/canonical.json"
                args+=(--snapshot "$RUNNER_TEMP/implementation-input/$side/canonical.json")
              done
            fi
            if [[ "$INFRA_ADMISSION" == true ]]; then
              args+=(--snapshot "$RUNNER_TEMP/implementation-input/base/base-cecelia-infra.json" --snapshot "$RUNNER_TEMP/implementation-input/head/head-cecelia-infra.json")
            fi
            cache="$(node tooling/scripts/ci/implementation-skill-source.mjs "${args[@]}")"
            case "$cache" in "$RUNNER_TEMP"/implementation-skills-ci-*/objects) test -d "$cache" ;; *) echo 'invalid fixed Skill cache' >&2; exit 1 ;; esac
            printf 'IMPLEMENTATION_SKILLS_SOURCE_DIR=%s\n' "$cache" >> "$GITHUB_ENV"
          fi
      - name: 完整联合scope清单加入infra
        if: env.INFRA_ADMISSION == 'true' && env.MODE == 'pr'
        run: |
          set -euo pipefail
          scopes=$(jq -ce 'select(.schema_version == 1 and .scopes == ["cecelia-kr","cecelia-factory"]) | .scopes += ["cecelia-infra"]' <<< "$ADMISSION_SCOPES")
          printf 'ADMISSION_SCOPES=%s\n' "$scopes" >> "$GITHUB_ENV"
      - name: 实际变更影响与固定回归
        env:
          SKILLS_SOURCE_SSH_KEY: ${{ steps.skill-cache.outputs.legacy_821 == 'true' && secrets.SKILLS_SOURCE_SSH_KEY || '' }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == pr && -n "$ADMISSION_SCOPES" ]]; then
            jq -e 'type == "object" and keys == ["schema_version", "scopes"] and .schema_version == 1 and (.scopes | type == "array" and length > 0 and all(.[]; type == "string" and test("^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$")) and length == (unique | length))' <<< "$ADMISSION_SCOPES" >/dev/null
            jq --arg root "$RUNNER_TEMP/implementation-input" '.scopes | map({scope:.,snapshotBase:($root+"/base/base-"+.+".json"),snapshotHead:($root+"/head/head-"+.+".json")})' <<< "$ADMISSION_SCOPES" > "$RUNNER_TEMP/implementation-input/scopes.json"
            node tooling/scripts/ci/implementation-multi-pr-gate.mjs --repo-root "$GITHUB_WORKSPACE/source" \
              --base "$BASE" --head "$HEAD" --mode "$MODE" --scopes-file "$RUNNER_TEMP/implementation-input/scopes.json" --output-dir "$RUNNER_TEMP/implementation-output"
          else
            node tooling/scripts/ci/implementation-pr-gate.mjs --repo-root "$GITHUB_WORKSPACE/source" --scope "$MAP_SCOPE" \
              --base "$BASE" --head "$HEAD" --mode "$MODE" \
              --snapshot-base "$RUNNER_TEMP/implementation-input/base/base.json" \
              --snapshot-head "$RUNNER_TEMP/implementation-input/head/head.json" --output-dir "$RUNNER_TEMP/implementation-output"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implementation-evidence-${{ inputs.head_revision || github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/implementation-output/
          retention-days: 90
          if-no-files-found: error

  device-patrol-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.export_device_patrol_source_identity == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trusted published main only
        env:
          RUN_REF: ${{ github.ref }}
        run: test "$RUN_REF" = refs/heads/main
      - uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Read immutable registered source identity
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
          CECELIA_INTERNAL_TOKEN: ${{ secrets.CECELIA_INTERNAL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail-with-body --silent --show-error --get "$BRAIN_URL/api/brain/implementation-ci/snapshot" \
            -H "X-Internal-Token: $CECELIA_INTERNAL_TOKEN" \
            --data-urlencode scope=cecelia-device-patrol \
            --data-urlencode repo=perfectuser21/zenithjoy-workspace \
            --data-urlencode revision=73bd094ae34ecccb1514b09fd4fec8733b846769 > evidence/head.json
          jq -e '.snapshot.scope == "cecelia-device-patrol" and .snapshot.repo == "perfectuser21/zenithjoy-workspace" and .snapshot.registration.provenance.base_revision == "73bd094ae34ecccb1514b09fd4fec8733b846769" and .snapshot.registration.provenance.introduced_revision == "f0923e5396bade1986ba5452e766cabb5f4a30b3"' evidence/head.json
      - uses: actions/upload-artifact@v4
        with:
          name: device-patrol-admission-73bd094ae34ecccb1514b09fd4fec8733b846769
          path: evidence/head.json
          retention-days: 90
          if-no-files-found: error
