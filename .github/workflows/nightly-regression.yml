name: Deep Regression
'on':
  schedule:
    - cron: 0 19 * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deep-regression
  cancel-in-progress: false
jobs:
  open-issue-on-failure:
    name: Report deep regression failure
    needs: [brain-integration, walking-ci-e2e, real-env-smoke]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `[深度回归] ${date} 检查失败`;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            if (issues.some(issue => issue.title === title)) return;
            const results = JSON.parse(process.env.NEEDS_JSON);
            const body = Object.entries(results).map(([name, result]) => `- ${name}: ${result.result}`).join('\n')
              + `\n\n运行记录：https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({ owner, repo, title, body });
  brain-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: cecelia_test
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U cecelia -d cecelia_test" --health-interval 5s --health-timeout 5s --health-retries 12'
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: cecelia_test
      DB_USER: cecelia
      DB_PASSWORD: isolated-ci
      DATABASE_URL: postgresql://cecelia:isolated-ci@localhost:5432/cecelia_test
      CI: 'true'
      POSTGRES_INTEGRATION: '1'
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://cecelia:isolated-ci@localhost:5432/cecelia_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep jq zsh libxml2-utils
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migrate dedicated database
        run: cd packages/brain && node src/migrate.js
      - name: Run full database regressions
        run: cd packages/brain && npx --no-install vitest run --config ../../scripts/ci/deep-integration.config.mjs --reporter=dot
  walking-ci-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: cecelia_test
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U cecelia -d cecelia_test" --health-interval 5s --health-timeout 5s --health-retries 12'
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: cecelia_test
      DB_USER: cecelia
      DB_PASSWORD: isolated-ci
      DATABASE_URL: postgresql://cecelia:isolated-ci@localhost:5432/cecelia_test
      CI: 'true'
      POSTGRES_INTEGRATION: '1'
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://cecelia:isolated-ci@localhost:5432/cecelia_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Permanent actual target rejection regression
        run: node --test packages/quality/tests/walking-checkpointer-guard.node-test.mjs
      - name: Install dependencies and migrate dedicated service
        run: |
          npm ci
          cd packages/brain
          node src/migrate.js
      - name: Prepare isolated Brain and actual Alpine worker
        run: |
          # 显式走镜像源再打本地名（registry-mirrors 未命中会回落 Docker Hub 被限流，任务 7294cf3a）
          docker pull mirror.gcr.io/library/alpine:latest
          docker tag mirror.gcr.io/library/alpine:latest alpine:latest
          docker build -f packages/brain/Dockerfile -t cecelia-brain:walking-ci .
          docker run -d --name cecelia-brain-walking-ci --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DB_HOST -e DB_PORT -e DB_NAME -e DB_USER -e DB_PASSWORD -e DATABASE_URL \
            -e CI=true -e WALKING_CI_OWNER=1 -e NODE_ENV=test -e BRAIN_PORT=5221 \
            -e CECELIA_TICK_ENABLED=false -e ENV_REGION=us \
            -e CECELIA_CKPT_QUERY_TIMEOUT_MS=5000 -e CECELIA_CKPT_STATEMENT_TIMEOUT_MS=5000 \
            -e CECELIA_CKPT_CONNECTION_TIMEOUT_MS=5000 -e DB_QUERY_TIMEOUT_MS=5000 -e REPO_ROOT=/repo_root \
            -v "$GITHUB_WORKSPACE/packages/workflows:/repo_root/packages/workflows:ro" \
            cecelia-brain:walking-ci
          for _attempt in $(seq 1 90); do
            if curl -q -fsS --max-time 2 http://localhost:5221/api/brain/walking-skeleton-1node/instance >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: True two-thread Docker callback checkpoint restart acceptance
        env:
          SMOKE_ALLOW_WRITE: '1'
          BRAIN_CONTAINER: cecelia-brain-walking-ci
        run: >
          set -o pipefail

          timeout --kill-after=10s 300s bash packages/brain/scripts/smoke/walking-skeleton-1node-smoke.sh | tee
          /tmp/walking-ci-e2e-proof.log
      - name: Save owned fixture evidence
        if: always()
        run: docker logs cecelia-brain-walking-ci > /tmp/walking-ci-e2e-brain.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walking-ci-real-pg-proof
          path: /tmp/walking-ci-e2e-*.log
      - name: Cleanup dedicated Brain fixture
        if: always()
        run: docker rm -f cecelia-brain-walking-ci 2>/dev/null || true
    permissions:
      contents: read
  real-env-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: cecelia_test
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U cecelia -d cecelia_test" --health-interval 5s --health-timeout 5s --health-retries 12'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Brain deps + run migrations
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: isolated-ci
        run: |
          npm ci
          cd packages/brain
          node src/migrate.js
      - name: Build cecelia-brain image
        run: docker build -f packages/brain/Dockerfile -t cecelia-brain:ci .
      - name: Seed isolated execution identities without Worker admission
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: isolated-ci
        run: >
          if (echo > /dev/tcp/127.0.0.1/5231) 2>/dev/null; then
            echo "::error::CI Worker denial fixture requires unused loopback port 5231"
            exit 1
          fi

          node --input-type=module <<'NODE'

          import pg from 'pg';

          import { seedExecutionDirectoryPgFixture } from './packages/brain/src/__tests__/helpers/execution-directory-pg-fixture.js';

          const pool = new
          pg.Pool({host:process.env.DB_HOST,port:Number(process.env.DB_PORT),database:process.env.DB_NAME,user:process.env.DB_USER,password:process.env.DB_PASSWORD});

          try { await seedExecutionDirectoryPgFixture(pool, {ciSmoke:true}); }

          finally { await pool.end(); }

          NODE
      - name: Start Brain container (network=host → 直连 postgres service)
        run: |
          # network=host：runner 上 postgres service 暴露在 localhost:5432，
          # brain 容器共享 host network namespace 即可直接 localhost:5432 命中 postgres
          docker run -d --name cecelia-brain-smoke \
            --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=cecelia_test \
            -e DB_USER=cecelia \
            -e DB_PASSWORD=isolated-ci \
            -e BRAIN_PORT=5221 \
            -e NODE_ENV=test \
            -e CECELIA_TICK_ENABLED=false \
            -e ENV_REGION=us \
            -e REPO_ROOT=/repo_root \
            -v "$GITHUB_WORKSPACE/packages/workflows:/repo_root/packages/workflows:ro" \
            cecelia-brain:ci
          # 等 /api/brain/tick/status 200（最多 90s）
          for _attempt in $(seq 1 90); do
            if curl -sf http://localhost:5221/api/brain/tick/status >/dev/null 2>&1; then
              echo "✅ Brain healthy in ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Brain not healthy in 90s"
          docker logs cecelia-brain-smoke
          exit 1
      - name: Map Manifest real PG positive
        env:
          SMOKE_ALLOW_WRITE: '1'
          BRAIN_URL: http://localhost:5221
          BRAIN_CONTAINER: cecelia-brain-smoke
          DATABASE_URL: postgresql://cecelia:isolated-ci@localhost:5432/cecelia_test
          NODE_ENV: test
        run: |
          cd packages/brain
          npx vitest run --config vitest.real-env-smoke.config.js
      - name: Cleanup brain container
        if: always()
        run: |
          docker logs cecelia-brain-smoke 2>&1 | tail -100 || true
          docker rm -f cecelia-brain-smoke 2>/dev/null || true
    permissions:
      contents: read
    env:
      CI: 'true'
      POSTGRES_INTEGRATION: '1'
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: cecelia_test
      DB_USER: cecelia
      DB_PASSWORD: isolated-ci
      DATABASE_URL: postgresql://cecelia:isolated-ci@localhost:5432/cecelia_test
      TEST_DATABASE_URL: postgresql://cecelia:isolated-ci@localhost:5432/cecelia_test
