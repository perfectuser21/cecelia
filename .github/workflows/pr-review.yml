name: PR Review (DeepSeek, manual)

# 按需 AI 代码审查 — workflow_dispatch 显式指定 PR
# 使用 DeepSeek V3 通过 OpenRouter API 对代码变更进行 AI review
# 结果以评论形式发布到 PR
# API、评论或严重问题检测失败均使本次辅助审查失败；不属于合并必需门

# 在线 AI 审查为按需辅助；结果不属于源码 CI 的强制成功结论。
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '需要辅助审查的 PR 编号'
        required: true
        type: number

env:
  PR_NUMBER: ${{ inputs.pr_number }}

jobs:
  deepseek-review:
    name: DeepSeek Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 验证超长diff请求构造
        run: bash scripts/__tests__/pr-review-large-diff.test.sh

      - name: 获取 PR diff
        id: get-diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 沿用500行审查范围；内容只经文件传递，单行生成物不能污染进程环境。
          gh pr diff "$PR_NUMBER" > "$RUNNER_TEMP/pr-review-raw.diff"
          head -n 500 "$RUNNER_TEMP/pr-review-raw.diff" > "$RUNNER_TEMP/pr-review.diff"

      - name: 调用 OpenRouter API 进行代码审查（含重试，fail-closed）
        id: ai-review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          : "${OPENROUTER_API_KEY:?缺少 OPENROUTER_API_KEY，不能执行审查}"
          # 构造审查 prompt
          SYSTEM_PROMPT="你是 Cecelia 项目的代码审查员，请用中文对以下代码变更进行审查。

          **重要：文件类型区分**
          - packages/workflows/skills/ 目录下的 SKILL.md 文件是 AI Agent 指令文档，其中的 <占位符> 是模板示例，不是真实实现代码，不要当作实现缺陷来审查。
          - docs/learnings/ 目录下是经验文档，审查内容完整性即可，不要要求代码实现。
          - .js/.ts/.sh 等可执行文件才需要严格的代码审查。

          重点关注以下方面（仅针对可执行代码）：
          1. **逻辑问题**：是否有潜在的逻辑错误、边界条件处理不当、空指针/异常未处理
          2. **安全风险**：是否有凭据泄露、SQL 注入、XSS、不安全的依赖等安全隐患
          3. **DoD 符合度**：变更是否符合 PR 描述中的 DoD（Definition of Done）条目，是否所有 DoD 条目均已勾选 [x]
          4. **代码质量**：是否有重复代码、过度复杂的实现、缺少错误处理
          5. **测试覆盖**：feat 类型的变更是否包含对应的测试文件

          **严重问题（🔴）标准**：只有在可执行代码中发现真实 bug、安全漏洞、或 DoD 未完成才标记为🔴。文档内容问题、模板完整性、建议性改进均不应标记为🔴。

          输出格式：
          - 用简洁的 Markdown 列表总结发现的问题
          - 区分严重问题（🔴）、建议优化（🟡）、正面反馈（🟢）
          - 如果没有发现严重问题，在🔴严重问题下明确写\"未发现严重问题\""

          jq -n --arg sys "$SYSTEM_PROMPT" --rawfile diff "$RUNNER_TEMP/pr-review.diff" \
            '{model:"deepseek/deepseek-chat",messages:[
              {role:"system",content:$sys},
              {role:"user",content:("请审查以下代码变更：\n\n```diff\n"+$diff+"\n```")}
            ],max_tokens:2000,temperature:0.1}' > "$RUNNER_TEMP/pr-review-request.json"

          # 调用 OpenRouter API（DeepSeek V3）— 最多重试 3 次，fail-closed
          MAX_RETRY=3
          RETRY_COUNT=0
          REVIEW_CONTENT=""

          while [[ $RETRY_COUNT -lt $MAX_RETRY ]]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "API 调用尝试 ${RETRY_COUNT}/${MAX_RETRY}..."

            RESPONSE=$(curl -s -X POST "https://openrouter.ai/api/v1/chat/completions" \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              -H "Content-Type: application/json" \
              -H "X-Title: Cecelia PR Review" \
              --max-time 60 \
              --data-binary "@$RUNNER_TEMP/pr-review-request.json" 2>/dev/null || echo "")

            REVIEW_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")

            if [[ -n "$REVIEW_CONTENT" ]]; then
              echo "API 调用成功（第 ${RETRY_COUNT} 次）"
              break
            fi

            echo "API 调用失败（第 ${RETRY_COUNT} 次），响应：$(echo "$RESPONSE" | head -c 200)"
            if [[ $RETRY_COUNT -lt $MAX_RETRY ]]; then
              echo "等待 5 秒后重试..."
              sleep 5
            fi
          done

          # API失败或限流均未完成审查，不能声明成功。
          if [[ -z "$REVIEW_CONTENT" ]]; then
            echo "❌ OpenRouter API 调用全部失败（已重试 ${MAX_RETRY} 次），本次辅助审查失败" >&2
            exit 1
          fi

          # 写入文件供后续步骤使用
          echo "$REVIEW_CONTENT" > "$RUNNER_TEMP/review-result.txt"
          echo "审查结果已保存"

      - name: 将审查结果发布为 PR 评论
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEW_CONTENT=$(cat "$RUNNER_TEMP/review-result.txt")
          COMMENT_BODY="## 🤖 AI 代码审查（DeepSeek V3）

          ${REVIEW_CONTENT}

          ---
          *由 [OpenRouter](https://openrouter.ai) 提供 DeepSeek V3 模型审查*"

          gh pr comment "$PR_NUMBER" \
            --body "$COMMENT_BODY" 2>/dev/null || \
          { echo "::error::评论发布失败，本次辅助审查未完成"; exit 1; }

      - name: 检测严重问题（🔴 则 job 失败）
        run: |
          echo "正在检测审查结果中是否包含🔴严重问题..."
          cat "$RUNNER_TEMP/review-result.txt" | node scripts/devgate/detect-review-issues.js
