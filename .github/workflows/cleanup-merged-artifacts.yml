name: Cleanup Merged Artifacts

# 每次 PR 合并到 main 后，自动删除该 PR 遗留的 .prd-*.md / .task-*.md 文件
# 这些文件只在 PR review 期间需要（CI 检查 GITHUB_HEAD_REF），合并后是死重

on:
  push:
    branches:
      - main

jobs:
  cleanup:
    name: Remove prd/task artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and remove prd/task artifacts
        id: cleanup
        run: |
          set -euo pipefail
          # 找出所有合并后的残留 md：
          #   旧命名：.prd-*.md / .task-*.md / .dod-*.md（带前导点、小写，保留向后兼容）
          #   新命名：DoD.cp-*.md / PRD.cp-*.md / TASK_CARD.cp-*.md（大写、无前导点）
          # 不匹配 DoD.md / PRD.md（活跃 PR 使用，无 .cp- 后缀）
          # Phase 7.5: 补齐 .dod-* 前缀，之前漏抓导致 3 个 .dod-cp-* 残留积累
          # 2026-07-06 补齐 .dev-mode./.dev-seal./.enriched-prd-（审计发现 main 积了 13 个此类残留）
          FILES=$(git ls-files | grep -E '^(\.prd-|\.task-|\.dod-|\.dev-mode\.|\.dev-seal\.|\.enriched-prd-|DoD\.cp-|PRD\.cp-|TASK_CARD\.cp-)' || true)

          if [ -z "$FILES" ]; then
            echo "✅ 无 prd/task 残留文件，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(echo "$FILES" | wc -l | tr -d ' ')
          echo "🗑️  发现 $COUNT 个残留文件，开始清理..."
          echo "$FILES"

          # 删除文件
          echo "$FILES" | xargs git rm -q

          # 从实际Git删除索引核验清单；文件删除与声明退役进入同一提交。
          CLEANUP_DELETE_LIST="$FILES" node --input-type=module <<'NODE'
          import { existsSync, lstatSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { SOURCE_RELATIONS_PATH, removeDeletedArtifactRelations } from './scripts/ci/implementation-auxiliary-evidence.mjs';
          const deleted = process.env.CLEANUP_DELETE_LIST.split('\n').filter(Boolean);
          const staged = new Set(execFileSync('git', ['diff', '--cached', '--name-only', '--diff-filter=D', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean));
          if (deleted.some(path => !staged.has(path) || existsSync(path))) throw new Error('Cleanup deletion is not staged');
          let stat;
          try { stat = lstatSync(SOURCE_RELATIONS_PATH); } catch (error) { if (error.code !== 'ENOENT') throw error; }
          if (stat) {
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error('Source relations must be a regular file');
            const before = readFileSync(SOURCE_RELATIONS_PATH, 'utf8');
            const after = removeDeletedArtifactRelations(before, deleted);
            if (after !== before) {
              writeFileSync(SOURCE_RELATIONS_PATH, after);
              execFileSync('git', ['add', '--', SOURCE_RELATIONS_PATH]);
            }
          }
          NODE

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # 2026-07-06 根治：原「git push 直推 main + continue-on-error」在分支保护下永远被
      # GH013 拒，continue-on-error 把红糊成绿 → 19 次"成功"实际一个文件没删过（积到 50 个）。
      # 改为开清理 PR + auto-merge：用 DEPLOY_TOKEN（PAT）建 PR 才会触发 CI（GITHUB_TOKEN 建的
      # PR 不触发 workflow → required ci-passed 永远 pending 卡死）。失败就红，不许糊。
      - name: Commit cleanup via PR
        if: steps.cleanup.outputs.changed == 'true'
        env:
          COUNT: ${{ steps.cleanup.outputs.count }}
          # 必须是 GitHub PAT：DEPLOY_TOKEN 是 Brain API bearer 不是 PAT（0706 纠正）；
          # GITHUB_TOKEN 建的 PR 不触发 CI → required checks 永远 pending 卡死 auto-merge。
          GH_TOKEN: ${{ secrets.GH_PAT_BOT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT_BOT secret 未配置（建清理 PR 必需 PAT）。请在 repo Settings → Secrets 添加。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="cp-$(TZ=Asia/Shanghai date +%m%d%H%M)-cleanup-artifacts"
          git checkout -b "$BRANCH"
          git commit -m "chore(cleanup): 自动清理合并后的 prd/task 残留（${COUNT} 个）[bot]"
          git push origin "$BRANCH"
          gh pr create --head "$BRANCH" --base main \
            --title "chore(cleanup): 自动清理合并后的 prd/task 残留（${COUNT} 个）" \
            --body "由 cleanup-merged-artifacts.yml 自动创建。仅删除合并后残留的流程文件（.prd-*/.task-*/.dod-*/.dev-mode.*/.dev-seal.*/.enriched-prd-*/DoD.cp-*/PRD.cp-*/TASK_CARD.cp-*），同步退役实际删除资料的来源登记，保留未删与持久资料登记。"
          gh pr merge "$BRANCH" --auto --squash
