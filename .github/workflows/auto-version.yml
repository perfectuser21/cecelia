name: Auto Version

on:
  push:
    branches: [main]
    paths:
      - 'packages/brain/**'
      - 'changes/**'

# 串行化:两个 feature 快速连合时,后一次 run 会基于最新 main 生成超越版 PR(见 supersede 步)
concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  bump:
    name: Auto Bump Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # 用 PAT 而非 GITHUB_TOKEN:GITHUB_TOKEN 推的分支/开的 PR 不触发任何
          # pull_request workflow(GitHub 防递归),bot PR 会永远 0 CI 挂死(09-06 #5190 案)
          token: ${{ secrets.GH_PAT_BOT || github.token }}

      - name: Check if commit is auto-version
        id: check
        run: |
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -q "chore(brain): auto-version"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine bump type from commit message
        if: steps.check.outputs.skip == 'false'
        id: bump
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"

          if echo "$MSG" | grep -qE '^feat(\(.+\))?!:|^BREAKING'; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qE '^feat(\(.+\))?:'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qE '^fix(\(.+\))?:'; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            # chore/docs 等默认不 bump,但如果携带 changes/ 碎片(条目待发布)则按 patch 处理
            if ls changes/*.md 2>/dev/null | grep -vi 'README.md' >/dev/null; then
              echo "type=patch" >> $GITHUB_OUTPUT
            else
              echo "type=none" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Apply version bump + consume changes fragments
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        run: |
          # 版本五件套统一应用器:brain 双 package 文件 + 根 lock workspace 条目 +
          # .brain-versions + DEFINITION 版本行/VERSION;并消费 changes/*.md 碎片为 DEFINITION 条目
          node packages/brain/scripts/auto-version-apply.mjs --bump "${{ steps.bump.outputs.type }}"

      - name: Create version bump PR
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        env:
          # 同上:PAT 开的 PR 才会触发 CI;无 PAT 时降级 GITHUB_TOKEN(PR 需人工 close/reopen 触发)
          GH_TOKEN: ${{ secrets.GH_PAT_BOT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0

          NEW_VERSION=$(node -e "process.stdout.write(require('./packages/brain/package.json').version)")
          BRANCH_NAME="auto-version-bump-${NEW_VERSION}"

          # 超越式接管:本 run 基于最新 main 重算了全部碎片,旧的未合并 bot PR 已过时,先关掉防双写
          for OLD in $(gh pr list --state open --json headRefName -q '.[].headRefName' | grep '^auto-version-bump-' || true); do
            if [ "$OLD" != "$BRANCH_NAME" ]; then
              gh pr close "$OLD" --comment "superseded by ${BRANCH_NAME}" --delete-branch || true
            fi
          done

          # Delete remote branch if it exists (from a previous failed run)
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          git checkout -b "$BRANCH_NAME"
          git commit -m "chore(brain): auto-version ${{ steps.bump.outputs.type }} bump to ${NEW_VERSION}"
          git push -u origin "$BRANCH_NAME"

          BUMP_TYPE="${{ steps.bump.outputs.type }}"
          PR_TITLE="chore(brain): auto-version ${BUMP_TYPE} bump to ${NEW_VERSION}"
          PR_BODY="Automated version bump to ${NEW_VERSION}."

          # Create PR (idempotent: if PR already exists for this branch, fetch existing URL)
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            2>&1) \
            || PR_URL=$(gh pr view "$BRANCH_NAME" --json url -q '.url' 2>/dev/null \
               || echo "PR creation failed and no existing PR found")

          echo "PR URL: $PR_URL"

          # Request auto-merge (|| true so workflow succeeds even if auto-merge unavailable)
          gh pr merge "$BRANCH_NAME" --squash --auto --delete-branch \
            || echo "Note: auto-merge request failed (CI may not have started yet). PR: $PR_URL"
