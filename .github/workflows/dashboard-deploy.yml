name: Dashboard Auto Deploy

# apps/ 变更 push 到 main 后立即 rebuild dashboard，填补 schedule 的最长 8h 窗口期。
# 仅做 npm build + 容器重启，不涉及 Brain 核心代码，风险极低。

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'apps/api/**'

concurrency:
  group: dashboard-autodeploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Rebuild Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger dashboard deploy via Brain webhook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://38.23.47.81:5221' }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN secret 未配置"
            exit 1
          fi

          # 传一个具体文件路径让 deploy-local.sh 能命中 apps/dashboard/* 分支
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "${BRAIN_URL}/api/brain/deploy" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"changed_paths": ["apps/dashboard/src/App.tsx"]}' \
            --connect-timeout 30 --max-time 60)

          echo "Response ($HTTP_CODE):"
          cat /tmp/resp.txt
          echo ""

          # 409 = deploy 正在进行，视为成功（变更将被包含在进行中的 deploy）
          if [ "$HTTP_CODE" = "409" ]; then
            echo "::notice::Deploy 正在进行中（409），当前变更将被纳入"
            exit 0
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Dashboard deploy 已触发"
          else
            echo "::error::Deploy webhook 失败（HTTP $HTTP_CODE）"
            exit 1
          fi

      - name: 等待 deploy 完成
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://38.23.47.81:5221' }}
        run: |
          echo "轮询 /api/brain/deploy/status（最多 180s）..."
          ELAPSED=0
          while [ $ELAPSED -lt 180 ]; do
            STATUS=$(curl -s --max-time 10 "${BRAIN_URL}/api/brain/deploy/status" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "  [${ELAPSED}s] status=${STATUS}"
            if [ "$STATUS" = "success" ]; then
              echo "✅ Dashboard deploy 成功"
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo "::error::Dashboard deploy 失败，请检查 Brain 日志"
              exit 1
            elif [ "$STATUS" = "idle" ] && [ $ELAPSED -gt 30 ]; then
              echo "::notice::Status idle — deploy 可能已跳过（无变更），视为成功"
              exit 0
            fi
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          echo "::warning::等待超时（180s），deploy 结果未知"
