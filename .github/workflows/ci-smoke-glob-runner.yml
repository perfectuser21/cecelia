name: Smoke Glob Runner（棘轮闸）

# Smoke 脚本棘轮闸：
#   ALLOWLIST 内脚本失败 → 红（基线保护）
#   DENYLIST 脚本          → 跳过（env 不兼容）
#   DEBT 脚本失败          → 仅报告（存量债）
#   新脚本未登记           → 红（新债不许欠）
#
# 分类文件：packages/quality/smoke-{allowlist,denylist,debt}.txt
# 执行器：  packages/quality/scripts/run-smoke-ratchet.sh

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-glob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-glob-runner:
    name: Smoke Glob Runner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: cecelia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Brain deps
        run: npm ci

      - name: Run Migrations
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: cd packages/brain && node src/migrate.js

      - name: Build cecelia-brain image
        run: docker build -f packages/brain/Dockerfile -t cecelia-brain:ci .

      - name: Start Brain container
        env:
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          docker run -d --name cecelia-brain-smoke \
            --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=cecelia_test \
            -e DB_USER=cecelia \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e BRAIN_PORT=5221 \
            -e NODE_ENV=test \
            -e CECELIA_TICK_ENABLED=false \
            -e ENV_REGION=us \
            -e REPO_ROOT=/repo_root \
            -v "$GITHUB_WORKSPACE/packages/workflows:/repo_root/packages/workflows:ro" \
            cecelia-brain:ci
          # 等待 Brain 就绪（最多 90s）
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5221/api/brain/tick/status >/dev/null 2>&1; then
              echo "✅ Brain 就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Brain 90s 内未就绪"
          docker logs cecelia-brain-smoke
          exit 1

      - name: Run Smoke Ratchet Gate
        env:
          BRAIN_URL: http://localhost:5221
          BRAIN_CONTAINER: cecelia-brain-smoke
          DATABASE_URL: postgresql://cecelia:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/cecelia_test
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          # P1-fix: smoke 脚本用 PG* 变量做 DB 直连检查，CI 只设 DB_* 导致 PGDATABASE 回落 'cecelia'
          # → psql 连不上，DB 断言静默跳过，CI 绿但实际未验证。补齐后 psql 走 cecelia_test。
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: cecelia_test
          PGUSER: cecelia
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: bash packages/quality/scripts/run-smoke-ratchet.sh

      - name: Dump Brain logs on failure
        if: failure()
        run: docker logs cecelia-brain-smoke 2>&1 | tail -200 || true

      - name: Cleanup Brain container
        if: always()
        run: docker rm -f cecelia-brain-smoke 2>/dev/null || true

  # ── 聚合闸（required check 注册点）─────────────────────────────
  smoke-glob-runner-passed:
    name: Smoke Glob Runner Passed
    needs: [smoke-glob-runner]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Gate check
        run: |
          RESULT="${{ needs.smoke-glob-runner.result }}"
          if [ "$RESULT" = "failure" ]; then
            echo "❌ smoke-glob-runner 失败（基线脚本未通过或有未登记新脚本）"
            echo "  → 查看 'Run Smoke Ratchet Gate' step 获取详情"
            exit 1
          fi
          echo "✅ smoke-glob-runner-passed (result=$RESULT)"
