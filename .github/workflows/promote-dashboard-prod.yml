name: Authorized Dashboard Production Effect

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Durable Kernel ReleaseRun UUID
        required: true
      merge_sha:
        description: Exact merge SHA
        required: true
      release_authorization:
        description: Persisted production effect authorization UUID
        required: true

permissions:
  contents: read

concurrency:
  group: kernel-release
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      release_run_id: ${{ inputs.release_run_id }}
      merge_sha: ${{ inputs.merge_sha }}
      release_authorization: ${{ inputs.release_authorization }}
    secrets: inherit
