name: Preview Deploy

# per-branch 预览环境部署
# PR push → 构建 apps/dashboard → SSH 部署到 hk-vps 唯一端口 → health check → PR 评论写 URL
# main 分支推送不触发（pull_request 事件仅在 PR head branch 触发，main 作为 base 不触发）

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-deploy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview_deploy:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建 apps/dashboard
        run: npm run build
        working-directory: apps/dashboard

      - name: 计算预览端口
        id: port
        run: |
          PORT=$(bash scripts/preview-deploy.sh --print-port "${{ github.head_ref }}")
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "Preview port: $PORT"

      - name: SSH 部署到 hk-vps
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT || 22 }}
          command_timeout: 120s
          script: |
            bash ~/scripts/preview-deploy.sh --print-port "${{ github.head_ref }}" || true
            PORT=$(bash ~/scripts/preview-deploy.sh --print-port "${{ github.head_ref }}")
            mkdir -p ~/previews/$PORT
            cd ~/previews/$PORT
            # 停止已有进程（幂等）
            [ -f /tmp/preview-${PORT}.pid ] && kill $(cat /tmp/preview-${PORT}.pid) 2>/dev/null || true

      - name: 上传构建产物到 hk-vps
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT || 22 }}
          source: "apps/dashboard/dist/*"
          target: "~/previews/${{ steps.port.outputs.port }}"
          strip_components: 3

      - name: 启动静态服务并写 PID
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT || 22 }}
          command_timeout: 120s
          script: |
            PORT=${{ steps.port.outputs.port }}
            cd ~/previews/$PORT
            nohup python3 -m http.server $PORT > /tmp/preview-${PORT}.log 2>&1 &
            echo $! > /tmp/preview-${PORT}.pid
            echo "${{ github.head_ref }}" > /tmp/preview-${PORT}.branch
            sleep 2
            kill -0 $(cat /tmp/preview-${PORT}.pid) || { echo "服务启动失败"; exit 1; }

      - name: Preview URL health check（HTTP 200）
        id: healthcheck
        run: |
          PORT=${{ steps.port.outputs.port }}
          HOST="${{ secrets.HK_VPS_HOST }}"
          PREVIEW_URL="http://${HOST}:${PORT}"
          echo "health_check URL: $PREVIEW_URL"
          # 最多重试 10 次，每次等 3 秒
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 5 "$PREVIEW_URL" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ health check 通过 HTTP $STATUS"
              echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "尝试 $i/10: HTTP $STATUS，等待..."
            sleep 3
          done
          echo "❌ health check 失败，预览服务未响应 HTTP 200"
          exit 1

      - name: PR 评论写入预览 URL
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.healthcheck.outputs.preview_url }}';
            const branch = '${{ github.head_ref }}';
            const port = '${{ steps.port.outputs.port }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🚀 预览环境已就绪\n\n**Branch**: \`${branch}\`\n**Preview URL**: ${previewUrl}\n**Port**: ${port}\n\n> 此预览环境在 PR 关闭时自动清理。`,
            });

      - name: PR 评论写入失败原因
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = '${{ github.head_ref }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 预览环境部署失败\n\n**Branch**: \`${branch}\`\n\n请检查 [GitHub Actions 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 获取详细失败原因。`,
            });
