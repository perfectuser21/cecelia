name: Preview Deploy

# per-PR 完整预览环境部署（预览Brain + 隔离数据 + 前端）
# WS1 实现：决策 48331b37，接通 preview-env-start.sh
#
# 流程：
#   1. Connect Tailscale
#   2. 调 Brain API /preview/start → 分配端口 + 触发 preview-env-start.sh（异步）
#      preview-env-start.sh 在 US VPS 上执行：git worktree + clone DB + build frontend + start Brain
#   3. 轮询 /preview/status/:pr 直到 active 或超时
#   4. 健康检查 Brain URL
#   5. PR 评论写入预览 URL（失败贴失败原因，绝不贴无效 URL）

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: preview-deploy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview_deploy:
    name: Deploy Preview Environment
    # Harness/Fleet infrastructure is validated by Brain CI, real-env smoke,
    # and the dedicated Kernel acceptance run. A UI preview is unrelated and
    # must not couple those stages to the host preview-disk admission gate.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'harness') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 检查 Tailscale secret 是否配置
        id: check_ts
        run: |
          if [ -n "$SECRET_TS" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "TS_AUTHKEY secret 未配置，跳过预览部署"
          fi
        env:
          SECRET_TS: ${{ secrets.TS_AUTHKEY }}

      - name: Connect to Tailscale
        if: steps.check_ts.outputs.configured == 'true'
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: 触发 preview-env-start（Brain API）
        id: start_preview
        if: steps.check_ts.outputs.configured == 'true'
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5221' }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "调用 Brain API /preview/start..."
          RESP=$(bash scripts/request-preview-start.sh)
          echo "Brain 响应: $RESP"
          PORT=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['port'])" 2>/dev/null)
          if [ -z "$PORT" ]; then
            echo "无法获取预览端口，Brain 响应: $RESP"
            exit 1
          fi
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "预览端口已分配: $PORT"

      - name: 轮询 preview 状态直到 active（max 600s）
        id: wait_active
        if: steps.check_ts.outputs.configured == 'true'
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5221' }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -uo pipefail
          PORT=${{ steps.start_preview.outputs.port }}
          MAX_WAIT=600; INTERVAL=10; ELAPSED=0
          STATUS=""
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(curl -sf --connect-timeout 5 --max-time 10 \
              "${BRAIN_URL}/api/brain/preview/status/${PR_NUMBER}" 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            echo "  [${ELAPSED}s] preview status=${STATUS}"
            if [ "$STATUS" = "active" ]; then
              echo "预览 Brain 已就绪 (${ELAPSED}s)"
              break
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ "$STATUS" != "active" ]; then
            echo "预览 Brain 在 ${MAX_WAIT}s 内未 active（status=${STATUS}），继续健康检查..."
          fi

      - name: 从 BRAIN_URL 解析主机地址
        id: get_host
        if: steps.check_ts.outputs.configured == 'true'
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5221' }}
        run: |
          HOST=$(echo "$BRAIN_URL" | sed -E 's#^https?://##; s#:[0-9]+$##')
          echo "host=$HOST" >> $GITHUB_OUTPUT

      - name: 健康检查预览 Brain
        id: healthcheck
        if: steps.check_ts.outputs.configured == 'true'
        run: |
          PORT=${{ steps.start_preview.outputs.port }}
          HOST=${{ steps.get_host.outputs.host }}
          PREVIEW_URL="http://${HOST}:${PORT}"
          echo "health_check: $PREVIEW_URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -sf --connect-timeout 5 --max-time 10 "$PREVIEW_URL" 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "running" ]; then
              echo "健康检查通过"
              echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "  尝试 $i/12: status=${STATUS}，等待..."
            sleep 10
          done
          echo "健康检查失败"
          exit 1

      - name: PR 评论写入预览 URL（成功）
        if: steps.check_ts.outputs.configured == 'true' && success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.healthcheck.outputs.preview_url }}';
            const branch = '${{ github.head_ref }}';
            const port = '${{ steps.start_preview.outputs.port }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 🚀 完整预览环境已就绪',
                '',
                `**Branch**: \`${branch}\``,
                `**Preview URL**: ${previewUrl}`,
                `**Port**: ${port}`,
                '',
                '**包含**: 预览 Brain（PR 后端代码）+ 隔离数据库快照 + 前端 UI',
                '',
                '> 此预览环境在 PR 关闭时自动销毁。数据隔离：写入不会污染生产库。',
              ].join('\n'),
            });

      - name: PR 评论写入（Tailscale 未配置）
        if: steps.check_ts.outputs.configured == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = '${{ github.head_ref }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ 预览环境未部署\n\n**Branch**: \`${branch}\`\n\n预览功能需在 repo secrets 中配置 \`TS_AUTHKEY\` 和 \`DEPLOY_TOKEN\`。`,
            });

      - name: PR 评论写入失败原因
        if: failure() && steps.check_ts.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = '${{ github.head_ref }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ 预览环境部署失败\n\n**Branch**: \`${branch}\`\n\n请检查 [GitHub Actions 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 获取详细失败原因。`,
            });
