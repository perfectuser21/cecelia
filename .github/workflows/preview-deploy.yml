name: Preview Deploy

# ⚠️ 预览环境在执行机（MMV:5241）起，不在 us-vps，也不走 MMV:5221：
#    · 起预览 = 起 Brain 实例 + 克隆数据库 = 执行活，违反 us-vps 零执行铁律（决策 96054a8b）
#    · MMV:5221 是 socat，会把流量整个转发到 us-vps —— 必须错开端口才能留在本机
#    · preview-env-start.sh 硬编码 Mac 路径、磁盘门槛 38.5G 按 Mac 盘设计，
#      us-vps 根分区仅 24G，数学上不可能通过
#    对端 = scripts/preview-agent.mjs（launchd 常驻，复用 routes/preview.js）

# per-PR 完整预览环境部署（预览Brain + 隔离数据 + 前端）
# WS1 实现：决策 48331b37，接通 preview-env-start.sh
#
# 流程：
#   1. Connect Tailscale
#   2. 调 Brain API /preview/start → 分配端口 + 触发 preview-env-start.sh（异步）
#      preview-env-start.sh 在 MMV 执行机上执行：git worktree + clone DB + build frontend + start Brain
#   3. 轮询 /preview/status/:pr 直到 active 或超时
#   4. 健康检查 Brain URL
#   5. PR 评论写入预览 URL（失败贴失败原因，绝不贴无效 URL）

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/dashboard/**'
      - 'apps/api/**'

concurrency:
  group: preview-deploy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview_deploy:
    name: Deploy Preview Environment
    # Harness/Fleet infrastructure is validated by Brain CI, real-env smoke,
    # and the dedicated Kernel acceptance run. A UI preview is unrelated and
    # must not couple those stages to the host preview-disk admission gate.
    # 自动版本号 PR 不需要预览（只改版本五件套），不占预览名额（上限 6 个）
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'harness') && !startsWith(github.head_ref, 'auto-version-bump-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 执行原预览步骤
        uses: ./.github/actions/preview-deploy
        with:
          ts-authkey: ${{ secrets.TS_AUTHKEY }}
          deploy-token: ${{ secrets.DEPLOY_TOKEN }}
          brain-url: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5241' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
