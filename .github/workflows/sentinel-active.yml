name: Heartbeat Sentinel Active

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      probe_url:
        description: "probe URL (empty = production; drill: dead port e.g. http://IP:9999)"
        required: false
        default: ""

concurrency:
  group: heartbeat-sentinel-active
  cancel-in-progress: false

env:
  DEFAULT_PROBE_URL: "http://100.71.151.105:5221"
  ISSUE_LABEL: heartbeat-sentinel

jobs:
  probe:
    name: 反向探测生产 Brain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      health_ok: ${{ steps.health.outputs.ok }}
      kv_ok: ${{ steps.kv.outputs.ok }}
      probe_url: ${{ steps.resolve.outputs.url }}
      kv_age_minutes: ${{ steps.kv.outputs.age_minutes }}

    steps:
      - name: 解析探测 URL
        id: resolve
        run: |
          INPUT_URL="${{ github.event.inputs.probe_url }}"
          if [[ -n "$INPUT_URL" ]]; then
            echo "url=$INPUT_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=$DEFAULT_PROBE_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: 探测 /api/brain/health
        id: health
        env:
          PROBE_URL: ${{ steps.resolve.outputs.url }}
        run: |
          set -uo pipefail
          RESPONSE=$(curl -sf --max-time 15 "$PROBE_URL/api/brain/health" 2>/dev/null || echo "CURL_FAIL")
          if [[ "$RESPONSE" == "CURL_FAIL" ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "parse_error")
          if [[ "$STATUS" == "healthy" || "$STATUS" == "ok" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 探测 KV smoke-nightly-last-run
        id: kv
        env:
          PROBE_URL: ${{ steps.resolve.outputs.url }}
        run: |
          set -uo pipefail
          MAX_AGE_SECONDS=$(( 26 * 3600 ))
          RESPONSE=$(curl -sf --max-time 15 "$PROBE_URL/api/brain/kv/smoke-nightly-last-run" 2>/dev/null || echo "CURL_FAIL")
          if [[ "$RESPONSE" == "CURL_FAIL" ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "age_minutes=-1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FINISHED_AT=$(echo "$RESPONSE" | python3 -c "
import json, sys
d = json.load(sys.stdin)
v = d.get('value', d)
if isinstance(v, str):
    v = json.loads(v)
print(v.get('finished_at', ''))
" 2>/dev/null || echo "")
          if [[ -z "$FINISHED_AT" ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "age_minutes=-1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOW_EPOCH=$(date -u +%s)
          FINISHED_EPOCH=$(date -u -d "$FINISHED_AT" +%s 2>/dev/null || python3 -c "from datetime import datetime; print(int(datetime.fromisoformat('$FINISHED_AT'.replace('Z','+00:00')).timestamp()))")
          AGE_S=$(( NOW_EPOCH - FINISHED_EPOCH ))
          AGE_MINUTES=$(( AGE_S / 60 ))
          echo "age_minutes=$AGE_MINUTES" >> "$GITHUB_OUTPUT"
          if (( AGE_S > MAX_AGE_SECONDS )); then
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  alert:
    name: 告警
    needs: probe
    if: >-
      always() &&
      (needs.probe.outputs.health_ok != 'true' ||
       needs.probe.outputs.kv_ok != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      SERVER_URL: ${{ github.server_url }}
      PROBE_URL: ${{ needs.probe.outputs.probe_url }}
      HEALTH_OK: ${{ needs.probe.outputs.health_ok }}
      KV_OK: ${{ needs.probe.outputs.kv_ok }}
      KV_AGE: ${{ needs.probe.outputs.kv_age_minutes }}

    steps:
      - name: 开 GitHub Issue（去重）
        run: |
          set -uo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          TITLE="[heartbeat-sentinel] 生产探测失败 — ${TODAY}"
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          EXISTING=$(gh api "repos/${REPO}/issues?state=open&labels=${ISSUE_LABEL}&per_page=50" \
            --jq '[.[] | select(.title=="'"${TITLE}"'")] | length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "已有 open issue，跳过"
          else
            BODY="## Heartbeat Sentinel 告警
日期: ${TODAY}
Run: ${RUN_URL}
目标: ${PROBE_URL}"
            [ "$HEALTH_OK" != "true" ] && BODY="${BODY}
- /api/brain/health 不可达"
            [ "$KV_OK" != "true" ] && BODY="${BODY}
- KV smoke-nightly-last-run 超期/不可达 (${KV_AGE}min)"
            gh issue create --repo "${REPO}" --title "${TITLE}" --body "${BODY}" --label "${ISSUE_LABEL}" \
              || gh issue create --repo "${REPO}" --title "${TITLE}" --body "${BODY}" \
              || echo "::warning::Issue 创建失败"
          fi

      - name: Bark 推送
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_TOKEN: ${{ secrets.BARK_TOKEN }}
        run: |
          FAILURES=""
          [ "$HEALTH_OK" != "true" ] && FAILURES="${FAILURES}Brain /health 不可达; "
          [ "$KV_OK" != "true" ] && FAILURES="${FAILURES}nightly KV 超期 ${KV_AGE}min; "
          TITLE="心跳哨兵告警"
          BODY="生产探测失败: ${FAILURES}目标=${PROBE_URL}"
          ET=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$TITLE'))")
          EB=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BODY")
          if [[ -n "${BARK_URL:-}" ]]; then
            curl -sf --max-time 10 "${BARK_URL}/${ET}/${EB}?group=heartbeat-sentinel&level=critical" \
              >/dev/null 2>&1 && echo "Bark ok" || echo "::warning::Bark 失败"
          elif [[ -n "${BARK_TOKEN:-}" ]]; then
            curl -sf --max-time 10 "https://api.day.app/${BARK_TOKEN}/${ET}/${EB}?group=heartbeat-sentinel&level=critical" \
              >/dev/null 2>&1 && echo "Bark ok" || echo "::warning::Bark 失败"
          else
            echo "::warning::未配 BARK_URL/BARK_TOKEN"
          fi

  close-on-success:
    name: 恢复时关闭 Issue
    needs: probe
    if: >-
      always() &&
      needs.probe.outputs.health_ok == 'true' &&
      needs.probe.outputs.kv_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      SERVER_URL: ${{ github.server_url }}

    steps:
      - name: 关闭 open issues
        run: |
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          OPEN=$(gh api "repos/${REPO}/issues?state=open&labels=${ISSUE_LABEL}&per_page=50" \
            --jq '.[].number' 2>/dev/null || echo "")
          if [[ -z "$OPEN" ]]; then echo "无 open issues"; exit 0; fi
          for NUM in $OPEN; do
            gh issue close "$NUM" --repo "${REPO}" \
              --comment "心跳哨兵恢复正常。Run: ${RUN_URL}" \
              2>/dev/null && echo "已关闭 #$NUM" || echo "::warning::关闭 #$NUM 失败"
          done
