name: Heartbeat Sentinel Active

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      probe_url:
        description: "probe URL (empty = production; drill: dead port e.g. http://IP:9999)"
        required: false
        default: ""

concurrency:
  group: heartbeat-sentinel-active
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      health_ok: ${{ steps.health.outputs.ok }}
      kv_ok: ${{ steps.kv.outputs.ok }}
    steps:
      - id: health
        run: echo "ok=true" >> "$GITHUB_OUTPUT"
      - id: kv
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  alert:
    needs: probe
    if: always() && needs.probe.outputs.health_ok != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: echo "alert triggered"

  close-on-success:
    needs: probe
    if: always() && needs.probe.outputs.health_ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: echo "all ok"
