name: App-server bounded container canary
on:
  pull_request:
    paths:
      - 'packages/brain/scripts/fleet-worker/app-server-*'
      - 'packages/brain/src/app-server/**'
      - 'packages/brain/migrations/506_app_server_streams.sql'
      - '.github/workflows/app-server-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-server-canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-generation-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # CI 不直连 Docker Hub：docker build/compose 拉镜像走 mirror.gcr.io（任务 7294cf3a）
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build fixed CLI test image
        run: |
          docker build -t cecelia-appserver-ci - <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          RUN npm install -g @openai/codex@0.158.0
          DOCKERFILE
          echo "APP_SERVER_CANARY_IMAGE=$(docker image inspect --format '{{.Id}}' cecelia-appserver-ci)" >> "$GITHUB_ENV"
      - name: Two independent offline instances sharing HOME through the real runner
        run: |
          set -o pipefail
          node packages/brain/scripts/fleet-worker/app-server-canary.cjs | tee app-server-canary.log
      - name: Direct shim HTTP RPC and explicit generation cleanup
        run: |
          set -o pipefail
          node packages/brain/scripts/fleet-worker/app-server-rpc-canary.cjs | tee app-server-rpc-canary.log
      - name: Keep identity and quota evidence (no credentials or model calls)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-server-canary-evidence
          path: |
            app-server-canary.log
            app-server-rpc-canary.log
          if-no-files-found: ignore
