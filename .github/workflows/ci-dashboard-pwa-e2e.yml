name: Dashboard PWA Upgrade E2E

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/ci-dashboard-pwa-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/ci-dashboard-pwa-e2e.yml'

jobs:
  pwa-upgrade:
    name: PWA Upgrade (Playwright / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci
        working-directory: .

      - name: Install Chromium
        run: node ../../node_modules/@playwright/test/cli.js install chromium --with-deps

      - name: Verify stale PWA upgrade
        run: npm run test:pwa-upgrade
