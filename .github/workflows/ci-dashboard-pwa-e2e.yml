name: Dashboard PWA Upgrade E2E

on:
  pull_request:
    paths:
      - ".skills-source.json"
      - 'apps/dashboard/**'
      - 'apps/api/features/**'
      - '.github/workflows/ci-dashboard-pwa-e2e.yml'
  push:
    branches: [main]
    paths:
      - ".skills-source.json"
      - 'apps/dashboard/**'
      - 'apps/api/features/**'
      - '.github/workflows/ci-dashboard-pwa-e2e.yml'

jobs:
  pwa-upgrade:
    name: PWA Upgrade (Playwright / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci
        working-directory: .

      - name: Install Chromium
        run: node e2e/playwright-cli.mjs install chromium --with-deps

      - name: Verify stale PWA upgrade
        run: npm run test:pwa-upgrade

      - name: Verify task desk receipts
        run: npm run test:task-desk
