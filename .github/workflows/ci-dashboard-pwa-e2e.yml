name: Dashboard PWA Upgrade E2E

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'apps/api/features/**'
      - '.github/workflows/ci-dashboard-pwa-e2e.yml'
      - 'tests/regression/manual-ui/**'
      - 'tests/regression/cockpit-route-wire/**'
      - 'tests/regression/relay-07b2fd3b/**'
      - 'tests/regression/capture-destination-link/**'
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'apps/api/features/**'
      - '.github/workflows/ci-dashboard-pwa-e2e.yml'
      - 'tests/regression/manual-ui/**'
      - 'tests/regression/cockpit-route-wire/**'
      - 'tests/regression/relay-07b2fd3b/**'
      - 'tests/regression/capture-destination-link/**'

jobs:
  pwa-upgrade:
    name: PWA Upgrade (Playwright / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci
        working-directory: .

      - name: Install Chromium
        run: node e2e/playwright-cli.mjs install chromium --with-deps

      - name: Verify stale PWA upgrade
        run: npm run test:pwa-upgrade

      - name: Verify task desk receipts
        run: npm run test:task-desk

      - name: Verify current cockpit inbox and destination routes
        run: |
          GIT_SHA="$GITHUB_SHA" npx --no-install vite build --outDir .dist-pwa-e2e
          node e2e/playwright-cli.mjs test --config ../../tests/regression/manual-ui/playwright.config.ts
