name: Brain CI Deploy (Gate 3)

# Gate 3: brain 文件变更自动触发 HTTP 部署
#
# 与 deploy.yml 的区别：
#   deploy.yml  — 全量 release（brain + workspace），手动/定时，Safe/Fast Lane
#   brain-ci-deploy.yml — brain 专用，push 触发，Fast Lane only，cancel-in-progress:true
#
# 历史教训（brain-deploy.yml PR #2675）：
#   ❌ SSH 方案 → BRAIN_DEPLOY_SSH_KEY 为空立即失败
#   ✅ 本 workflow 使用 DEPLOY_TOKEN + Brain HTTP API（与 deploy.yml 相同机制）
#
# 并发策略：cancel-in-progress:true（多次连续 merge 只跑最新的）
#   独立 group "brain-autodeploy"，绝不使用 "deploy-production"（与 deploy.yml 冲突）

on:
  push:
    branches: [main]
    paths:
      - 'packages/brain/**'
      - 'scripts/brain-deploy.sh'
  # PR 触发：skill 快照 / CI 防线脚本变更时跑「CI 防线三件套」守卫（不触发部署）
  # 同时：packages/brain/src/** 新增文件时触发 island-gate 孤岛检测
  pull_request:
    paths:
      - 'packages/workflows/skills/**'
      - 'packages/brain/scripts/ci/**'
      - 'packages/brain/src/**'
      - '.github/workflows/brain-ci-deploy.yml'

concurrency:
  group: brain-autodeploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Skill 契约 CI 防线三件套（仅 PR）─────────────────────────────────────
  # changed-test-router 选测 + skill 契约测试（5 类不变量）+ 合同存在性。
  # 判定逻辑全落在可本地跑的 node 脚本里，yaml 只做接线。
  skill-contract-guard:
    name: Skill Contract Guard (PR)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      - name: 三件套①② changed-test-router 选测 + skill 契约测试（5 类不变量）
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || echo "")
          echo "📋 本 PR 改动文件："; echo "$CHANGED"
          echo "── changed-test-router fs 依赖选测 ──"
          node packages/brain/scripts/ci/changed-test-router.mjs $CHANGED || true
          echo "── 跑 skill 契约测试（守 5 类不变量现网快照）──"
          npx vitest run packages/brain/scripts/ci/__tests__/skill-contract.test.mjs --reporter=verbose
      - name: 三件套③ 合同存在性校验（harness PR 必带 contract-draft.md）
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git diff --name-only "$BASE"...HEAD > /tmp/pr-diff.txt 2>/dev/null || true
          node packages/brain/scripts/ci/contract-exists.mjs --fixture /tmp/pr-diff.txt

  # ─── Island Gate: PR 新增 packages/brain/src/** 文件孤岛检测 ─────────────────
  # 独立于 deploy job（互不 needs），孤岛文件 → exit 1，带 import 文件 → exit 0
  # B7: island-gate 失败不阻 deploy，deploy 不含 island-gate 在 needs 中
  island-gate:
    name: Island Gate (PR — src/** 新增文件孤岛检测)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'cecelia' }}
          POSTGRES_DB: cecelia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 全量 migrations（cecelia_test DB）
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'cecelia' }}
        run: |
          cd packages/brain
          node src/migrate.js
          echo "✅ migrations 完成"

      - name: Island Gate — 新增文件孤岛检测
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'cecelia' }}
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          ADDED_FILES=$(git diff --diff-filter=A --name-only "${BASE}...HEAD" 2>/dev/null | grep '^packages/brain/src/' | tr '\n' ',' | sed 's/,$//' || echo "")
          echo "新增文件: ${ADDED_FILES:-（无）}"
          node packages/brain/scripts/ci/island-gate.mjs --fixture-files="${ADDED_FILES}"
          echo "island-gate exit: $?"

  # ─── Gate 3: Brain HTTP 自动部署（仅 push:main，PR 不部署）────────────────
  deploy:
    name: Deploy Brain (Gate 3)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5221' }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: SHA 对账（PROD_SHA vs HEAD_SHA）
        # FR-03: 替换旧 gate3-changed-paths.sh 判变逻辑，改用 SHA 对账决定是否部署。
        # squash merge 后 changed_paths 为空 → 旧路径假跳过 → 此修复从根本解决（C-01）。
        # fail open 规则（C-06）：curl /health 失败或 git_sha=unknown → 视为"需部署"。
        id: sha_check
        run: |
          set +e
          HEAD_SHA="${{ github.sha }}"
          echo "HEAD_SHA=${HEAD_SHA}"

          # 取生产容器当前 SHA（curl 失败或字段 unknown → fail open）
          HEALTH_JSON=$(curl -sf --connect-timeout 10 --max-time 15 \
            "${BRAIN_URL}/api/brain/health" 2>/dev/null || echo "")
          if [ -z "$HEALTH_JSON" ]; then
            echo "PROD_SHA=<unreachable>"
            echo "⚠️  /health 不可达 → fail open，视为需部署（C-06 fail-open）"
            echo "deploy_needed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          PROD_SHA=$(echo "$HEALTH_JSON" | jq -r '.git_sha // "unknown"' 2>/dev/null || echo "unknown")
          echo "PROD_SHA=${PROD_SHA}"

          if [ "$PROD_SHA" = "unknown" ] || [ -z "$PROD_SHA" ] || [ "$PROD_SHA" = "null" ]; then
            echo "⚠️  PROD_SHA=unknown → fail open，视为需部署（C-06 fail-open）"
            echo "deploy_needed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$PROD_SHA" == "$HEAD_SHA" ]; then
            echo "SHA 相同，跳过部署（C-02 幂等）"
            echo "deploy_needed=false" >> $GITHUB_OUTPUT
          else
            echo "SHA 不等（PROD=$PROD_SHA HEAD=$HEAD_SHA）→ 触发部署（C-01）"
            echo "deploy_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: 触发 Brain HTTP Deploy
        id: trigger
        if: steps.sha_check.outputs.deploy_needed == 'true'
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN secret 未配置"
            exit 1
          fi

          echo "触发 Brain HTTP 部署..."
          echo "  URL: ${BRAIN_URL}/api/brain/deploy"
          echo ""

          HTTP_CODE=$(curl -s -o /tmp/deploy_resp.txt -w "%{http_code}" \
            -X POST "${BRAIN_URL}/api/brain/deploy" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --connect-timeout 30 --max-time 60 2>/dev/null || echo "000")

          echo "HTTP 状态: $HTTP_CODE"
          if [ -f /tmp/deploy_resp.txt ]; then cat /tmp/deploy_resp.txt; fi
          echo ""

          # 409 = deploy 正在进行中（另一个 Gate3 或 deploy.yml 实例）
          # 注意：进行中的 deploy 可能是更早触发的旧 SHA，不一定包含本次变更。
          # 不直接 skip：把 skipped=false 写入 output，让后续 smoke 步骤继续等待，
          # 直到正确版本上线（或 600s 预算耗尽后 assert 失败 → CI 红灯）。
          if [ "$HTTP_CODE" = "409" ]; then
            echo "::warning::Brain deploy 已在进行中（409）— 等待当前 deploy 完成后由 Smoke 步骤验证版本"
            echo "skipped=false" >> $GITHUB_OUTPUT
          elif [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deploy webhook 已触发"
            echo "skipped=false" >> $GITHUB_OUTPUT
          else
            echo "::error::Deploy webhook 失败（HTTP $HTTP_CODE）"
            exit 1
          fi

      - name: 等待 Deploy 完成
        if: steps.sha_check.outputs.deploy_needed == 'true' && steps.trigger.outputs.skipped != 'true'
        run: |
          echo "轮询 /api/brain/deploy/status（最多 300s）..."
          MAX_WAIT=300
          INTERVAL=10
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS_JSON=$(curl -s --connect-timeout 10 --max-time 15 \
              "${BRAIN_URL}/api/brain/deploy/status" 2>/dev/null \
              || echo '{"status":"unknown"}')
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")

            echo "  [${ELAPSED}s] status=$STATUS"

            if [ "$STATUS" = "success" ]; then
              ELAPSED_MS=$(echo "$STATUS_JSON" | jq -r '.elapsed_ms // "?"' 2>/dev/null || echo "?")
              echo "✅ Deploy 成功（${ELAPSED_MS}ms）"
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              ERR=$(echo "$STATUS_JSON" | jq -r '.error // "未知错误"' 2>/dev/null || echo "未知错误")
              echo "::error::Deploy 失败: $ERR"
              exit 1
            elif [ "$STATUS" = "idle" ] && [ $ELAPSED -gt 30 ]; then
              echo "::warning::Deploy status idle（${ELAPSED}s 后）— 可能无变更，视为成功"
              exit 0
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "::warning::Deploy status 轮询超时（${MAX_WAIT}s）— webhook 已接受，结果未知；assert 步将继续等待最多 600s"

      - name: Smoke — Brain 部署效果确认（版本 + 真重启）
        if: steps.sha_check.outputs.deploy_needed == 'true' && steps.trigger.outputs.skipped != 'true'
        # 反"假成功"（2026-07-06 实证）：deploy/status=success 或 idle-视为成功 都可能谎报
        # （容器 no-op 未重启，uptime 未变）。此处用 assert-deploy-effect.sh 做权威效果确认：
        #   /health.version == 本次应上线版本  且  uptime 新鲜（容器真重启）
        # 断言失败 => Gate3 失败，绝不谎报 success（backstop 上面 success/idle 两条乐观出口）。
        run: |
          sleep 5
          EXPECTED_VERSION=$(node -p "require('./packages/brain/package.json').version")
          echo "Brain 部署效果确认：期望版本=$EXPECTED_VERSION"

          # 先打印 /health 原文便于排查
          curl -s "${BRAIN_URL}/api/brain/health" --connect-timeout 15 --max-time 30 || true
          echo ""

          # 15min 内的 uptime 视为"本次部署新鲜重启"；病历里未重启的 uptime 是小时级
          # 第 4 参 600 = 等待预算：Gate3 部署实测 ~7min > 上一步 300s 轮询（2026-07-15 假红实证），
          # 断言自带等待，预算内旧版本/不可达每 15s 重试，追上即 SUCCESS。
          set +e
          VERDICT=$(bash scripts/ci/assert-deploy-effect.sh "${BRAIN_URL}" "$EXPECTED_VERSION" 900 600)
          CODE=$?
          set -e
          echo "$VERDICT"
          if [ $CODE -eq 0 ]; then
            echo "✅ 部署效果确认通过（版本正确 + 容器真重启）"
          else
            echo "::error::部署效果确认失败（$VERDICT）—— Gate3 不谎报 success，请检查容器是否真重启/版本是否上线"
            exit 1
          fi

  # ─── L1 SHA 对账串链测试（PR + push 都跑，INV-03）────────────────────────
  sha-account-l1:
    name: L1 SHA Account Tests (Gate3)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 运行 SHA 对账串链测试（BEHAVIOR-01..07）
        run: |
          bash tests/regression/gate3-sha-truth/sha-account.test.sh
        env:
          BRAIN_URL: ""  # 无真实 Brain，降级源码层验证

  # ─── Gate 2: 部署失败时创建 Brain P0 任务 ────────────────────────────────
  on_deploy_failure:
    name: Gate 2 — P0 Alert on Failure
    needs: deploy
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5221' }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: 创建 Brain P0 告警任务
        run: |
          FAILED_SHA="${{ github.sha }}"
          FAILED_SHA_SHORT="${FAILED_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG=$(curl -s "https://api.github.com/repos/${{ github.repository }}/commits/${FAILED_SHA}" \
            -H "Authorization: Bearer ${{ github.token }}" 2>/dev/null \
            | jq -r '.commit.message | split("\n")[0]' 2>/dev/null || echo "未知提交")

          echo "[Gate 2] Brain CI Deploy 失败 — 创建 P0 告警任务"
          echo "  commit: $FAILED_SHA_SHORT ($COMMIT_MSG)"
          echo "  run: $RUN_URL"
          echo ""

          HTTP_CODE=$(curl -s -o /tmp/task_resp.txt -w "%{http_code}" \
            -X POST "${BRAIN_URL}/api/brain/tasks" \
            -H "Content-Type: application/json" \
            -d "{
              \"title\": \"[P0] Brain CI Deploy 失败 — ${FAILED_SHA_SHORT}\",
              \"description\": \"Gate 3 自动部署失败。\n\n**Commit**: \`${FAILED_SHA}\`\n**消息**: ${COMMIT_MSG}\n**Workflow**: ${RUN_URL}\n\n请检查 Brain deploy 日志，确定是否需要 revert。\",
              \"priority\": \"p0\",
              \"status\": \"todo\",
              \"task_type\": \"hotfix\",
              \"labels\": [\"deploy-failure\", \"gate3\", \"p0\"]
            }" \
            --connect-timeout 30 --max-time 60 2>/dev/null || echo "000")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Brain P0 告警任务已创建"
            if [ -f /tmp/task_resp.txt ]; then cat /tmp/task_resp.txt; fi
          else
            echo "::warning::Brain P0 任务创建失败（HTTP $HTTP_CODE）— Brain 可能已宕机，请手动检查"
            echo "  手动排查: curl ${BRAIN_URL}/api/brain/health"
          fi
