name: Brain Standalone Staging Verification

# main 的自动 staging 已成为 brain-deploy.sh 的生产前硬门。
# 本入口只用于主动重验，和生产链共用宿主发布锁，不再先等 production。
on:
  workflow_dispatch:
concurrency:
  group: brain-standalone-staging
  cancel-in-progress: false
jobs:
  staging_deploy_and_smoke:
    name: Verify isolated staging candidate
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - uses: actions/checkout@v4
      - name: 请求固定 SHA 的隔离候选
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg sha "$GITHUB_SHA" '{staging:true,sha:$sha}')
          curl -fsS --connect-timeout 30 --max-time 60 -X POST "$BRAIN_URL/api/brain/deploy" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'Content-Type: application/json' -d "$payload" -o /tmp/staging-request.json
          echo "STAGING_REQUEST_ID=$(jq -er .request_id /tmp/staging-request.json)" >> "$GITHUB_ENV"
      - name: 等待同 SHA、同镜像的隔离验证回执
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/wait-for-staging.sh
