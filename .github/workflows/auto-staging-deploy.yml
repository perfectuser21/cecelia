name: Authorized Kernel Staging Effect

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Durable Kernel ReleaseRun UUID
        required: true
      merge_sha:
        description: Exact merge SHA
        required: true
      release_authorization:
        description: Persisted staging effect authorization UUID
        required: true

concurrency:
  group: kernel-release
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to deployment network
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Execute authorized staging effect
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          RELEASE_AUTHORIZATION: ${{ inputs.release_authorization }}
        run: |
          set -euo pipefail
          test -n "$BRAIN_URL" && test -n "$DEPLOY_TOKEN"
          HTTP_CODE=$(curl --silent --show-error --output /tmp/release-response.json --write-out "%{http_code}" \
            -X POST "${BRAIN_URL}/api/brain/deploy" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"staging\":true,\"release_run_id\":\"${RELEASE_RUN_ID}\",\"merge_sha\":\"${MERGE_SHA}\",\"release_authorization\":\"${RELEASE_AUTHORIZATION}\"}")
          test "$HTTP_CODE" = "202"
          jq -e '.status == "accepted"' /tmp/release-response.json
