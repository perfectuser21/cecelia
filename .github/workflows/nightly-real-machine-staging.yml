name: Nightly Real Machine Staging (ROG)

# 每晚在 xian-rog (ROG, staging 指向) 跑真机 full check:
#   - 微信气泡门: WeChat 4.1.8 进程在线 + listen_chat.py --dryrun 通过
#   - 抖音keyword读侧: keyword-search-douyin.cjs 能搜到 ≥1 条视频
# 红 → 自动开 Brain issue (xian-rog 已在 Tailscale 内网，直连 Brain 100.71.151.105:5221)
# 补掉 6站2轨模型④站真机nightly空白，替掉人肉staging复测

on:
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = 北京 02:00
  workflow_dispatch:
    inputs:
      smoke_kw:
        description: '抖音测试关键词（默认：美甲）'
        required: false
        default: '美甲'

concurrency:
  group: nightly-real-machine-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging-full-check:
    name: ROG Staging Full Check（微信气泡门 + 抖音keyword）
    runs-on: [self-hosted, wechat-capable]
    timeout-minutes: 20
    env:
      BRAIN_URL: http://100.71.151.105:5221
      SMOKE_KW: ${{ github.event.inputs.smoke_kw || '美甲' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── ① 微信气泡门 ──────────────────────────────────────────────────────────
      - name: 微信气泡门（WeChat bubble gate）
        id: wechat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "=== 微信气泡门 ==="

          # 1. WeChat 进程在线
          $proc = Get-Process -Name "WeChat" -ErrorAction SilentlyContinue
          if (-not $proc) {
            Write-Error "WeChat 进程未运行 — staging 机器状态异常"
            exit 1
          }
          Write-Host "✅ WeChat 进程在线 (PID=$($proc.Id | Select-Object -First 1))"

          # 2. 定位最新 agent 目录
          $agentDir = Get-ChildItem "C:\Users\*\Desktop\zenithjoy-agent-v*" -Directory -ErrorAction SilentlyContinue `
            | Sort-Object Name | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $agentDir) {
            Write-Error "找不到 ZenithJoy agent 安装目录 (C:\Users\*\Desktop\zenithjoy-agent-v*)"
            exit 1
          }
          Write-Host "✅ agent 目录: $agentDir"
          echo "AGENT_DIR=$agentDir" >> $env:GITHUB_ENV

          # 3. listen_chat.py 存在
          $listenChat = Join-Path $agentDir "wechat-rpa\listen_chat.py"
          if (-not (Test-Path $listenChat)) {
            Write-Error "listen_chat.py 不存在: $listenChat"
            exit 1
          }
          Write-Host "✅ listen_chat.py 存在"

          # 4. 定位 Python
          $pythonExe = Get-Command python -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $pythonExe -or -not (Test-Path $pythonExe)) {
            $pythonExe = "C:\Users\asus\anaconda3\python.exe"
          }
          if (-not (Test-Path $pythonExe)) {
            Write-Error "Python 不可达: $pythonExe"
            exit 1
          }
          Write-Host "✅ Python: $pythonExe"

          # 5. listen_chat --dryrun（不发真消息，验证导入链路）
          $env:WECHAT_DRAFT_API_DRYRUN = "1"
          $injectMsg = '{"sender":"nightly-smoke","wechat_id":"wx_nightly","content":"staging bubble check"}'
          $out = & $pythonExe $listenChat --dryrun "--inject-message=$injectMsg" 2>&1
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Write-Host "listen_chat --dryrun 输出:"
            $out | ForEach-Object { Write-Host $_ }
            Write-Error "listen_chat --dryrun 失败 (exit $exitCode)"
            exit 1
          }

          # 验证输出含 "ok": true
          $jsonLine = $out | Where-Object { $_ -match '^\{.*"ok"\s*:\s*true' } | Select-Object -First 1
          if (-not $jsonLine) {
            Write-Host "完整输出:"
            $out | ForEach-Object { Write-Host $_ }
            Write-Error "listen_chat --dryrun 未返回 ok:true（链路异常）"
            exit 1
          }

          Write-Host "✅ 微信气泡门 PASS（listen_chat --dryrun ok:true）"
        continue-on-error: true

      # ── ② 抖音keyword读侧 ─────────────────────────────────────────────────────
      - name: 抖音keyword读侧（Douyin keyword read）
        id: douyin
        shell: bash
        env:
          SMOKE_KW: ${{ env.SMOKE_KW }}
        run: |
          set -uo pipefail
          echo "=== 抖音keyword读侧 KW=$SMOKE_KW ==="

          # 定位最新 agent 目录（优先用上一步写入的 AGENT_DIR）
          if [ -n "${AGENT_DIR:-}" ] && [ -d "$AGENT_DIR" ]; then
            echo "✅ agent 目录（来自 wechat step）: $AGENT_DIR"
          else
            AGENT_DIR=$(ls -d /c/Users/*/Desktop/zenithjoy-agent-v* 2>/dev/null \
              | sort -t'v' -k2 -V | tail -1 || true)
          fi
          [ -n "$AGENT_DIR" ] && [ -d "$AGENT_DIR" ] \
            || { echo "❌ 找不到 agent 安装目录"; exit 1; }

          # 定位 Node.js（优先从 agent runtime 目录找）
          NODE_EXE=$(ls /c/Users/*/AppData/Roaming/ZenithJoy/runtime/nodejs/node.exe 2>/dev/null | head -1 || true)
          [ -f "$NODE_EXE" ] || NODE_EXE=$(which node 2>/dev/null || true)
          [ -f "$NODE_EXE" ] || { echo "❌ 找不到 node.exe"; exit 1; }
          echo "✅ node: $NODE_EXE"

          # keyword-search-douyin.cjs 存在
          KW_SCRIPT="$AGENT_DIR/publishers/keyword-search-douyin.cjs"
          [ -f "$KW_SCRIPT" ] || { echo "❌ keyword-search-douyin.cjs 不存在: $KW_SCRIPT"; exit 1; }
          echo "✅ keyword-search-douyin.cjs 存在"

          # 执行关键词搜索
          KW_OUT=$("$NODE_EXE" "$KW_SCRIPT" "$SMOKE_KW" 2>&1)
          echo "$KW_OUT" | grep -v '^{' | head -20

          KW_JSON=$(echo "$KW_OUT" | grep '^{' | tail -1)
          [ -n "$KW_JSON" ] || {
            echo "❌ keyword-search 无 JSON 输出"
            echo "完整输出: $KW_OUT"
            exit 1
          }

          TMP_JSON=$(mktemp)
          trap 'rm -f "$TMP_JSON"' EXIT
          echo "$KW_JSON" > "$TMP_JSON"

          KW_OK=$("$NODE_EXE" -e \
            "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); \
             process.stdout.write(String(d.ok))" "$TMP_JSON")

          if [ "$KW_OK" != "true" ]; then
            ERR=$("$NODE_EXE" -e \
              "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); \
               process.stdout.write(d.error||'unknown')" "$TMP_JSON")
            if [ "$ERR" = "DOUYIN_SESSION_EXPIRED" ]; then
              echo "❌ Douyin session 过期（xian-rog 需人工续 session）"
            else
              echo "❌ keyword-search 失败: $ERR"
            fi
            exit 1
          fi

          # 搜索结果 ≥1 条
          COUNT=$("$NODE_EXE" -e \
            "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); \
             process.stdout.write(String((d.videos||d.results||[]).length))" "$TMP_JSON")
          [ "${COUNT:-0}" -ge 1 ] || {
            echo "❌ keyword-search 返回 0 条结果 (kw=$SMOKE_KW)"
            exit 1
          }

          echo "✅ 抖音keyword读侧 PASS — 搜到 $COUNT 条视频 (kw=$SMOKE_KW)"
        continue-on-error: true

      # ── ③ 汇总 + 决定最终状态 ─────────────────────────────────────────────────
      - name: 汇总结果
        id: summary
        if: always()
        shell: bash
        run: |
          WECHAT="${{ steps.wechat.outcome }}"
          DOUYIN="${{ steps.douyin.outcome }}"

          {
            echo "| 检查项 | 结果 |"
            echo "|--------|------|"
            [ "$WECHAT" = "success" ] \
              && echo "| 微信气泡门 | ✅ PASS |" \
              || echo "| 微信气泡门 | ❌ FAIL ($WECHAT) |"
            [ "$DOUYIN" = "success" ] \
              && echo "| 抖音keyword读侧 | ✅ PASS |" \
              || echo "| 抖音keyword读侧 | ❌ FAIL ($DOUYIN) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$WECHAT" = "success" ] && [ "$DOUYIN" = "success" ]; then
            echo "✅ nightly staging 全绿"
          else
            echo "❌ nightly staging 有红项 (wechat=$WECHAT douyin=$DOUYIN)"
            exit 1
          fi

      # ── ④ 失败时开 Brain issue ────────────────────────────────────────────────
      - name: 失败时开 Brain issue
        if: failure()
        shell: bash
        env:
          WECHAT_STATUS: ${{ steps.wechat.outcome }}
          DOUYIN_STATUS: ${{ steps.douyin.outcome }}
        run: |
          set -uo pipefail

          FAILED=""
          [ "${WECHAT_STATUS:-skipped}" != "success" ] && FAILED="${FAILED}微信气泡门; "
          [ "${DOUYIN_STATUS:-skipped}" != "success" ] && FAILED="${FAILED}抖音keyword读侧; "
          [ -z "$FAILED" ] && FAILED="(检查步骤未完成)"

          TITLE="[nightly-staging] ROG 真机 staging 红灯 — ${FAILED}"
          BODY="nightly-real-machine-staging 自动检测 $(date '+%Y-%m-%d') 失败。失败项：${FAILED}。详情: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # 去重：已有同名 In progress issue 则跳过
          OPEN=$(curl -sf -m 15 "$BRAIN_URL/api/brain/issues?status=In%20progress&limit=200" 2>/dev/null || echo '[]')
          if echo "$OPEN" | python3 -c "
import json,sys
data=json.load(sys.stdin)
items=data if isinstance(data,list) else data.get('issues',[])
print('\n'.join(i.get('title','') for i in items))
" 2>/dev/null | grep -qF "[nightly-staging]"; then
            echo "已有同名 open issue，跳过重复开"
            exit 0
          fi

          curl -sf -m 15 -X POST "$BRAIN_URL/api/brain/issues" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "
import json,sys
print(json.dumps({'title':sys.argv[1],'body':sys.argv[2],'priority':'P1'}))
" "$TITLE" "$BODY")" \
          && echo "✅ Brain issue 已开" \
          || echo "::warning::Brain issue 开失败（Brain 不可达 — 检查 xian-rog Tailscale 状态）"
