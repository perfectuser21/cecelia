name: Device patrol source admission baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trusted published main only
        env:
          RUN_REF: ${{ github.ref }}
        run: test "$RUN_REF" = refs/heads/main
      - uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Read immutable registered source identity
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
          CECELIA_INTERNAL_TOKEN: ${{ secrets.CECELIA_INTERNAL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail-with-body --silent --show-error --get "$BRAIN_URL/api/brain/implementation-ci/snapshot" \
            -H "X-Internal-Token: $CECELIA_INTERNAL_TOKEN" \
            --data-urlencode scope=cecelia-device-patrol \
            --data-urlencode repo=perfectuser21/zenithjoy-workspace \
            --data-urlencode revision=73bd094ae34ecccb1514b09fd4fec8733b846769 > evidence/head.json
          jq -e '.snapshot.scope == "cecelia-device-patrol" and .snapshot.repo == "perfectuser21/zenithjoy-workspace" and .snapshot.registration.provenance.base_revision == "73bd094ae34ecccb1514b09fd4fec8733b846769" and .snapshot.registration.provenance.introduced_revision == "f0923e5396bade1986ba5452e766cabb5f4a30b3"' evidence/head.json
      - uses: actions/upload-artifact@v4
        with:
          name: device-patrol-admission-73bd094ae34ecccb1514b09fd4fec8733b846769
          path: evidence/head.json
          retention-days: 90
          if-no-files-found: error
