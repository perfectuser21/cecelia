name: Promote All to Production (Release Gate)

# 死规矩：机器负责查证据（没绿不让点），人工负责最终决策（手点放行）。
#
# Release Gate 前置检查（自动）：
#   ① staging smoke 最近绿  → auto-staging-deploy.yml 最近一次 main 分支 success
#   ② nightly-real-machine 最近 2 晚绿 → nightly-real-machine.yml 48h 内 ≥2 次 success
#   两项均绿 → promote job 解锁 → 用户手点（已输入 PROMOTE）→ 正式触发
#
# Promote 成功后：
#   打 release-YYYYMMDD-N tag（UTC 日期 + 当日序号），作为回滚锚。
#
# 人工放行：在 Actions 手点本 workflow，confirm 输入 PROMOTE。
# 不输入 PROMOTE → guard job 直接红，protect 零成本。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 PROMOTE 确认放行到生产（Release Gate 通过后才执行）'
        required: true
        default: ''
      reason:
        description: '本次 release 原因（可选，写入 tag message）'
        required: false
        default: ''

concurrency:
  group: promote-all-prod
  cancel-in-progress: false

jobs:
  # ── ① Release Gate（机器查证据）────────────────────────────────────────────
  release-gate:
    name: Release Gate (Evidence Check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.inputs.confirm == 'PROMOTE'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    outputs:
      gate_pass: ${{ steps.gate.outputs.gate_pass }}

    steps:
      - name: Check Release Evidence
        id: gate
        run: |
          set -uo pipefail
          FAIL=0

          echo "═══════════════════════════════════════════════"
          echo " Release Gate — 证据查证"
          echo "═══════════════════════════════════════════════"

          # ── 检查 ① staging smoke 最近绿 ──────────────────────────────────────
          echo ""
          echo "① 查 staging smoke（auto-staging-deploy.yml，main 分支）最近运行..."

          STAGING_JSON=$(gh api \
            "repos/${REPO}/actions/workflows/auto-staging-deploy.yml/runs?branch=main&status=completed&per_page=5" \
            2>/dev/null || echo '{"workflow_runs":[]}')

          STAGING_LAST=$(echo "$STAGING_JSON" | python3 -c "
          import json,sys
          runs = json.load(sys.stdin).get('workflow_runs',[])
          if runs:
              r = runs[0]
              print(r.get('conclusion','none'), r.get('updated_at',''), r.get('html_url',''))
          else:
              print('none  (no runs found)')
          " 2>/dev/null || echo "none  (parse error)")

          STAGING_CONCLUSION=$(echo "$STAGING_LAST" | awk '{print $1}')
          echo "  最近结论: $STAGING_LAST"

          if [ "$STAGING_CONCLUSION" = "success" ]; then
            echo "  ✅ staging smoke OK"
          else
            echo "  ❌ staging smoke 未绿（最近结论: ${STAGING_CONCLUSION}）"
            echo "     → 请先确认 staging 部署成功后再触发 promote"
            FAIL=1
          fi

          # ── 检查 ② nightly-real-machine 最近 2 晚绿 ─────────────────────────
          echo ""
          echo "② 查 nightly-real-machine 最近 48h 成功次数（需 ≥2）..."

          NIGHTLY_JSON=$(gh api \
            "repos/${REPO}/actions/workflows/nightly-real-machine.yml/runs?branch=main&status=completed&per_page=10" \
            2>/dev/null || echo '{"workflow_runs":[]}')

          NIGHTLY_OK=$(echo "$NIGHTLY_JSON" | python3 -c "
          import json,sys
          from datetime import datetime,timezone,timedelta
          runs = json.load(sys.stdin).get('workflow_runs',[])
          cutoff = datetime.now(timezone.utc) - timedelta(hours=48)
          ok = [r for r in runs
                if r.get('conclusion') == 'success'
                and datetime.fromisoformat(r['updated_at'].replace('Z','+00:00')) > cutoff]
          print(len(ok))
          for r in ok:
              print(' ', r['updated_at'], r.get('html_url',''))
          " 2>/dev/null || echo "0")

          NIGHTLY_COUNT=$(echo "$NIGHTLY_OK" | head -1)
          echo "  48h 内成功次数: $NIGHTLY_COUNT"
          echo "$NIGHTLY_OK" | tail -n +2

          if [ "${NIGHTLY_COUNT:-0}" -ge 2 ] 2>/dev/null; then
            echo "  ✅ nightly-real-machine 最近 2 晚均绿"
          else
            echo "  ❌ nightly-real-machine 未达标（48h 内成功 ${NIGHTLY_COUNT:-0} 次，需 ≥2）"
            echo "     → 等 2 晚 nightly 跑绿后再 promote，或先修 staging"
            FAIL=1
          fi

          echo ""
          echo "═══════════════════════════════════════════════"

          if [ "$FAIL" = "1" ]; then
            echo "::error::Release Gate 未通过 — 请查看上方具体原因"
            echo "gate_pass=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ Release Gate 通过 — 所有证据均绿，允许 promote"
          echo "gate_pass=true" >> "$GITHUB_OUTPUT"

  # ── ② Promote → Production ─────────────────────────────────────────────────
  promote:
    name: Promote → Production
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.release-gate.outputs.gate_pass == 'true'

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: 触发生产部署（Brain + Dashboard）
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5221' }}
        run: |
          set -uo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::error::DEPLOY_TOKEN secret 未配置"
            exit 1
          fi

          echo "Release Gate 通过，触发全量生产部署（Brain + Dashboard）"
          echo "  URL: ${BRAIN_URL}/api/brain/deploy"

          HTTP_CODE=$(curl -s -o /tmp/promote_resp.txt -w "%{http_code}" \
            -X POST "${BRAIN_URL}/api/brain/deploy" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"changed_paths": ["packages/brain/src/server.js", "apps/dashboard/src/App.tsx"]}' \
            --connect-timeout 30 --max-time 60)

          echo "Response ($HTTP_CODE):"
          cat /tmp/promote_resp.txt
          echo ""

          if [ "$HTTP_CODE" = "409" ]; then
            echo "::notice::Deploy 正在进行中（409），当前变更将被纳入"
            exit 0
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ 生产部署 webhook 已触发"
          else
            echo "::error::Deploy webhook 失败（HTTP $HTTP_CODE）"
            exit 1
          fi

      - name: 等待生产部署完成
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5221' }}
        run: |
          set -uo pipefail
          echo "轮询 /api/brain/deploy/status（最多 300s）..."
          MAX_WAIT=300; INTERVAL=10; ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(curl -s --connect-timeout 10 --max-time 15 \
              "${BRAIN_URL}/api/brain/deploy/status" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" \
              2>/dev/null || echo "unknown")
            echo "  [${ELAPSED}s] status=${STATUS}"
            if [ "$STATUS" = "success" ]; then
              echo "✅ 生产部署完成"
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo "::error::生产部署失败，请检查 Brain 日志"
              exit 1
            elif [ "$STATUS" = "idle" ] && [ $ELAPSED -gt 30 ]; then
              echo "::notice::Status idle — deploy 可能已跳过（无变更），视为成功"
              exit 0
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "::warning::等待超时（${MAX_WAIT}s），deploy 结果未知，请手动检查 Brain 日志"
          exit 1

      - name: Production Smoke（验 5221 真健康）
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5221' }}
        run: |
          set -uo pipefail
          echo "验证生产 Brain 健康..."
          sleep 5
          HTTP_CODE=$(curl -s -o /tmp/prod_health.txt -w "%{http_code}" \
            "${BRAIN_URL}/api/brain/health" \
            --connect-timeout 15 --max-time 30 2>/dev/null || echo "000")
          echo "Health check HTTP: $HTTP_CODE"
          cat /tmp/prod_health.txt 2>/dev/null || true
          echo ""
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Production smoke 通过"
          else
            echo "::error::Production smoke 失败（HTTP $HTTP_CODE）"
            exit 1
          fi

  # ── ③ 打 Release Tag（回滚锚）──────────────────────────────────────────────
  tag-release:
    name: Tag Release (release-YYYYMMDD-N)
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create Release Tag
        env:
          REASON: ${{ github.event.inputs.reason }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE=$(date -u +%Y%m%d)

          # 找当日最大序号
          N=1
          while git ls-remote --tags origin "refs/tags/release-${DATE}-${N}" \
                | grep -q "release-${DATE}-${N}"; do
            N=$((N + 1))
          done

          TAG="release-${DATE}-${N}"
          MSG="Release ${TAG}"
          if [ -n "${REASON:-}" ]; then
            MSG="${MSG}: ${REASON}"
          fi
          MSG="${MSG}

          Promoted by: ${{ github.actor }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Release Gate: staging smoke ✅ + nightly real-machine ✅"

          git tag -a "$TAG" -m "$MSG"
          git push origin "$TAG"
          echo "✅ Release tag created: $TAG"
          echo "   回滚命令: git checkout $TAG && bash scripts/brain-deploy.sh"

  # ── Guard：confirm 输入错误时立即红 ────────────────────────────────────────
  guard:
    name: Confirm Input Guard
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm != 'PROMOTE'
    steps:
      - run: |
          echo "❌ 确认输入不正确，必须填写 PROMOTE"
          echo "当前输入: '${{ github.event.inputs.confirm }}'"
          exit 1
