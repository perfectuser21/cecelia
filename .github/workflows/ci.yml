name: CI
'on':
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      resource_canary:
        description: 资源专项（legacy 含历史 attempt/OOM）
        type: choice
        default: none
        options: [none, linux, app-server, legacy, all]
  schedule:
    - cron: 0 3 * * 1
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.action == 'closed' && format('closed-pr-{0}', github.event.pull_request.number) || github.event_name == 'schedule' && 'weekly-codeql' || github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && 'dependabot' || github.ref }}
  queue: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && 'max' || 'single' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.user.login != 'dependabot[bot]' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      preview_ui: ${{ steps.scope.outputs.preview_ui }}
      resource_plan: ${{ steps.resources.outputs.resource_plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require actual Brain version increment
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env: {BASE_REF: '${{ github.event.pull_request.base.sha || github.event.before }}', HEAD_REF: '${{ github.event.pull_request.head.sha || github.sha }}'}
        run: bash scripts/ci/check-brain-version-bump.sh
      - name: Select complete component checks
        id: scope
        env: {EVENT_NAME: '${{ github.event_name }}', BASE_SHA: '${{ github.event.pull_request.base.sha || github.event.before }}', HEAD_SHA: '${{ github.sha }}'}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node scripts/ci/basic-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          elif [ "$EVENT_NAME" = push ]; then
            node scripts/ci/basic-scope.mjs --full --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node scripts/ci/basic-scope.mjs --full --head "$HEAD_SHA"
          fi
      - name: Select actual resource canary inputs
        id: resources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          RESOURCE_CANARY: ${{ inputs.resource_canary || 'none' }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/ci/resource-canary-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --manual "$RESOURCE_CANARY"
          else
            node scripts/ci/resource-canary-scope.mjs --head "$HEAD_SHA" --manual "$RESOURCE_CANARY"
          fi
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install locked dependency manifests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check dependency vulnerabilities
        run: |
          bash scripts/ci/dep-audit-runtime-high.sh
          bash scripts/ci/dep-audit-critical.sh
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  checks:
    needs: plan
    name: ${{ format('Check ({0} {1})', matrix.component, matrix.shard) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: ${{ matrix.component == 'brain-integration' && 'mirror.gcr.io/pgvector/pgvector:pg15' || '' }}
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: isolated-ci, POSTGRES_DB: cecelia_scratch}
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U ci -d cecelia_scratch" --health-interval 5s --health-timeout 5s --health-retries 12'
    env:
      CI: 'true'
      POSTGRES_INTEGRATION: ${{ matrix.component == 'brain-integration' && '1' || '0' }}
      API_PG_INTEGRATION: '0'
      CI_CHECK_SCOPE: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CODEX_RELAY_HOME: /tmp/ci-fake-codex-home
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: cecelia_scratch
      DB_USER: ci
      DB_PASSWORD: isolated-ci
      DATABASE_URL: ${{ matrix.component == 'brain-integration' && 'postgresql://ci:isolated-ci@127.0.0.1:5432/cecelia_scratch' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Prepare Ubuntu package sources
        run: node scripts/ci/prepare-ubuntu-archive.mjs
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep jq zsh libxml2-utils
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/dockerhub-mirror
        if: matrix.component == 'image'
      - name: Run actual checks
        env: {COMPONENT: '${{ matrix.component }}', SHARD: '${{ matrix.shard }}'}
        run: node scripts/ci/run-basic-check.mjs "$COMPONENT" "$SHARD"
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  resource-canaries:
    needs: plan
    outputs:
      app_server: ${{ steps.app_server.outcome }}
      app_server_rpc: ${{ steps.app_server_rpc.outcome }}
      legacy: ${{ steps.legacy.outcome }}
      linux: ${{ steps.linux.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build fixed CLI test image
        run: |
          docker build -t cecelia-appserver-ci - <<'DOCKERFILE'
          FROM mirror.gcr.io/library/node:22-bookworm-slim
          RUN npm install -g @openai/codex@0.158.0
          DOCKERFILE
          echo "APP_SERVER_CANARY_IMAGE=$(docker image inspect --format '{{.Id}}' cecelia-appserver-ci)" >> "$GITHUB_ENV"
        if: '!cancelled() && fromJSON(needs.plan.outputs.resource_plan).app_server'
      - id: app_server
        name: Two independent offline instances sharing HOME through the real runner
        run: |
          set -o pipefail
          node packages/brain/scripts/fleet-worker/app-server-canary.cjs | tee app-server-canary.log
        if: '!cancelled() && fromJSON(needs.plan.outputs.resource_plan).app_server'
      - id: app_server_rpc
        name: Direct shim HTTP RPC and explicit generation cleanup
        run: |
          set -o pipefail
          node packages/brain/scripts/fleet-worker/app-server-rpc-canary.cjs | tee app-server-rpc-canary.log
        if: '!cancelled() && fromJSON(needs.plan.outputs.resource_plan).app_server'
      - name: Keep identity and quota evidence (no credentials or model calls)
        if: always() && fromJSON(needs.plan.outputs.resource_plan).app_server
        uses: actions/upload-artifact@v4
        with:
          name: app-server-canary-evidence
          path: |
            app-server-canary.log
            app-server-rpc-canary.log
          if-no-files-found: ignore
      - name: Resolve isolated test images to immutable IDs
        run: |
          docker pull mirror.gcr.io/library/node:22-bookworm-slim
          docker tag mirror.gcr.io/library/node:22-bookworm-slim node:22-bookworm-slim
          docker pull mirror.gcr.io/pgvector/pgvector:pg15
          docker tag mirror.gcr.io/pgvector/pgvector:pg15 pgvector/pgvector:pg15
          echo "HARNESS_LIMITS_CANARY_IMAGE=$(docker image inspect --format '{{.Id}}' node:22-bookworm-slim)" >> "$GITHUB_ENV"
          echo "HARNESS_LIMITS_CANARY_POSTGRES_IMAGE=$(docker image inspect --format '{{.Id}}' pgvector/pgvector:pg15)" >> "$GITHUB_ENV"
        if: '!cancelled() && fromJSON(needs.plan.outputs.resource_plan).legacy'
      - id: legacy
        name: Real adapters enforce one shared budget and isolate runner OOM
        run: |
          set -o pipefail
          node packages/brain/scripts/fleet-worker/attempt-limits-canary.cjs | tee attempt-runtime-limits.log
        if: '!cancelled() && fromJSON(needs.plan.outputs.resource_plan).legacy'
      - uses: actions/upload-artifact@v4
        if: always() && fromJSON(needs.plan.outputs.resource_plan).legacy
        with:
          name: attempt-runtime-limits-evidence
          path: attempt-runtime-limits.log
          if-no-files-found: ignore
      - name: Resolve test image to immutable local ID
        run: |
          docker pull mirror.gcr.io/library/node:24-bookworm-slim
          docker tag mirror.gcr.io/library/node:24-bookworm-slim node:24-bookworm-slim
          echo "LINUX_RESOURCE_CANARY_IMAGE=$(docker image inspect --format '{{.Id}}' node:24-bookworm-slim)" >> "$GITHUB_ENV"
        if: '!cancelled() && fromJSON(needs.plan.outputs.resource_plan).linux'
      - id: linux
        name: Read actual limited cgroup without granting execution
        run: |
          set -o pipefail
          node packages/brain/scripts/fleet-worker/linux-resource-canary.cjs | tee linux-resource-canary.log
        if: '!cancelled() && fromJSON(needs.plan.outputs.resource_plan).linux'
      - uses: actions/upload-artifact@v4
        if: always() && fromJSON(needs.plan.outputs.resource_plan).linux
        with:
          name: linux-resource-observation
          path: linux-resource-canary.log
          if-no-files-found: ignore
    if: github.event_name != 'schedule' && github.event.action != 'closed' && contains(needs.plan.outputs.resource_plan, 'true')
  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: onboarding_ci
          POSTGRES_PASSWORD: onboarding_ci
          POSTGRES_DB: cecelia_scratch
        ports:
          - '5432:5432'
        options: '--health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 真实采集与凭据生命周期回归
        run: node --test --test-concurrency=1 scripts/ops/__tests__/node-onboarding*.test.mjs
      - name: 接入结算与隔离回归（含真实数据库）
        working-directory: packages/brain
        env:
          NODE_ONBOARDING_TEST_DB: postgresql://onboarding_ci:onboarding_ci@localhost:5432/cecelia_scratch
        run: >-
          npx vitest run src/node-onboarding/__tests__/service.test.js src/node-onboarding/__tests__/settlement.test.js
          src/node-onboarding/__tests__/service-completion-isolation.test.js src/node-onboarding/__tests__/registry-adoption.test.js --maxWorkers=1
          --minWorkers=1
      - name: Linux自动接入与续验真实数据库回归
        working-directory: packages/brain
        env:
          TEST_DATABASE_URL: postgresql://onboarding_ci:onboarding_ci@localhost:5432/cecelia_scratch
        run: >-
          npx vitest run --config vitest.integration.config.js src/__tests__/integration/linux-controller-contract.pg.integration.test.js
          src/__tests__/integration/linux-onboarding-flow.pg.integration.test.js src/__tests__/integration/linux-script-authorization.pg.integration.test.js
          --maxWorkers=1 --minWorkers=1
      - name: Verify real process recovery without replay
        env:
          TEST_DB_URL: postgresql://onboarding_ci:onboarding_ci@127.0.0.1:5432/cecelia_scratch
        run: node packages/brain/scripts/smoke/commander-dbos-recovery-smoke.mjs
        if: '!cancelled()'
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  pwa-upgrade:
    name: Browser regression (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: package-lock.json}
      - name: Install workspace dependencies
        run: npm ci
        working-directory: .
      - name: Prepare Ubuntu package sources
        run: node scripts/ci/prepare-ubuntu-archive.mjs
        working-directory: .
      - name: Install Chromium
        timeout-minutes: 9
        run: node e2e/playwright-cli.mjs install chromium --with-deps
      - name: Verify stale PWA upgrade
        run: npm run test:pwa-upgrade
      - name: Verify task desk receipts
        run: npm run test:task-desk
      - name: Verify current cockpit inbox and destination routes
        run: |
          GIT_SHA="$GITHUB_SHA" npx --no-install vite build --outDir .dist-pwa-e2e
          node e2e/playwright-cli.mjs test --config ../../tests/regression/manual-ui/playwright.config.ts
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  skill-contracts:
    name: Skill contracts and restoration (${{ matrix.os }} / ${{ matrix.component }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            component: brain
          - os: ubuntu-latest
            component: root
          - os: windows-latest
            component: restore
          - os: macos-latest
            component: restore
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
        if: matrix.component != 'restore'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        if: matrix.component != 'restore'
      - name: Restore pinned skill sources
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
          expected-public-sha256: ${{ vars.SKILLS_SOURCE_PUBLIC_KEY_SHA256 }}
      - name: Run actual source contracts
        env:
          COMPONENT: ${{ matrix.component }}
          CI: 'true'
          POSTGRES_INTEGRATION: '0'
        run: node scripts/ci/run-skill-source-check.mjs "$COMPONENT"
        if: matrix.component != 'restore'
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, security-events: write}
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with: {languages: '${{ matrix.language }}', build-mode: none}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
  preview-deploy:
    name: Deploy Preview Environment
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && needs.plan.outputs.preview_ui == 'true' && (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'harness') && !startsWith(github.head_ref, 'auto-version-bump-'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read, pull-requests: write}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: 执行原预览步骤
        uses: ./.github/actions/preview-deploy
        with: {ts-authkey: '${{ secrets.TS_AUTHKEY }}', deploy-token: '${{ secrets.DEPLOY_TOKEN }}', brain-url: '${{ secrets.BRAIN_DEPLOY_URL || ''http://100.71.151.105:5241'' }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
    needs: plan
  preview-cleanup:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: write}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      - name: 执行原预览步骤
        uses: ./.github/actions/preview-cleanup
        with: {ts-authkey: '${{ secrets.TS_AUTHKEY }}', deploy-token: '${{ secrets.DEPLOY_TOKEN }}', brain-url: '${{ secrets.BRAIN_DEPLOY_URL || ''http://100.71.151.105:5241'' }}', github-token: '${{ secrets.GITHUB_TOKEN }}'}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
  ci-passed:
    name: 源码保底通过
    needs:
      - plan
      - security
      - checks
      - resource-canaries
      - runtime-integration
      - pwa-upgrade
      - skill-contracts
      - codeql
    if: always() && github.event_name != 'schedule' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require every selected check to finish successfully
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-basic-results.mjs
