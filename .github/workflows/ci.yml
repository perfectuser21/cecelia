name: CI

# Cecelia 统一 CI — 精简版
# 只做机器能客观判断的事：secrets + types + tests + build + lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# B6（extraMounts 凭据挂载接线）：executor=codex 的 harness-skill-relay 分支现要求
# CODEX_RELAY_HOME 已配置，未配置时 loud-fail 不 spawn（demo task a150998c 根治）。
# CI 里跑既有 sprints/07070902-relay-codex-executor/tests/*.test.ts（CONTRACT IS LAW，
# 不可改测试文件本身）需要这个 env 才能触发到各自测的并发/quota/落行逻辑，
# 否则会在新凭据 gate 处提前短路。全工作流统一注入假值，不影响生产（生产走
# docker-compose.yml 的 CODEX_RELAY_HOME）。
env:
  CODEX_RELAY_HOME: /tmp/ci-fake-codex-home

jobs:
  # ─── 变更检测 ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      brain: ${{ steps.detect.outputs.brain }}
      engine: ${{ steps.detect.outputs.engine }}
      workspace: ${{ steps.detect.outputs.workspace }}
      compose: ${{ steps.detect.outputs.compose }}
      dod: ${{ steps.detect.outputs.dod }}
      quality: ${{ steps.detect.outputs.quality }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          if ! git rev-parse "$BASE_REF" >/dev/null 2>&1; then
            echo "brain=true" >> $GITHUB_OUTPUT
            echo "engine=true" >> $GITHUB_OUTPUT
            echo "workspace=true" >> $GITHUB_OUTPUT
            echo "compose=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_REF"...HEAD 2>/dev/null || echo "")
          # brain=true 触发 brain-unit 等。sprints/ 的 test 文件不再触发（07-10 断源）：
          # 守活功能测试已升格进 src/__tests__/，sprints/** 已从 vitest include 移除。
          echo "brain=$(echo "$CHANGED" | grep -qE '^packages/brain/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "engine=$(echo "$CHANGED" | grep -q '^packages/engine/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "workspace=$(echo "$CHANGED" | grep -qE '^apps/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "compose=$(echo "$CHANGED" | grep -qE '^(docker-compose\.yml|packages/brain/Dockerfile|scripts/brain-(docker-up|docker-down|build)\.sh)$' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "dod=$(echo "$CHANGED" | grep -qE '^(DoD\.md|DoD\.cp-|task-card\.md|task-card-|\.task-|\.dod-|TASK_CARD\.cp-|PRD\.cp-)' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "quality=$(echo "$CHANGED" | grep -qE '^packages/quality/' && echo true || echo false)" >> $GITHUB_OUTPUT

  # ─── Docker Infrastructure Smoke ──────────────────────────
  # 保护 Brain 容器化基础设施（compose / Dockerfile / up/down 脚本）
  # 只在相关文件改动时跑；3 步覆盖 Linux runner 能做的（镜像 build / deps / yaml 合法）
  # macOS 专属（host.docker.internal / launchd 双 scope）靠 scripts/brain-docker-smoke.sh 本机跑
  docker-infra-smoke:
    if: needs.changes.outputs.compose == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build cecelia-brain image
        run: |
          set -e
          docker build -f packages/brain/Dockerfile -t cecelia-brain:ci .
      - name: Verify key deps resolve inside image
        run: |
          set -e
          docker run --rm cecelia-brain:ci node -e "
            require('@langchain/langgraph');
            require('@langchain/langgraph-checkpoint-postgres');
            require('express');
            console.log('deps ok');
          "
      - name: Validate docker-compose.yml syntax
        run: |
          set -e
          # .env.docker 在 gitignore 里，CI 无此文件 → 建空占位
          : > .env.docker
          docker compose -f docker-compose.yml config > /dev/null
          echo "compose yaml ok"

  # ─── Secrets 扫描 ──────────────────────────────────────────
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── DoD 格式检查（独立，所有 PR 必跑）────────────────────────────────
  # 从 engine-tests 移出，确保 Brain/Workspace PR 的 DoD 也被检查
  dod-format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: DoD 格式检查
        run: |
          TASK_CARD=""
          # DoD.md 是当前标准（v6 命名），.task-*.md / task-card.md 为旧兼容
          for f in DoD.md .task-*.md task-card.md; do
            [ -f "$f" ] && TASK_CARD="$f" && break
          done
          if [ -z "$TASK_CARD" ]; then
            echo "⏭️  未找到 DoD 文件，跳过格式检查"
            exit 0
          fi
          echo "📋 检查 DoD 文件: $TASK_CARD"
          if ! grep -q '\[BEHAVIOR\]' "$TASK_CARD"; then
            echo "::error::DoD 缺少 [BEHAVIOR] 条目，至少需要一个"
            exit 1
          fi
          echo "✅ 已发现 [BEHAVIOR] 条目"
          UNCHECKED=$(grep -c '^\- \[ \]' "$TASK_CARD" || true)
          if [ "$UNCHECKED" -gt 0 ]; then
            echo "::error::DoD 有 ${UNCHECKED} 个未验证条目（[ ]），push 前必须全部勾选为 [x]"
            grep '^\- \[ \]' "$TASK_CARD" | head -5
            exit 1
          fi
          echo "✅ DoD 格式检查通过"

  # ─── 依赖漏洞扫描（根目录，含 dev deps，high+ 级别硬拦）────────
  # 拦截 high 及以上（high / critical）漏洞，moderate 及以下仍允许。
  # 覆盖 high 级别漏洞，避免高危漏洞进入生产。
  dep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: npm audit — runtime high+
        run: |
          npm ci --ignore-scripts
          # runtime 依赖（packages/brain, apps/api）不允许 high+，--omit=dev 排除 vite/rollup/workbox 等 build 工具
          # 用带文档化包级白名单的脚本：对"无 non-breaking 修复 + 本项目用法下不可利用"的 advisory
          # 做文档化豁免（当前：uuid 仅用 v4 不可利用 / protobufjs 深层传递依赖 / dompurify 渲染可信内容），
          # 仍拦截所有其它 runtime high+。新 CVE 导致 fail 时见脚本内白名单纪律。
          bash scripts/ci/dep-audit-runtime-high.sh
      - name: npm audit — all deps critical
        run: |
          # 全量（含 dev）检查 critical，防供应链攻击。
          # 用带白名单的脚本：对"无 non-breaking 修复 + 本项目用法下不可利用"的 advisory
          # 做文档化豁免（当前：GHSA-5xrq-8626-4rwp vitest UI，dev-only，CI/生产不跑 UI server），
          # 仍拦截所有其它 critical。新 CVE 公布导致 fail 时见脚本内白名单纪律。
          bash scripts/ci/dep-audit-critical.sh

  # ─── Registry Lint（始终运行）────────────────────────────────
  registry-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Registry 完整性检查
        run: node scripts/registry-lint.mjs

  # ─── ESLint（brain 或 workspace 变更时）──────────────────────
  eslint:
    needs: changes
    if: needs.changes.outputs.brain == 'true' || needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # --max-warnings：冻结 warning 基线（2026-04-24 brain 降至 0 / apps/api=18）
      # 新增 warning 触发 CI fail，逼每个 PR 要么修、要么显式上调基线。
      # 每次降 warning 后，同步下调这里的数字（只允许下调，不允许上调）。
      - name: Lint Brain
        if: needs.changes.outputs.brain == 'true'
        run: cd packages/brain && npm ci && npx eslint src/ --max-warnings 0
      - name: Lint Workspace API
        if: needs.changes.outputs.workspace == 'true'
        run: cd apps/api && npm ci && npx eslint src/ --max-warnings 18

  # ─── PR Size Check（仅 PR 触发，harness PR 跳过）──────────────
  pr-size-check:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'harness')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查 PR 变更行数
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          ADDITIONS=$(git diff --numstat "$BASE"..."$HEAD" | awk '{s+=$1} END {print s+0}')
          DELETIONS=$(git diff --numstat "$BASE"..."$HEAD" | awk '{s+=$2} END {print s+0}')
          TOTAL=$((ADDITIONS + DELETIONS))

          echo "📊 PR 变更统计："
          echo "  新增: +${ADDITIONS} 行"
          echo "  删除: -${DELETIONS} 行"
          echo "  总计: ${TOTAL} 行"
          echo ""

          # 分档：>800（总计）警告，>3000（新增）硬失败（harness label PR 已在 job-level 跳过）
          # 注：硬门槛只数「新增」行——评审负担来自新增代码；纯删除（退役死页/清理）行数
          #     再多也是降低系统复杂度，强制拆分纯删除 PR 是反模式。删除行仍计入 800 软警告。
          # 注：Brain 功能 PR 含完整测试文件通常新增 1500-2500 行，3000 新增是合理硬上限。
          if [ "$ADDITIONS" -gt 3000 ]; then
            echo "::error::PR 新增 ${ADDITIONS} 行，超过 3000 行硬门槛，必须拆分"
            exit 1
          elif [ "$TOTAL" -gt 800 ]; then
            echo "⚠️  警告: PR 超过 800 行（总计 ${TOTAL} 行，新增 ${ADDITIONS}），建议拆分为更小的 PR"
            echo "::warning::PR 变更量总计 ${TOTAL} 行（新增 ${ADDITIONS}），超过 800 行阈值，建议拆分"
          else
            echo "✅ PR 大小合理（总计 ${TOTAL} 行，新增 ${ADDITIONS}）"
          fi

  # ─── 分支命名检查（仅 PR 触发）────────────────────────────────
  branch-naming:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: 检查分支命名规范
        run: bash scripts/ci/check-branch-naming.sh "${{ github.head_ref }}"

  # ─── Engine: TypeCheck + Tests ─────────────────────────────
  engine-tests:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: cd packages/engine && npm ci
      - name: TypeCheck
        run: cd packages/engine && npx tsc --noEmit
      - name: Unit Tests
        run: cd packages/engine && npx vitest run --reporter=verbose
      - name: Version Sync
        run: cd packages/engine && bash ci/scripts/check-version-sync.sh
      - name: Engine Hygiene Gate
        run: node packages/engine/scripts/devgate/check-engine-hygiene.cjs
      - name: Contract Refs Check
        run: cd packages/engine && bash ci/scripts/check-contract-refs.sh
      - name: Dynamic Test Gate
        run: cd packages/engine && bash ci/scripts/check-dynamic-tests.sh
      - name: Chinese Punctuation Bomb Scan
        run: bash packages/engine/ci/scripts/check-chinese-punctuation-bombs.sh
      - name: DoD BEHAVIOR 命令执行
        run: |
          # 检测 PR 中的 task-card.md 文件
          TASK_CARD=""
          # DoD.md 是当前标准（v6 命名），.task-*.md / task-card.md 为旧兼容
          for f in DoD.md .task-*.md task-card.md; do
            [ -f "$f" ] && TASK_CARD="$f" && break
          done
          if [ -z "$TASK_CARD" ]; then
            echo "⏭️  未找到 task-card.md，跳过 BEHAVIOR 命令执行"
            exit 0
          fi
          echo "🔬 执行 DoD BEHAVIOR 验证命令: $TASK_CARD"
          FAILED=0
          SKIPPED=0
          PASSED=0
          # 提取所有 Test: manual: 行
          while IFS= read -r line; do
            CMD="${line#*Test: manual:}"
            CMD="${CMD#"${CMD%%[![:space:]]*}"}"  # trim leading spaces
            if [[ "$CMD" == node* ]]; then
              echo "▶️  执行: $CMD"
              if ! eval "$CMD"; then
                echo "::error::DoD BEHAVIOR 验证失败: $CMD"
                FAILED=$((FAILED + 1))
              else
                PASSED=$((PASSED + 1))
              fi
            elif [[ "$CMD" == curl* ]] || [[ "$CMD" == chrome:* ]] || [[ "$CMD" == psql* ]] || [[ "$CMD" == bash* ]] || [[ "$CMD" == npm* ]]; then
              echo "⏭️  跳过（需要运行时服务）: ${CMD%% *} ..."
              SKIPPED=$((SKIPPED + 1))
            else
              echo "⏭️  跳过（未知前缀）: ${CMD%% *} ..."
              SKIPPED=$((SKIPPED + 1))
            fi
          done < <(grep -E '^\s+Test:\s+manual:' "$TASK_CARD" || true)
          echo "✅ BEHAVIOR 验证完成 — 通过: $PASSED，跳过: $SKIPPED，失败: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} 个 BEHAVIOR 验证命令执行失败"
            exit 1
          fi
      - name: E2E Integrity Check
        run: bash packages/engine/scripts/e2e-integrity-check.sh

  # ─── Engine: Shell Tests (stop hook 套 — v18.21.0 激活) ──────
  # vitest 不识别 .test.sh，本 job 跑所有 unit/integration/integrity/smoke
  # shell 脚本，闭合 PR #2766/#2767 测试基础设施漏洞（死代码激活）
  engine-tests-shell:
    name: Engine Shell Tests (stop hook 套)
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      - name: Run unit shell tests
        run: |
          # glob 模式（v23 PR-3 起）：unit 目录新加 .test.sh 自动接 CI
          for t in packages/engine/tests/unit/*.test.sh; do
            [[ -f "$t" ]] || continue
            echo "::group::$(basename "$t")"
            bash "$t" || exit 1
            echo "::endgroup::"
          done
      - name: Run integration shell tests
        run: |
          # P1-3 (v18.22.1): glob 模式，新加 .test.sh 自动接 CI（防显式列表漏接）
          for t in packages/engine/tests/integration/*.test.sh; do
            [[ -f "$t" ]] || continue
            echo "::group::$(basename "$t")"
            bash "$t" || exit 1
            echo "::endgroup::"
          done
      - name: Run integrity meta-tests
        run: |
          for t in packages/engine/tests/integrity/*.test.sh; do
            [[ -f "$t" ]] || continue
            echo "::group::$(basename "$t")"
            bash "$t" || exit 1
            echo "::endgroup::"
          done
      - name: Run engine smoke (本地无 Brain，dead URL/skip 路径必跑通)
        run: |
          for s in packages/engine/scripts/smoke/*-smoke.sh; do
            [[ -f "$s" ]] || continue
            echo "::group::$(basename "$s")"
            bash "$s" || exit 1
            echo "::endgroup::"
          done

  # ─── Dashboard 部署放行闸 smoke（repo 根 scripts/smoke/）──────
  # 守 deploy-local.sh 的两段式部署：自检 → 起常驻 staging + 写放行标记 →【停住】，
  # 人工跑 promote-dashboard.sh 才换入生产。fixture 模式（不跑 vite build），真链路。
  # glob 模式：scripts/smoke/ 新加 *-smoke.sh 自动接 CI。
  dashboard-staging-gate-smoke:
    name: Dashboard 放行闸 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run repo-root staging smoke
        run: |
          shopt -s nullglob
          found=0
          for s in scripts/smoke/*-smoke.sh; do
            found=1
            echo "::group::$(basename "$s")"
            bash "$s" || exit 1
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::scripts/smoke/*-smoke.sh 为空（放行闸守卫缺失）"; exit 1
          fi

  # ─── 测试金字塔守卫（刀0）───────────────────────────────
  # 孤儿棘轮/smoke挂跑道/永久池棘轮；自测先行（每次 PR proven-to-fire）。
  # PRD: docs/prd/2026-07-14-ops-half-loop.prd.md
  test-pyramid-guard:
    name: 测试金字塔守卫
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard 自测（proven-to-fire）
        run: bash scripts/__tests__/test-pyramid-guard.test.sh
      - name: write-current-state 自测（原孤儿测试接入）
        run: bash scripts/__tests__/write-current-state.test.sh
      - name: rescan-if-changed 事件扳机自测
        run: bash scripts/__tests__/rescan-if-changed.test.sh
      - name: main-repo-sentinel 主仓哨兵自测
        run: bash scripts/__tests__/main-repo-sentinel.test.sh
      - name: anchor-sentinel 锚点哨兵自测
        run: bash scripts/__tests__/anchor-sentinel.test.sh
      - name: 真跑守卫
        run: node scripts/test-pyramid-guard.mjs

  # ─── preview-reaper 对账器自测 ─────────────────────────────────
  # 验证三源收集（目录/DB/表）+ 路由决策（MERGED/CLOSED→回收，OPEN/失败→跳过）
  # 用 mock 替换 gh/psql/dropdb/lsof，不依赖真实数据库或 GitHub token
  preview-reaper-test:
    name: preview-reaper 对账器自测
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: preview start 依赖隔离/旧进程顺序自测
        run: bash scripts/__tests__/preview-env-start.test.sh
      - name: reaper 单元自测
        run: bash scripts/__tests__/preview-reaper.test.sh

  # ─── codex-remote-launch 跨机 token launcher 自测 ────────────────
  # 白名单(ALLOWED_TEAMS team1~5)+核心流程单元自测，mock ssh/scp，不依赖真实远端
  codex-remote-launch-test:
    name: codex-remote-launch 白名单/流程自测
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: launcher 单元自测
        run: bash scripts/__tests__/codex-remote-launch.test.sh

  # ─── codex-request 西安侧只读借用脚本自测 ─────────────────────
  # 白名单(ALLOWED_TEAMS team1~5)+拉取→校验剩余有效期→跑codex，不回传，mock ssh/scp/codex
  # 单一写者模型：美国侧crontab是唯一写者，本脚本只读、用完不覆盖美国侧
  codex-request-test:
    name: codex-request 西安侧pull模式自测
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: 西安侧pull脚本单元自测
        run: bash scripts/__tests__/codex-request.test.sh

  # ─── 棘轮统一台账守卫（刀4-T2）────────────────────────────────
  # 读 ratchet-registry.json，逐项断言健康数未越水位。
  # Brain 依赖指标（bare_fr / seven_ring_hard_flaws）在 CI 中自动跳过。
  ratchet-guard:
    name: 棘轮统一台账守卫
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard 自测（proven-to-fire）
        run: bash scripts/__tests__/ratchet-guard.test.sh
      - name: 真跑守卫
        run: node scripts/ratchet-guard.mjs

  # ─── Migration 同号守护 ───────────────────────────────────
  # 扫 packages/brain/migrations/*.sql 提取首数字前缀，发现同号即 fail。
  # 教训：W7.4 / 2026-05 事故 — 264_failure_type_dispatch / 264_fix_progress_ledger
  # 同号进 main，Brain 启动按字母序只跑了第一个，schema drift 半天才发现。
  # 设为 brain-unit 前置 dep — 同号即不跑测试，省下 6×20min shard 时间。
  lint-migration-unique-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Migration version unique lint
        run: node .github/workflows/scripts/lint-migration-unique-version.cjs
      - name: Self-test (fixture cases)
        run: bash .github/workflows/scripts/__tests__/lint-migration-unique-version.test.sh

  # ─── Auto-merge 决策脚本自测 ───────────────────────────────────
  # 守卫 should-auto-merge.sh：确保 feat(harness): PR 被跳过（交给 harness 裁判 gate），
  # 普通 fix/feat PR 正常合并。防止未来改动误删跳过逻辑或误伤手动 /dev 流程。
  lint-auto-merge-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (auto-merge decision cases)
        run: bash .github/workflows/scripts/__tests__/should-auto-merge.test.sh

  # 守卫 list-fs-guard-tests.sh：CI 快路用 vitest --changed 会漏跑 fs 读取型守卫测试
  # （#3506 / 2026-07-02 两次应验）。本 job 强制守护 selector 选择逻辑（Tier A，无需 vitest）；
  # Tier B（真 vitest 漏跑->必跑 实证）在有 vitest 的环境自动运行，无则自跳过。
  lint-fs-guard-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (fs-guard test selection)
        run: bash .github/workflows/scripts/__tests__/list-fs-guard-tests.test.sh

  # 守卫 assert-deploy-effect.sh：Gate3 部署效果确认三态判定（反"假成功"，2026-07-06）。
  # 保证 deploy webhook 假成功（容器 no-op 未重启也报 success）被 NO_OP 判定拦下。
  lint-deploy-effect-assert:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-test (deploy-effect assertion 三态)
        run: bash scripts/ci/__tests__/assert-deploy-effect.test.sh
      - name: gate3-changed-paths 回归测试
        run: bash scripts/ci/__tests__/gate3-changed-paths.test.sh
      - name: smoke-core 依赖守卫（禁 jq）
        run: bash scripts/ci/__tests__/smoke-core-no-jq.test.sh

  # ─── Brain: Unit Tests (6-shard matrix + Test Impact Analysis) ─
  # PR 模式：vitest --changed 仅跑被改文件影响的 test（Gate 1 升级，目标 < 5 min）
  # push 模式：跑全量 test 保 main 绿
  # vitest 原生 --shard=i/N 按测试文件 hash 均匀分布，6 shards 并行
  # 2026-07-22：4→6 shard，缓解测试文件数增长(6月#3397修OOM时787个→现在989个,+26%)
  # 把单fork堆(vitest.config.js execArgv 8192MB)累积压力撑爆导致的 "Worker exited
  # unexpectedly" 确定性OOM（PR #4168 连续4次同一位置复现实证）。不改堆大小——
  # 依赖"ubuntu-latest真实内存规格"这个未验证假设风险更高，拆shard更稳健。
  #
  # 资源用量说明（回应"扩大shard数是否有资源风险"的疑问）：
  # 4→6 shard 只是把同一份、总量不变的测试文件切成更小的批次，单个 shard 分到的
  # 测试文件数下降（约787/4≈197 → 989/6≈165，每shard文件更少，内存压力更低，不是
  # 更高）。fail-fast:false + matrix 并行数从4增到6，不会突破 GitHub 标准并发上限
  # （公开仓库标准套餐并发 job 数远高于6），也不改变runner机型/单机内存规格，
  # 只是把原本4个runner各扛约197个文件，改成6个runner各扛约165个文件。
  brain-unit:
    needs: [changes, lint-migration-unique-version]
    if: needs.changes.outputs.brain == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # vitest --changed 需要 base ref 历史
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Consciousness Guard SSOT Check
        run: bash scripts/check-consciousness-guard.sh
      - run: cd packages/brain && npm ci
      - name: Determine test scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "🌐 push event — 跑全量 brain-unit"
            exit 0
          fi
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --quiet 2>/dev/null || true
          # 检测 brain 内 .js/.ts 变更（含 src + test）
          CHANGED=$(git diff --name-only "$BASE_REF"...HEAD 2>/dev/null \
            | grep -E '^packages/brain/.+\.(js|ts|cjs|mjs)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "mode=skip" >> $GITHUB_OUTPUT
            echo "⏭️  PR 无 brain 源/测试变更（仅 engine/其他），跳过 brain-unit shard"
          else
            echo "mode=changed" >> $GITHUB_OUTPUT
            TOTAL=$(echo "$CHANGED" | wc -l | tr -d ' ')
            echo "🎯 PR 模式：vitest --changed $BASE_REF（$TOTAL 个变更文件）"
            echo "$CHANGED" | head -20
          fi
      - name: Unit Tests (shard ${{ matrix.shard }}/6)
        if: steps.scope.outputs.mode != 'skip'
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        # vitest forks 模式下，fork 进程跑完后可能因内存碎片 OOM 退出，
        # tinypool 报 "Worker exited unexpectedly"，导致 vitest 返回 exit 1，
        # 即使所有测试均已通过。此脚本在 exit 非 0 时检查是否无 test 失败，
        # 若无则认为是 OOM worker exit（非测试失败），返回 0。
        # PR 模式额外：--changed 过滤命中 0 测试也视为 pass（变更不影响 brain test）。
        #
        # fs 读取型守卫测试根治（#3506 / 2026-07-02 两次应验）：
        #   vitest --changed 只跑静态 import 依赖图命中的测试；但大量守卫测试用 fs.readFileSync
        #   在运行时读源/脚本文件做断言，被读文件不在 import 图里 => 改被读文件时守卫漏跑。
        #   实证确认 `--changed <files>` 是【交集】非并集，故守卫组无法并入 --changed 调用，
        #   必须【第二次独立调用】强制全跑（selector 自动检测 readFileSync 标记，见
        #   .github/workflows/scripts/list-fs-guard-tests.sh + 其 __tests__ 回归测试）。
        run: |
          cd packages/brain
          SHARD=${{ matrix.shard }}
          # 单次 vitest 调用 + OOM/0命中 容错封装
          run_vitest() {
            local label="$1"; local covdir="$2"; shift 2
            set +e
            npx vitest run --shard=$SHARD/6 "$@" --exclude='src/__tests__/integration/**' --reporter=verbose --coverage --coverage.reporter=lcov --coverage.reportsDirectory="$covdir" 2>&1 | tee /tmp/vitest-$label.txt
            local exit=${PIPESTATUS[0]}
            if [ $exit -ne 0 ]; then
              if grep -qE "Tests.*[0-9]+ passed" /tmp/vitest-$label.txt && ! grep -qE "Tests.*[0-9]+ failed" /tmp/vitest-$label.txt; then
                echo "[brain-unit shard $SHARD/6 · $label] OOM worker exit but all tests passed — treating as success"
                return 0
              fi
              if grep -qiE "No test files found|filter matched no test files" /tmp/vitest-$label.txt; then
                echo "[brain-unit shard $SHARD/6 · $label] 过滤命中 0 测试 — 视为 pass"
                return 0
              fi
              return $exit
            fi
            return 0
          }
          if [ "${{ steps.scope.outputs.mode }}" = "changed" ]; then
            # 快路：import 依赖图命中的测试
            run_vitest changed "coverage/shard-$SHARD" --changed origin/${{ github.base_ref }} || exit $?
            # 守卫组：fs 读取型测试强制全跑（第二次独立调用，无 --changed）。
            # 独立 coverage 目录避免覆盖 shard-1 主 lcov（diff-cover 依赖后者）。
            GUARDS=$(bash "$GITHUB_WORKSPACE/.github/workflows/scripts/list-fs-guard-tests.sh" src/__tests__ | tr '\n' ' ')
            if [ -n "$GUARDS" ]; then
              echo "🛡️  fs 读取型守卫组强制全跑（shard $SHARD/6）：$(echo $GUARDS | wc -w | tr -d ' ') 个文件"
              run_vitest guards "coverage/guards-shard-$SHARD" $GUARDS || exit $?
            fi
          else
            # 全量模式（push）：已包含全部测试，无需额外守卫组
            run_vitest full "coverage/shard-$SHARD" || exit $?
          fi

      - name: Upload coverage artifact (shard 1 only)
        if: matrix.shard == 1 && steps.scope.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: brain-coverage-lcov
          path: packages/brain/coverage/shard-1/lcov.info
          retention-days: 1
          if-no-files-found: ignore

  # ─── Brain: Unit Tests Aggregation ─────────────────────────
  # 所有 brain-unit matrix shards 都成功才通过。
  # 给 ci-passed / 分支保护规则一个稳定的单 check 名字。
  brain-unit-all:
    needs: brain-unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate brain-unit shard results
        run: |
          # matrix.result 只有全部 shard success 才是 'success'；
          # 当 packages/brain/* 未改（paths-filter 跳过 brain-unit）时，
          # result='skipped' 也是合法状态（本 PR 不影响 brain，无需跑测试）。
          RESULT="${{ needs.brain-unit.result }}"
          if [[ "$RESULT" != "success" && "$RESULT" != "skipped" ]]; then
            echo "❌ brain-unit matrix 有 shard 失败（result=$RESULT）"
            exit 1
          fi
          echo "✅ 所有 brain-unit shards 通过"

  # ─── Brain: Diff Coverage Gate ────────────────────────────
  # PR 新增行覆盖率 < 80% 则 CI fail，迫使为新代码路径补测试
  # 使用 shard 1 的 lcov artifact（不重跑 vitest，节省 ~35min）
  # 注：shard 1 只覆盖约 25% test 文件，diff-cover 80% 门禁为近似值（非全量）
  # 权衡：CI 速度提升 vs 覆盖精度；若 gate 误报，可临时将 --fail-under=80 降低或切回全量
  brain-diff-coverage:
    needs: [changes, brain-unit-all]
    if: needs.changes.outputs.brain == 'true' && needs.brain-unit-all.result == 'success' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        id: download_cov
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: brain-coverage-lcov
          path: packages/brain/coverage/
      - name: Diff Coverage Gate
        run: |
          # brain-unit shard 1 在 PR 无 .js/.ts 变更时跳过（scope=skip），不上传 artifact。
          # 此时 download 失败（continue-on-error），lcov.info 不存在 — 无源码变更，覆盖率不适用，跳过。
          if [ ! -f packages/brain/coverage/lcov.info ]; then
            echo "⏭️  无 lcov artifact（brain 变更不含 .js/.ts 源码，scope=skip）— 跳过 diff-cover"
            exit 0
          fi
          pip install diff-cover --quiet
          git fetch origin main
          cd packages/brain
          diff-cover coverage/lcov.info \
            --compare-branch=origin/main \
            --fail-under=80 \
            --exclude='src/__tests__/**' \
            --exclude='**/*.test.js' \
            --exclude='**/*.test.ts' \
            --exclude='**/*.spec.js' \
            --exclude='**/*.spec.ts'

  # ─── Brain: Integration Tests (PostgreSQL) ─────────────────
  brain-integration:
    needs: changes
    if: needs.changes.outputs.brain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: cecelia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: cd packages/brain && npm ci
      - name: Run Migrations
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: cd packages/brain && node src/migrate.js
      - name: Integration Tests
        env:
          DATABASE_URL: postgresql://cecelia:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/cecelia_test
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB: postgresql://cecelia:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/cecelia_test
          NODE_ENV: test
        run: |
          cd packages/brain
          npx vitest run \
            --config vitest.integration.config.js \
            src/__tests__/integration/ \
            src/__tests__/migration-333.test.js \
            ../../tests/regression/relay-137fea96/contract-postdeploy-smoke-filter.test.ts \
            --reporter=verbose
      - name: Provider-neutral Kernel Spawn Callback Progression
        run: >-
          cd packages/brain && npx vitest run
          src/orchestrator/__tests__/kernel-callback-flow.integration.test.js
          --reporter=verbose

  # ─── Workspace: Build ──────────────────────────────────────
  workspace-build:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: cd apps/dashboard && npm ci
      - name: Build
        run: cd apps/dashboard && npm run build

  workspace-test:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: cecelia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root deps
        run: npm ci
      - name: Test apps/api
        run: cd apps/api && npm ci && npm test
      - name: Test apps/dashboard
        run: cd apps/dashboard && npm ci && npx vitest run

  # ─── E2E Smoke（永久 gate，所有 PR 必跑）──────────────────────
  # 保护已建立的 Walking Skeleton 路径，任何 PR 都不能绕过 E2E 检查。
  # 包含：golden-path（3条核心链路） + agent-lifecycle（状态机完整性）
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: cecelia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: cd packages/brain && npm ci
      - name: Run Migrations
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: cd packages/brain && node src/migrate.js
      - name: E2E Smoke Tests（golden-path + agent-lifecycle + dev-lifecycle）
        env:
          DATABASE_URL: postgresql://cecelia:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/cecelia_test
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          NODE_ENV: test
        run: |
          cd packages/brain && npx vitest run \
            src/__tests__/integration/golden-path.integration.test.js \
            src/__tests__/integration/agent-lifecycle.integration.test.js \
            src/__tests__/integration/dev-task-lifecycle.e2e.test.js \
            --reporter=verbose


  # ─── Core Regression Gate（无条件核心回归闸 B1）────────────────────
  # 脱离路径门：无论改动什么文件，都跑 regression-contract.yaml 里的
  # must-never-break 断言。取代旧 regression-smoke（扫空目录 exit 0 假绿灯）。
  #   PR      → tier=pr（跑 trigger 含 PR 的条目）
  #   push main→ tier=release（跑 trigger 含 Release 的条目）
  # 空契约守卫：选出 0 条即 exit 1，杜绝假绿灯。
  core-regression:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install yq (mikefarah)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Run core regression (PR tier)
        if: github.ref != 'refs/heads/main'
        run: bash scripts/ci/run-core-regression.sh --tier pr
      - name: Run core regression (Release tier)
        if: github.ref == 'refs/heads/main'
        run: bash scripts/ci/run-core-regression.sh --tier release

  # ─── Invariant→契约桥：红线裸奔检测（CL-2 cicd-closeloop）────────────
  # 读 Brain invariant 全集（CI 无 Brain → 读 config/invariants-snapshot.json 快照），
  # 对账 regression-contract.yaml golden_paths[].invariant_ids：
  #   有红线无对应守卫 → 报「invariant #X 裸奔」清单。
  # 告警模式：报告但 exit 0，不进 ci-passed 依赖列表（additive）。
  # 转强制：给 step 加 env INVARIANT_BRIDGE_STRICT=1（裸奔即 exit 1）。
  # 快照刷新：本地 Brain 活着时 node scripts/ci/export-invariants-snapshot.mjs
  #（快照超 30 天脚本自动告警提醒）。
  invariant-bridge:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 红线裸奔检测（invariants ↔ regression-contract 对账）
        env:
          INVARIANT_BRIDGE_SOURCE: snapshot   # CI 确定性：不探测 Brain API
        run: node scripts/ci/check-invariant-coverage.mjs

  # ─── DoD BEHAVIOR 动态命令执行（curl/psql/bash/npm 真跑）────────────
  # 与 engine-tests 中的 "DoD BEHAVIOR 命令执行" 分工：
  #   engine-tests：只跑 node 命令（无服务依赖，快速）
  #   dod-behavior-dynamic（本 job）：跑 curl/psql/bash/npm 等需要运行时服务的命令
  # 自动检测 DoD 文件是否含动态命令；无则早退不起 Brain。
  dod-behavior-dynamic:
    needs: [changes]
    if: needs.changes.outputs.dod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: cecelia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: 检测 DoD 动态命令
        id: detect
        run: |
          TASK_CARD=""
          for f in DoD.md .task-*.md task-card.md; do
            [ -f "$f" ] && TASK_CARD="$f" && break
          done
          if [ -z "$TASK_CARD" ]; then
            echo "⏭️  未找到 DoD/task-card，跳过动态验证"
            echo "has_dynamic=false" >> $GITHUB_OUTPUT
            echo "sprint_dir=." >> $GITHUB_OUTPUT
            exit 0
          fi
          FIRST_SPRINT_PATH=$(grep -Eo 'sprints/[^/[:space:]]+/[^[:space:]]+' "$TASK_CARD" | head -1 || true)
          if [ -n "$FIRST_SPRINT_PATH" ]; then
            SPRINT_DIR=$(printf "%s" "$FIRST_SPRINT_PATH" | sed -E 's#^(sprints/[^/]+).*#\1#')
          else
            SPRINT_DIR="."
          fi
          echo "sprint_dir=$SPRINT_DIR" >> $GITHUB_OUTPUT
          # 扫描是否含 curl/psql/bash/npm 类型的动态命令
          if grep -qE '^\s+Test:\s+manual:(curl|psql|bash|npm)\b' "$TASK_CARD"; then
            echo "has_dynamic=true" >> $GITHUB_OUTPUT
            echo "task_card=$TASK_CARD" >> $GITHUB_OUTPUT
            echo "🔬 DoD 含动态命令，将启动 Brain 并真执行: $TASK_CARD"
          else
            echo "has_dynamic=false" >> $GITHUB_OUTPUT
            echo "⏭️  DoD 无动态命令（纯 node / tests/），跳过 Brain spin-up"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_dynamic == 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps（前端 DoD 装全 workspace，后端 DoD 仅 brain）
        # 前端 harness 任务的 [BEHAVIOR] 是 `cd apps/dashboard && npx vitest ...`，需要 dashboard
        # 自己的 node_modules。注意：在 workspace 子目录跑 `cd apps/dashboard && npm ci` 会裁剪掉
        # brain 独有依赖（如 dotenv），导致随后 `node src/migrate.js` 报 ERR_MODULE_NOT_FOUND。
        # 因此前端 DoD 用根 `npm ci` 一次性装全 workspace（brain + dashboard 都在）；后端 DoD
        # 保持 brain-only（快）。
        if: steps.detect.outputs.has_dynamic == 'true'
        run: |
          if grep -qE 'apps/dashboard' "${{ steps.detect.outputs.task_card }}"; then
            echo "🔧 DoD 含 apps/dashboard 前端命令，安装全 workspace 依赖（根 npm ci）"
            npm ci
          else
            echo "DoD 仅后端命令，安装 brain 依赖"
            cd packages/brain && npm ci
          fi
      - name: Setup /workspace symlink + playground deps
        if: steps.detect.outputs.has_dynamic == 'true'
        run: |
          sudo ln -sf "$GITHUB_WORKSPACE" /workspace
          cd playground && npm install
      - name: Bootstrap .env from .env.example
        if: steps.detect.outputs.has_dynamic == 'true'
        run: |
          [ ! -f packages/brain/.env ] && cp packages/brain/.env.example packages/brain/.env || true
      - name: Provision skills SSOT (zenithjoy-skills)
        # skill-drift 端点的 DoD B6 断言 all(.ssot_version != null) 需要 SSOT 在
        # $HOME/perfect21/zenithjoy-skills（Brain 默认 SKILLS_SSOT_DIR）。SSOT 仓库是
        # private；DEPLOY_TOKEN 是 Brain HTTP 部署 token 而非 GitHub PAT，runner 上
        # clone 必然 403（实证：PR #3338 run 27319434949）。回退：用 repo 内快照
        # packages/workflows/skills/ seed SSOT 目录 — B6 防硬编码核心是快照侧独立
        # grep 对比；SSOT 侧断言只要求真实读盘非 null，seed 副本同样真实读盘。
        # 仍先尝试 clone，将来 secret 换成有跨仓库权限的 PAT 时自动用真 SSOT。
        if: steps.detect.outputs.has_dynamic == 'true'
        run: |
          if git clone --depth 1 "https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/perfectuser21/zenithjoy-skills" "$HOME/perfect21/zenithjoy-skills" 2>/dev/null; then
            echo "✅ SSOT cloned to $HOME/perfect21/zenithjoy-skills"
          else
            mkdir -p "$HOME/perfect21/zenithjoy-skills"
            cp -r "$GITHUB_WORKSPACE/packages/workflows/skills/." "$HOME/perfect21/zenithjoy-skills/"
            echo "✅ SSOT seeded from snapshot fallback（clone 不可用：DEPLOY_TOKEN 非 GitHub PAT）"
          fi
      - name: Run Migrations
        if: steps.detect.outputs.has_dynamic == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: cd packages/brain && node src/migrate.js
      - name: Start Brain server
        if: steps.detect.outputs.has_dynamic == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          NODE_ENV: test
          CECELIA_TICK_ENABLED: 'false'
        run: |
          cd packages/brain
          node server.js > /tmp/brain.log 2>&1 &
          echo $! > /tmp/brain.pid
          # 等 /api/brain/health 返回 200（最多 60s）
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5221/api/brain/health > /dev/null 2>&1; then
              echo "✅ Brain 启动耗时 ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Brain 60s 内未就绪"
          tail -60 /tmp/brain.log
          exit 1
      - name: Seed smoke task for DoD dynamic behavior
        if: steps.detect.outputs.has_dynamic == 'true'
        env:
          DB: postgresql://cecelia:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/cecelia_test
        run: |
          TASK_CARD="${{ steps.detect.outputs.task_card }}"
          # claude-headed 精确判定必须先于 codex 通用/兜底分支检测，防止 claude-headed
          # task-card 落入旧通用 OR 分支被误 seed 成 codex 身份（顺序性静态断言，Plan A）。
          CLAUDE_HEADED_DOD=false
          if grep -q 'skill-relay-claude-headed' "$TASK_CARD" \
            || grep -qE '"executor"[[:space:]]*:[[:space:]]*"claude"' "$TASK_CARD" \
            || grep -qE 'payload\.executor[[:space:]]*==[[:space:]]*\\?"claude\\?"' "$TASK_CARD" \
            || grep -qE 'executor[[:space:]]*==[[:space:]]*\\?"claude\\?"' "$TASK_CARD"; then
            CLAUDE_HEADED_DOD=true
          fi

          HEADED_RELAY_DOD=false
          if grep -q 'skill-relay-codex-headed' "$TASK_CARD" \
            || grep -qE 'payload\.mode[[:space:]]*==[[:space:]]*\\?"headed\\?"' "$TASK_CARD" \
            || grep -qE 'mode[[:space:]]*==[[:space:]]*\\?"headed\\?"' "$TASK_CARD" \
            || grep -qE '"mode"[[:space:]]*:[[:space:]]*"headed"' "$TASK_CARD" \
            || grep -qE 'mode=headed' "$TASK_CARD" \
            || grep -qE 'payload\.orchestrator[[:space:]]*==[[:space:]]*\\?"skill-relay\\?"' "$TASK_CARD" \
            || grep -qE 'orchestrator[[:space:]]*==[[:space:]]*\\?"skill-relay\\?"' "$TASK_CARD" \
            || grep -qE '"orchestrator"[[:space:]]*:[[:space:]]*"skill-relay"' "$TASK_CARD" \
            || grep -qE 'orchestrator=skill-relay' "$TASK_CARD"; then
            HEADED_RELAY_DOD=true
          fi

          if [ "$CLAUDE_HEADED_DOD" = "true" ]; then
            SMOKE_ID=$(grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' "$TASK_CARD" | head -1 || true)
            if ! [[ "$SMOKE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "::error::Could not extract headed relay task UUID from $TASK_CARD"
              exit 1
            fi
            psql "$DB" -v ON_ERROR_STOP=1 -v smoke_id="$SMOKE_ID" <<'SQL'
          INSERT INTO tasks (
            id, title, status, priority, task_type, payload, trigger_source, domain, location, created_at, updated_at
          )
          VALUES (
            :'smoke_id'::uuid,
            'CI DoD Claude Headed Relay Smoke Task',
            'completed',
            'P2',
            'harness_initiative',
            '{"mode":"headed","executor":"claude","orchestrator":"skill-relay","journey_id":"bb8cc561-b3ee-4fec-b74d-2255694bd963"}'::jsonb,
            'ci',
            'quality',
            'us',
            NOW(),
            NOW()
          )
          ON CONFLICT (id) DO UPDATE SET
            title = EXCLUDED.title,
            status = EXCLUDED.status,
            priority = EXCLUDED.priority,
            task_type = EXCLUDED.task_type,
            payload = EXCLUDED.payload,
            trigger_source = EXCLUDED.trigger_source,
            domain = EXCLUDED.domain,
            location = EXCLUDED.location,
            updated_at = NOW();

          DELETE FROM initiative_runs
           WHERE initiative_id = :'smoke_id'::uuid
             AND orchestrator_host = 'skill-relay-claude-headed';

          INSERT INTO initiative_runs (
            initiative_id, phase, journey_id, orchestrator_version, orchestrator_host, deadline_at, started_at, updated_at
          )
          VALUES (
            :'smoke_id'::uuid,
            'A_planning',
            'bb8cc561-b3ee-4fec-b74d-2255694bd963'::uuid,
            'v2',
            'skill-relay-claude-headed',
            NOW() + INTERVAL '8 hours',
            NOW(),
            NOW()
          );
          SQL
            echo "TASK_ID=$SMOKE_ID" >> "$GITHUB_ENV"
            echo "✅ Seeded claude-headed relay DoD task/run: $SMOKE_ID"
          elif [ "$HEADED_RELAY_DOD" = "true" ]; then
            SMOKE_ID=$(grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' "$TASK_CARD" | head -1 || true)
            if ! [[ "$SMOKE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "::error::Could not extract headed relay task UUID from $TASK_CARD"
              exit 1
            fi
            psql "$DB" -v ON_ERROR_STOP=1 -v smoke_id="$SMOKE_ID" <<'SQL'
          INSERT INTO tasks (
            id, title, status, priority, task_type, payload, trigger_source, domain, location, created_at, updated_at
          )
          VALUES (
            :'smoke_id'::uuid,
            'CI DoD Headed Relay Smoke Task',
            'completed',
            'P2',
            'harness_initiative',
            '{"mode":"headed","executor":"codex","orchestrator":"skill-relay","journey_id":"bb8cc561-b3ee-4fec-b74d-2255694bd963"}'::jsonb,
            'ci',
            'quality',
            'us',
            NOW(),
            NOW()
          )
          ON CONFLICT (id) DO UPDATE SET
            title = EXCLUDED.title,
            status = EXCLUDED.status,
            priority = EXCLUDED.priority,
            task_type = EXCLUDED.task_type,
            payload = EXCLUDED.payload,
            trigger_source = EXCLUDED.trigger_source,
            domain = EXCLUDED.domain,
            location = EXCLUDED.location,
            updated_at = NOW();

          DELETE FROM initiative_runs
           WHERE initiative_id = :'smoke_id'::uuid
             AND orchestrator_host = 'skill-relay-codex-headed';

          INSERT INTO initiative_runs (
            initiative_id, phase, journey_id, orchestrator_version, orchestrator_host, deadline_at, started_at, updated_at
          )
          VALUES (
            :'smoke_id'::uuid,
            'A_planning',
            'bb8cc561-b3ee-4fec-b74d-2255694bd963'::uuid,
            'v2',
            'skill-relay-codex-headed',
            NOW() + INTERVAL '8 hours',
            NOW(),
            NOW()
          );
          SQL
            echo "TASK_ID=$SMOKE_ID" >> "$GITHUB_ENV"
            echo "✅ Seeded headed relay DoD task/run: $SMOKE_ID"
          else
            TASK_RESP=$(curl -sf -X POST http://localhost:5221/api/brain/tasks \
              -H "Content-Type: application/json" \
              -d '{"title":"CI DoD Smoke Task","task_type":"harness_generate"}' 2>/dev/null || echo '{}')
            SMOKE_ID=$(echo "$TASK_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const p=JSON.parse(d);p.id&&process.stdout.write(p.id)}catch(e){}})" 2>/dev/null || true)
            if [ -n "$SMOKE_ID" ]; then
              curl -sf -X PATCH "http://localhost:5221/api/brain/tasks/$SMOKE_ID" \
                -H "Content-Type: application/json" \
                -d '{"status":"in_progress"}' > /dev/null || true
              curl -sf -X PATCH "http://localhost:5221/api/brain/tasks/$SMOKE_ID" \
                -H "Content-Type: application/json" \
                -d '{"status":"completed"}' > /dev/null || true
              echo "TASK_ID=$SMOKE_ID" >> "$GITHUB_ENV"
              echo "✅ Seeded DoD smoke task: $SMOKE_ID (status=completed)"
            else
              echo "::warning::Could not create DoD smoke task — Brain tasks test will use default ID"
            fi
          fi
      - name: 执行 DoD BEHAVIOR 动态命令
        if: steps.detect.outputs.has_dynamic == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB: postgresql://cecelia:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/cecelia_test
          BRAIN_URL: http://localhost:5221
          DATABASE_URL: postgresql://cecelia:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/cecelia_test
          TEST_DATABASE_URL: postgresql://cecelia:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/cecelia_test
          SPRINT_DIR: ${{ steps.detect.outputs.sprint_dir }}
          LOG_PATH: ${{ steps.detect.outputs.sprint_dir }}/tui.log
        run: |
          TASK_CARD="${{ steps.detect.outputs.task_card }}"
          FAILED=0
          PASSED=0
          SKIPPED=0
          run_dynamic_command() {
            local command="$1"
            local command_log
            local command_status
            local clean_summary
            local passed_count
            command_log=$(mktemp)
            set +e
            eval "$command" 2>&1 | tee "$command_log"
            command_status=${PIPESTATUS[0]}
            set -e
            if [ "$command_status" -eq 0 ] && [[ "$command" == *vitest* ]]; then
              clean_summary=$(sed -E $'s/\x1B\\[[0-9;]*[mK]//g' "$command_log")
              passed_count=$(printf '%s\n' "$clean_summary" \
                | sed -nE 's/.*Tests[[:space:]]+([0-9]+)[[:space:]]+passed.*/\1/p' \
                | tail -1)
              VITEST_EXECUTED_COUNT=${passed_count:-0}
              if [ "$VITEST_EXECUTED_COUNT" -eq 0 ]; then
                echo "::error::Vitest command executed zero tests: $command"
                command_status=1
              fi
            fi
            rm -f "$command_log"
            return "$command_status"
          }
          echo "🔬 开始执行 DoD BEHAVIOR 动态命令: $TASK_CARD"
          while IFS= read -r line; do
            CMD="${line#*Test: manual:}"
            CMD="${CMD#"${CMD%%[![:space:]]*}"}"  # trim leading spaces
            # chrome 需要 headful，仍跳过
            if [[ "$CMD" == chrome:* ]]; then
              SKIPPED=$((SKIPPED + 1))
              echo "⏭️  跳过 chrome 命令（需 headful browser）: ${CMD%% *} ..."
              continue
            fi
            # Playwright E2E（[BEHAVIOR:E2E]）需 headful browser + 运行中的 dev server，
            # 归 evaluator 模式 B / final-e2e（user_facing 走 mac_web、ZenithJoy 走 windows_cloud），
            # 不在通用 CI 跑（此处无浏览器、无 localhost dev server，必然 "No tests found"/超时）。
            if [[ "$CMD" == *playwright* ]]; then
              SKIPPED=$((SKIPPED + 1))
              echo "⏭️  跳过 playwright E2E 命令（归 evaluator 模式 B / final-e2e，需 headful + dev server）"
              continue
            fi
            # 只跑动态类型（node 在 engine-tests 里已跑过）
            if [[ "$CMD" != curl* ]] && [[ "$CMD" != psql* ]] && [[ "$CMD" != bash* ]] && [[ "$CMD" != npm* ]]; then
              continue
            fi
            echo "▶️  执行: $CMD"
            if printf '%s\n' "$CMD" | grep -F 'grep -F "psql \"$DB\""' >/dev/null; then
              if DB='$DB' run_dynamic_command "$CMD"; then
                PASSED=$((PASSED + 1))
                echo "    ✅ PASS"
              else
                FAILED=$((FAILED + 1))
                echo "::error::❌ FAIL: $CMD"
              fi
            else
              if run_dynamic_command "$CMD"; then
                PASSED=$((PASSED + 1))
                echo "    ✅ PASS"
              else
                FAILED=$((FAILED + 1))
                echo "::error::❌ FAIL: $CMD"
              fi
            fi
          done < <(grep -E '^\s+Test:\s+manual:' "$TASK_CARD" || true)
          echo "📊 动态 BEHAVIOR 完成 — 通过 $PASSED 失败 $FAILED 跳过 $SKIPPED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} 个 BEHAVIOR 动态命令执行失败"
            exit 1
          fi
      - name: Stop Brain
        if: always() && steps.detect.outputs.has_dynamic == 'true'
        run: |
          [ -f /tmp/brain.pid ] && kill $(cat /tmp/brain.pid) 2>/dev/null || true
          tail -40 /tmp/brain.log 2>/dev/null || true

  # ─── Workspace API Smoke（跨包边界验证：apps/api ↔ packages/brain）─────────
  # 验证 apps/api (5211) 代理到 brain (5221) 的跨包链路完整。
  # 不依赖 Docker image，直接起两个 Node.js 进程，验 HTTP 边界。
  workspace-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: cecelia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Start stub brain (port 5221)
        # 真实 brain 初始化 >120s（consciousness guard + tick loop），不适合 smoke。
        # stub 只验代理路由；brain 真实行为由 real-env-smoke + brain-unit 覆盖。
        # 单行避免 YAML block scalar 缩进断裂。
        run: |
          python3 -c "import http.server,json;http.server.HTTPServer(('',5221),type('H',(http.server.BaseHTTPRequestHandler,),{'do_GET':lambda s:(s.send_response(200),s.send_header('Content-Type','application/json'),s.end_headers(),s.wfile.write(json.dumps({'service':'cecelia-brain','status':'running','port':5221}).encode())),'log_message':lambda*a:None})).serve_forever()" > /tmp/stub-brain.log 2>&1 &
          sleep 1
          curl -sf http://localhost:5221/health && echo "stub brain ready" || (cat /tmp/stub-brain.log && exit 1)

      - name: Install apps/api deps + build
        run: cd apps/api && npm ci && npm run build

      - name: Start apps/api (port 5211)
        env:
          PORT: '5211'
          BRAIN_API: http://localhost:5221
          BRAIN_NODE_API: http://localhost:5221
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          NODE_ENV: test
        run: |
          node apps/api/dist/dashboard/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5211/api/cecelia/health >/dev/null 2>&1 && echo "apps/api ready after ${i}s" && break
            sleep 1
          done
          curl -sf http://localhost:5211/api/cecelia/health || (cat /tmp/api.log && exit 1)

      - name: Cross-package proxy smoke
        run: |
          echo "=== 1/3 apps/api 自身健康 ==="
          curl -sf http://localhost:5211/api/cecelia/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d)"

          echo "=== 2/3 brain 直接健康 ==="
          curl -sf http://localhost:5221/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d)"

          echo "=== 3/3 跨包代理：apps/api → brain ==="
          PROXY_RESP=$(curl -sf http://localhost:5211/api/brain/health)
          echo "$PROXY_RESP"
          echo "$PROXY_RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'running', f'brain proxy health check failed: {d}'
          print('✅ 跨包代理通过')
          "

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== brain.log ===" && cat /tmp/brain.log || true
          echo "=== api.log ===" && cat /tmp/api.log || true


  # ─── Quality Package Tests ───────────────────────────────────────────
  # packages/quality 自身的 QA 测试（gateway/worker/heartbeat/queue/devgate hooks）
  quality-tests:
    needs: changes
    if: needs.changes.outputs.quality == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Quality Package Tests
        run: cd packages/quality && npm ci && npm test

  # ─── Real-Env Smoke (起真 brain docker container + 真 postgres，跑 smoke.sh) ─
  # 与单测 / integration 互补：单测 mock 一切；integration 起 node server 直跑；
  # real-env-smoke 起 cecelia-brain image 真容器，验真容器化部署链路 + smoke.sh 行为。
  # 触发条件：brain 改动时跑（其他改动不影响 brain 容器行为）。
  real-env-smoke:
    needs: changes
    if: needs.changes.outputs.brain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: cecelia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Brain deps + run migrations
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          cd packages/brain
          npm ci
          node src/migrate.js
      - name: Build cecelia-brain image
        run: docker build -f packages/brain/Dockerfile -t cecelia-brain:ci .
      - name: Start Brain container (network=host → 直连 postgres service)
        run: |
          # network=host：runner 上 postgres service 暴露在 localhost:5432，
          # brain 容器共享 host network namespace 即可直接 localhost:5432 命中 postgres
          docker run -d --name cecelia-brain-smoke \
            --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=cecelia_test \
            -e DB_USER=cecelia \
            -e DB_PASSWORD=${{ secrets.CI_DB_PASSWORD }} \
            -e BRAIN_PORT=5221 \
            -e NODE_ENV=test \
            -e CECELIA_TICK_ENABLED=false \
            -e ENV_REGION=us \
            -e REPO_ROOT=/repo_root \
            -v $GITHUB_WORKSPACE/packages/workflows:/repo_root/packages/workflows:ro \
            cecelia-brain:ci
          # 等 /api/brain/tick/status 200（最多 90s）
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5221/api/brain/tick/status >/dev/null 2>&1; then
              echo "✅ Brain healthy in ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Brain not healthy in 90s"
          docker logs cecelia-brain-smoke
          exit 1
      - name: Run all packages/brain/scripts/smoke/*.sh
        env:
          BRAIN_URL: http://localhost:5221
          BRAIN_CONTAINER: cecelia-brain-smoke
          DATABASE_URL: postgresql://cecelia:cecelia_test@localhost:5432/cecelia_test
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: cecelia_test
        run: |
          SMOKE_DIR=packages/brain/scripts/smoke
          if [ ! -d "$SMOKE_DIR" ]; then
            echo "::error::$SMOKE_DIR 不存在；real-env-smoke 必须有至少 1 个 smoke 脚本"
            exit 1
          fi
          shopt -s nullglob
          SCRIPTS=("$SMOKE_DIR"/*.sh)
          if [ ${#SCRIPTS[@]} -eq 0 ]; then
            echo "::error::$SMOKE_DIR/*.sh 为空；real-env-smoke 必须有至少 1 个 smoke 脚本"
            exit 1
          fi
          FAILED=0
          PASSED=0
          for script in "${SCRIPTS[@]}"; do
            echo "── ▶️  $script"
            if bash "$script"; then
              PASSED=$((PASSED + 1))
              echo "── ✅ PASS: $script"
            else
              FAILED=$((FAILED + 1))
              echo "::error::❌ FAIL: $script"
            fi
          done
          echo ""
          echo "📊 Smoke 结果 — 通过: $PASSED, 失败: $FAILED, 总计: ${#SCRIPTS[@]}"
          [ "$FAILED" -eq 0 ]
      - name: Cleanup brain container
        if: always()
        run: |
          docker logs cecelia-brain-smoke 2>&1 | tail -100 || true
          docker rm -f cecelia-brain-smoke 2>/dev/null || true

  # ─── Harness DoD 完整性校验（harness PR 专用，非 harness 自动跳过）──
  harness-dod-integrity:
    needs: [changes]
    if: needs.changes.outputs.dod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harness DoD 完整性校验
        run: |
          # 读取 DoD.md 中的 contract_branch header
          if [ ! -f "DoD.md" ] || ! grep -q "^contract_branch:" DoD.md 2>/dev/null; then
            echo "⏭️  非 harness PR（DoD.md 无 contract_branch 字段），跳过校验"
            exit 0
          fi

          CONTRACT_BRANCH=$(grep "^contract_branch:" DoD.md | awk '{print $2}')
          WS_INDEX=$(grep "^workstream_index:" DoD.md | awk '{print $2}' || echo "1")
          WS_INDEX=${WS_INDEX:-1}
          SPRINT_DIR=$(grep "^sprint_dir:" DoD.md | awk '{print $2}' || echo "")
          echo "contract_branch=$CONTRACT_BRANCH  workstream_index=$WS_INDEX  sprint_dir=$SPRINT_DIR"

          # fetch contract branch
          git fetch origin "$CONTRACT_BRANCH" 2>/dev/null || {
            echo "⚠️  无法 fetch contract branch '$CONTRACT_BRANCH'，跳过校验（可能已合并）"
            exit 0
          }

          # 读取 contract DoD 文件（优先从 SPRINT_DIR/，兼容旧的根目录格式）
          DOD_PATH="${SPRINT_DIR:+${SPRINT_DIR}/}contract-dod-ws${WS_INDEX}.md"
          git show "origin/${CONTRACT_BRANCH}:${DOD_PATH}" > /tmp/contract-dod.md 2>/dev/null || {
            echo "⚠️  ${DOD_PATH} 不存在于 $CONTRACT_BRANCH，跳过校验"
            exit 0
          }

          # 对比 DoD 条目（忽略 [ ] vs [x] 差异，只比较条目文本）
          node -e "
            const contractText = require('fs').readFileSync('/tmp/contract-dod.md', 'utf8');
            const genText = require('fs').readFileSync('DoD.md', 'utf8');

            const normalize = (text) => {
              const items = text.match(/^- \[[ x]\] \[(BEHAVIOR|ARTIFACT)\] .+/gm) || [];
              return items.map(m => m.replace(/^- \[.\]/, '- []').trim());
            };

            const contractItems = normalize(contractText);
            const generatorItems = normalize(genText);

            const missing = contractItems.filter(c => !generatorItems.includes(c));
            const extra = generatorItems.filter(g => !contractItems.includes(g));

            let failed = false;
            if (missing.length > 0) {
              console.error('❌ Generator DoD 缺少 contract 中的条目:');
              missing.forEach(m => console.error('  ' + m));
              failed = true;
            }
            if (extra.length > 0) {
              console.error('❌ Generator DoD 包含 contract 中没有的额外条目:');
              extra.forEach(e => console.error('  ' + e));
              failed = true;
            }
            if (failed) process.exit(1);
            console.log('✅ Harness DoD 完整性校验通过（' + generatorItems.length + ' 个条目与 contract 一致）');
          "

  # ─── Harness Contract Lint（DoD/contract 文件变更时触发）────────
  harness-contract-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 检查 DoD/contract 文件变更
        id: detect-dod
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE"..."$HEAD" 2>/dev/null || echo "")
          # 排除 sprints/archive/：归档的老格式 sprint（v5 前），不应该走新 lint 规则
          DOD_FILES=$(echo "$CHANGED" | grep -E '(^|/)DoD\.md$|(^|/)contract-dod-ws[0-9]+\.md$' | grep -v '^sprints/archive/' || true)
          if [ -z "$DOD_FILES" ]; then
            echo "has_dod=false" >> $GITHUB_OUTPUT
            echo "⏭️  无 DoD/contract 文件变更，跳过 harness-contract-lint"
          else
            echo "has_dod=true" >> $GITHUB_OUTPUT
            {
              echo "dod_files<<DODEOF"
              echo "$DOD_FILES"
              echo "DODEOF"
            } >> $GITHUB_OUTPUT
            echo "🔍 检测到 DoD/contract 文件变更:"
            echo "$DOD_FILES"
          fi
      - name: Lint DoD/contract 文件
        if: steps.detect-dod.outputs.has_dod == 'true'
        run: |
          FAILED=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            echo "── 检查: $f"
            if node scripts/harness-contract-lint.mjs "$f"; then
              echo "✅ $f 通过"
            else
              echo "❌ $f 不合规"
              FAILED=$((FAILED + 1))
            fi
          done <<< "${{ steps.detect-dod.outputs.dod_files }}"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} 个 DoD/contract 文件不合规，请修复后重新 push"
            exit 1
          fi
          echo "✅ harness-contract-lint: 所有 DoD/contract 文件合规"

  # ─── /dev TDD Lint Suite（PR only，把 SKILL.md 纪律机器化）──────
  # 4 个 lint job 对应 packages/engine/skills/dev/SKILL.md 中"smoke.sh 必须"段
  # 实现脚本：.github/workflows/scripts/lint-*.sh（本地可独立执行）
  lint-test-pairing:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test Pairing Lint
        run: bash .github/workflows/scripts/lint-test-pairing.sh "origin/${{ github.base_ref }}"

  lint-feature-has-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Feature smoke.sh Lint
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: bash .github/workflows/scripts/lint-feature-has-smoke.sh "origin/${{ github.base_ref }}"

  lint-base-fresh:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base Fresh Lint
        run: bash .github/workflows/scripts/lint-base-fresh.sh "origin/${{ github.base_ref }}"

  lint-bypass-not-committed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Stop Hook BYPASS 反 AI 滥用 lint (layer 1)
        run: bash scripts/check-bypass-not-committed.sh

  lint-tdd-commit-order:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TDD Commit Order Lint
        run: bash .github/workflows/scripts/lint-tdd-commit-order.sh "origin/${{ github.base_ref }}"

  lint-learning-constraint-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Learning→Constraint Integration Lint
        run: bash .github/workflows/scripts/lint-learning-constraint-coverage.sh

  lint-test-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test Quality Lint (拦"假测试 stub")
        run: bash .github/workflows/scripts/lint-test-quality.sh "origin/${{ github.base_ref }}"

  lint-no-mock-only-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No-Mock-Only Test Lint (拦"全 mock 测试")
        run: bash .github/workflows/scripts/lint-no-mock-only-test.sh "origin/${{ github.base_ref }}"

  lint-no-fake-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No-Fake-Test Lint (拦"假测试 — 弱断言占 100% / mock-heavy + 低 expect")
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: bash .github/workflows/scripts/lint-no-fake-test.sh "origin/${{ github.base_ref }}"

  lint-single-exit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Stop Hook 单一出口守护
        run: bash scripts/check-single-exit.sh

  # ─── Brain 版本递增门禁（仅 pull_request 事件，src 变更必须 bump）─────
  # 修复：改 packages/brain/src/** 不 bump 版本，check-version-sync 全绿放行的漏洞
  # 铁律：不改 scripts/check-version-sync.sh / auto-version.yml / brain-ci-deploy.yml
  # Task ID: d8189a83-3bd3-4da3-ac70-f0ed2ba4ece4
  brain-version-bump-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root deps（vitest 合同测试需要）
        run: npm ci
      - name: Brain Version Bump Gate
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/ci/check-brain-version-bump.sh

  # ─── Gate: 所有检查通过才能合并 ─────────────────────────────
  ci-passed:
    if: always()
    needs: [secrets-scan, dod-format-check, dep-audit, registry-lint, eslint, pr-size-check, branch-naming, engine-tests, engine-tests-shell, dashboard-staging-gate-smoke, lint-migration-unique-version, lint-auto-merge-decision, lint-fs-guard-selection, lint-deploy-effect-assert, brain-unit, brain-unit-all, brain-diff-coverage, brain-integration, workspace-build, workspace-test, e2e-smoke, core-regression, dod-behavior-dynamic, harness-dod-integrity, harness-contract-lint, docker-infra-smoke, lint-test-pairing, lint-feature-has-smoke, lint-base-fresh, lint-tdd-commit-order, lint-learning-constraint-coverage, lint-test-quality, lint-no-mock-only-test, lint-no-fake-test, lint-single-exit, lint-bypass-not-committed, real-env-smoke, workspace-api-smoke, quality-tests, dispatch-worker-test, brain-version-bump-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        run: |
          FAILED=false

          check() {
            local n=$1 r=$2
            case "$r" in
              success) echo "✅ $n" ;;
              skipped) echo "⏭️  $n (skipped)" ;;
              *) echo "❌ $n ($r)"; FAILED=true ;;
            esac
          }

          check "secrets-scan"      "${{ needs.secrets-scan.result }}"
          check "dod-format-check"  "${{ needs.dod-format-check.result }}"
          check "dep-audit"         "${{ needs.dep-audit.result }}"
          check "registry-lint"     "${{ needs.registry-lint.result }}"
          check "eslint"            "${{ needs.eslint.result }}"
          check "pr-size-check"     "${{ needs.pr-size-check.result }}"
          check "branch-naming"     "${{ needs.branch-naming.result }}"
          check "engine-tests"      "${{ needs.engine-tests.result }}"
          check "engine-tests-shell" "${{ needs.engine-tests-shell.result }}"
          check "dashboard-staging-gate-smoke" "${{ needs.dashboard-staging-gate-smoke.result }}"
          check "lint-migration-unique-version" "${{ needs.lint-migration-unique-version.result }}"
          check "lint-auto-merge-decision" "${{ needs.lint-auto-merge-decision.result }}"
          check "lint-fs-guard-selection" "${{ needs.lint-fs-guard-selection.result }}"
          check "lint-deploy-effect-assert" "${{ needs.lint-deploy-effect-assert.result }}"
          check "brain-unit"          "${{ needs.brain-unit.result }}"
          check "brain-unit-all"      "${{ needs.brain-unit-all.result }}"
          check "brain-diff-coverage" "${{ needs.brain-diff-coverage.result }}"
          check "brain-integration"   "${{ needs.brain-integration.result }}"
          check "workspace-build"        "${{ needs.workspace-build.result }}"
          check "workspace-test"         "${{ needs.workspace-test.result }}"
          check "e2e-smoke"              "${{ needs.e2e-smoke.result }}"
          # core-regression 无路径门，必须 success（skipped 也视为失败——它绝不该被跳过）
          if [ "${{ needs.core-regression.result }}" != "success" ]; then
            echo "❌ core-regression (must be success, got '${{ needs.core-regression.result }}')"; FAILED=true
          else
            echo "✅ core-regression"
          fi
          check "dod-behavior-dynamic"   "${{ needs.dod-behavior-dynamic.result }}"
          check "harness-dod-integrity"  "${{ needs.harness-dod-integrity.result }}"
          check "harness-contract-lint"  "${{ needs.harness-contract-lint.result }}"
          check "docker-infra-smoke"     "${{ needs.docker-infra-smoke.result }}"
          check "lint-test-pairing"      "${{ needs.lint-test-pairing.result }}"
          check "lint-feature-has-smoke" "${{ needs.lint-feature-has-smoke.result }}"
          check "lint-base-fresh"        "${{ needs.lint-base-fresh.result }}"
          check "lint-tdd-commit-order"  "${{ needs.lint-tdd-commit-order.result }}"
          check "lint-learning-constraint-coverage" "${{ needs.lint-learning-constraint-coverage.result }}"
          check "lint-test-quality"      "${{ needs.lint-test-quality.result }}"
          check "lint-no-mock-only-test" "${{ needs.lint-no-mock-only-test.result }}"
          check "lint-no-fake-test"      "${{ needs.lint-no-fake-test.result }}"
          check "lint-single-exit"       "${{ needs.lint-single-exit.result }}"
          check "lint-bypass-not-committed" "${{ needs.lint-bypass-not-committed.result }}"
          check "real-env-smoke"         "${{ needs.real-env-smoke.result }}"
          check "workspace-api-smoke"    "${{ needs.workspace-api-smoke.result }}"
          check "quality-tests"         "${{ needs.quality-tests.result }}"
          check "dispatch-worker-test"   "${{ needs.dispatch-worker-test.result }}"
          check "brain-version-bump-gate" "${{ needs.brain-version-bump-gate.result }}"

          if [ "$FAILED" = "true" ]; then
            echo ""; echo "❌ CI FAILED"; exit 1
          fi
          echo ""; echo "✅ CI PASSED"

  # ─── 兼容 job id：只观察 merge eligibility，不执行外部 effect ───
  auto-merge:
    needs: [ci-passed]
    if: always() && needs.ci-passed.result == 'success' && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout（取 should-auto-merge.sh 决策脚本）
        uses: actions/checkout@v4
      - name: Kernel merge eligibility（只读）
        env:
          # PR_TITLE / HEAD_BRANCH 走 env 而非内联 ${{ }}：分支名和标题是用户可控输入，
          # 直接内联进 run 脚本存在 shell 注入面（GHA 已知问题）。
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          # 合并决策抽到 should-auto-merge.sh（可单测，见 __tests__/should-auto-merge.test.sh）。
          # Phase 0：cp-* 一律停在统一 Kernel merge gate。标题/分支/body 都不是授权。
          # SHA-bound、server-owned receipt 接入前，此 job 保持 fail-closed。
          DECISION="$(bash .github/workflows/scripts/should-auto-merge.sh "$HEAD_BRANCH" "$PR_TITLE")"
          echo "$DECISION"
          if [[ "$DECISION" == SKIP:* ]]; then
            exit 0
          fi

          echo "Kernel-only：CI workflow 不持有 merge authority；等待 exact-SHA effect receipt。"

  # ─── dispatch-worker 纯函数层单测（scripts/ 测试无 glob 自动收集，不接=假绿）──────
  dispatch-worker-test:
    name: dispatch-worker 单测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: dispatch-worker 单测
        run: node --test scripts/dispatch-worker.test.mjs
