name: CI
'on':
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      foundation_release_verification:
        description: 验证已正式登记的发布就绪报告Workflow
        type: boolean
        default: false
  schedule:
    - cron: 0 3 * * 1
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'weekly-codeql' || github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && 'dependabot' || github.ref }}
  queue: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && 'max' || 'single' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.user.login != 'dependabot[bot]' }}
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install locked dependency manifests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check dependency vulnerabilities
        run: |
          bash scripts/ci/dep-audit-runtime-high.sh
          bash scripts/ci/dep-audit-critical.sh
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  checks:
    name: ${{ format('Check ({0} {1})', matrix.component, matrix.shard) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: brain-unit, shard: 1}
          - {component: brain-unit, shard: 2}
          - {component: brain-unit, shard: 3}
          - {component: brain-unit, shard: 4}
          - {component: brain-unit, shard: 5}
          - {component: brain-unit, shard: 6}
          - {component: brain-integration}
          - {component: image}
          - {component: dashboard}
          - {component: ops}
          - {component: scripts}
    services:
      postgres:
        image: ${{ matrix.component == 'brain-integration' && 'mirror.gcr.io/pgvector/pgvector:pg15' || '' }}
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: isolated-ci, POSTGRES_DB: cecelia_scratch}
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U ci -d cecelia_scratch" --health-interval 5s --health-timeout 5s --health-retries 12'
    env:
      CI: 'true'
      POSTGRES_INTEGRATION: ${{ matrix.component == 'brain-integration' && '1' || '0' }}
      API_PG_INTEGRATION: '0'
      CODEX_RELAY_HOME: /tmp/ci-fake-codex-home
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: cecelia_scratch
      DB_USER: ci
      DB_PASSWORD: isolated-ci
      DATABASE_URL: ${{ matrix.component == 'brain-integration' && 'postgresql://ci:isolated-ci@127.0.0.1:5432/cecelia_scratch' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Require actual Brain version increment
        if: matrix.component == 'scripts' && (github.event_name == 'pull_request' || github.event_name == 'push')
        env: {BASE_REF: '${{ github.event.pull_request.base.sha || github.event.before }}', HEAD_REF: '${{ github.event.pull_request.head.sha || github.sha }}'}
        run: bash scripts/ci/check-brain-version-bump.sh
      - name: Prepare Ubuntu package sources
        run: node scripts/ci/prepare-ubuntu-archive.mjs
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep jq zsh libxml2-utils
      - name: Install locked dependencies
        if: matrix.component != 'image'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/dockerhub-mirror
        if: matrix.component == 'image'
      - name: Run actual checks
        env: {COMPONENT: '${{ matrix.component }}', SHARD: '${{ matrix.shard }}'}
        run: node scripts/ci/run-basic-check.mjs "$COMPONENT" "$SHARD"
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: onboarding_ci
          POSTGRES_PASSWORD: onboarding_ci
          POSTGRES_DB: cecelia_scratch
        ports:
          - '5432:5432'
        options: '--health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 真实采集与凭据生命周期回归
        run: node --test --test-concurrency=1 scripts/ops/__tests__/node-onboarding*.test.mjs
      - name: 接入结算与隔离回归（含真实数据库）
        working-directory: packages/brain
        env:
          NODE_ONBOARDING_TEST_DB: postgresql://onboarding_ci:onboarding_ci@localhost:5432/cecelia_scratch
        run: >-
          npx vitest run src/node-onboarding/__tests__/service.test.js src/node-onboarding/__tests__/settlement.test.js
          src/node-onboarding/__tests__/registry-adoption.test.js --maxWorkers=1
          --minWorkers=1
      - name: Linux自动接入与续验真实数据库回归
        working-directory: packages/brain
        env:
          TEST_DATABASE_URL: postgresql://onboarding_ci:onboarding_ci@localhost:5432/cecelia_scratch
        run: >-
          npx vitest run --config vitest.integration.config.js src/__tests__/integration/linux-controller-contract.pg.integration.test.js
          src/__tests__/integration/linux-onboarding-flow.pg.integration.test.js src/__tests__/integration/linux-script-authorization.pg.integration.test.js
          --maxWorkers=1 --minWorkers=1
      - name: Verify real process recovery without replay
        env:
          TEST_DB_URL: postgresql://onboarding_ci:onboarding_ci@127.0.0.1:5432/cecelia_scratch
        run: node packages/brain/scripts/smoke/commander-dbos-recovery-smoke.mjs
        if: '!cancelled()'
      - name: Verify Commander decisions and activity recovery
        env:
          TEST_DB_URL: postgresql://onboarding_ci:onboarding_ci@127.0.0.1:5432/cecelia_scratch
        run: node packages/brain/scripts/smoke/commander-foundation-smoke.mjs
        if: '!cancelled()'
      - name: Verify bounded checker repair and host recovery
        env:
          TEST_DB_URL: postgresql://onboarding_ci:onboarding_ci@127.0.0.1:5432/cecelia_scratch
        run: node packages/brain/scripts/smoke/commander-repair-smoke.mjs
        if: '!cancelled()'
      - name: Verify Workflow registration to Brain and real DBOS execution
        working-directory: packages/brain
        env:
          DB_NAME: cecelia_scratch
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: onboarding_ci
          DB_PASSWORD: onboarding_ci
          TEST_DB_URL: postgresql://onboarding_ci:onboarding_ci@127.0.0.1:5432/cecelia_scratch
        run: >-
          npx vitest run --config vitest.integration.config.js
          src/__tests__/integration/workflow-foundation.pg.integration.test.js
          src/__tests__/integration/foundation-legacy-entrances.pg.integration.test.js
          --maxWorkers=1 --minWorkers=1
        if: '!cancelled()'
      - name: Verify audited Commander failure boundaries
        working-directory: packages/brain
        env:
          TEST_DB_URL: postgresql://onboarding_ci:onboarding_ci@127.0.0.1:5432/cecelia_scratch
        run: >-
          npx vitest run --config vitest.integration.config.js
          src/orchestrator/__tests__/commander-foundation-audit.pg.integration.test.js
          src/durable/__tests__/commander-action-store.pg.integration.test.js
          --maxWorkers=1 --minWorkers=1
        if: '!cancelled()'
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  pwa-upgrade:
    name: Browser regression (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      DASHBOARD_E2E_DIST: .dist-pwa-e2e
      EXPECTED_BUILD_VERSION: ${{ github.sha }}
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: package-lock.json}
      - name: Install workspace dependencies
        run: npm ci
        working-directory: .
      - name: Prepare Ubuntu package sources
        run: node scripts/ci/prepare-ubuntu-archive.mjs
        working-directory: .
      - name: Install Chromium
        timeout-minutes: 9
        run: node e2e/playwright-cli.mjs install chromium --with-deps
      - name: Build shared browser acceptance artifact
        run: GIT_SHA="$GITHUB_SHA" npx --no-install vite build --outDir .dist-pwa-e2e
      - name: Verify stale PWA upgrade
        run: npm run test:pwa-upgrade:built
      - name: Verify task desk receipts
        run: npm run test:task-desk:built
      - name: Verify current cockpit inbox and destination routes
        run: node e2e/playwright-cli.mjs test --config ../../tests/regression/manual-ui/playwright.config.ts
    if: github.event_name != 'schedule' && github.event.action != 'closed'
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, security-events: write}
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with: {languages: '${{ matrix.language }}', build-mode: none}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
  foundation-release-verification:
    name: Foundation正式发布验证
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.foundation_release_verification == true
    needs: [ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: 安装固定依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 连接现役Brain只读快照接口
        uses: tailscale/github-action@v2
        with: {authkey: '${{ secrets.TS_AUTHKEY }}'}
      - name: 获取本次main的正式Workflow快照
        env: {CECELIA_INTERNAL_TOKEN: '${{ secrets.CECELIA_INTERNAL_TOKEN }}'}
        run: node scripts/ci/foundation-release-snapshot.mjs "$GITHUB_SHA" "$RUNNER_TEMP/foundation-release/snapshot.json"
      - name: 执行全部已登记发布回归
        run: node scripts/ci/pilot-release-verification.mjs --repo-root . --snapshot "$RUNNER_TEMP/foundation-release/snapshot.json" --output-dir "$RUNNER_TEMP/foundation-release/proof" --event workflow_dispatch --ref refs/heads/main
      - name: 保留原始发布报告与失败证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-release-verification-${{ github.sha }}
          path: ${{ runner.temp }}/foundation-release/
          if-no-files-found: error
  ci-passed:
    name: 源码保底通过
    needs:
      - security
      - checks
      - runtime-integration
      - pwa-upgrade
      - codeql
    if: always() && github.event_name != 'schedule' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require every selected check to finish successfully
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-basic-results.mjs
  brain-deploy:
    name: Brain发布与版本确认
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs['ci-passed'].result == 'success'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions: {contents: read}
    env:
      BRAIN_URL: http://100.79.41.61:5221
      GITHUB_SHA: ${{ github.sha }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      REQUIRE_EXACT_SHA: '1'
      FORCE_BRAIN_DEPLOY: ${{ vars.FORCE_BRAIN_DEPLOY || '0' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: tailscale/github-action@v2
        with: {authkey: '${{ secrets.TS_AUTHKEY }}'}
      - name: 核对现役版本并按需执行隔离验收与发布
        run: bash scripts/ci/run-brain-deploy.sh "$BRAIN_URL" "$GITHUB_SHA" "$RUNNER_TEMP/brain-deploy-preflight/report.json"
      - name: 保留发布判断与原生身份依据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-deploy-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/brain-deploy-preflight/report.json
          if-no-files-found: error
