name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select complete component checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node scripts/ci/basic-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          elif [ "$EVENT_NAME" = push ]; then
            node scripts/ci/basic-scope.mjs --full --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node scripts/ci/basic-scope.mjs --full --head "$HEAD_SHA"
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependency manifests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check dependency vulnerabilities
        run: |
          bash scripts/ci/dep-audit-runtime-high.sh
          bash scripts/ci/dep-audit-critical.sh

  checks:
    needs: plan
    name: Check (${{ matrix.component }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: ${{ matrix.component == 'brain-integration' && 'mirror.gcr.io/pgvector/pgvector:pg15' || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: cecelia_scratch
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci -d cecelia_scratch" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      POSTGRES_INTEGRATION: ${{ matrix.component == 'brain-integration' && '1' || '0' }}
      CODEX_RELAY_HOME: /tmp/ci-fake-codex-home
      DB_HOST: '127.0.0.1'
      DB_PORT: '5432'
      DB_NAME: cecelia_scratch
      DB_USER: ci
      DB_PASSWORD: isolated-ci
      DATABASE_URL: ${{ matrix.component == 'brain-integration' && 'postgresql://ci:isolated-ci@127.0.0.1:5432/cecelia_scratch' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep jq zsh libxml2-utils
      - uses: actions/setup-java@v4
        if: matrix.component == 'android'
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
        if: matrix.component == 'android'
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install standalone frontend dependencies
        if: matrix.component == 'frontend'
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/dockerhub-mirror
        if: matrix.component == 'image'
      - name: Run actual checks
        env:
          COMPONENT: ${{ matrix.component }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/run-basic-check.mjs "$COMPONENT" "$SHARD"

  ci-passed:
    name: 源码保底通过
    needs: [plan, security, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require every selected check to finish successfully
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-basic-results.mjs
