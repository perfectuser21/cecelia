name: Heartbeat Sentinel

# 机外哨兵：从 GitHub Actions 反向探测生产 Brain。
# 生产机整体死亡时，住在地盘 B 的所有守卫陪葬；此 workflow 住地盘 A（GitHub）。
#
# 探测两项：
#   1. /api/brain/health 可达且 healthy
#   2. GitHub 官方 main Deep Regression 最近 completed run 成功且在26h内
#      这是源码深回归回执，不代表生产业务或旧 smoke nightly 已运行。
#
# 任一失败 -> 开 GitHub Issue（标题含 [heartbeat-sentinel]，已有 open 同款不重复开）
#           + Bark 推送（BARK_URL secret）
#
# 演习：workflow_dispatch 的 probe_url 填死端口即可，无需碰生产。

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      probe_url:
        description: "probe URL (empty = production; drill: use dead port e.g. http://IP:9999)"
        required: false
        default: ""

concurrency:
  group: heartbeat-sentinel
  cancel-in-progress: false

env:
  DEFAULT_PROBE_URL: "http://100.79.41.61:5221"
  ISSUE_LABEL: heartbeat-sentinel
  ISSUE_TITLE_PREFIX: "[heartbeat-sentinel]"

jobs:
  probe:
    name: 反向探测生产 Brain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      health_ok: ${{ steps.health.outputs.ok }}
      # kv_* 仅为历史输出兼容名；实际证据为官方 Deep Regression run。
      kv_ok: ${{ steps.kv.outputs.ok }}
      probe_url: ${{ steps.resolve.outputs.url }}
      kv_age_minutes: ${{ steps.kv.outputs.age_minutes }}

    steps:
      - name: 解析探测 URL
        id: resolve
        run: |
          INPUT_URL="${{ github.event.inputs.probe_url }}"
          if [[ -n "$INPUT_URL" ]]; then
            echo "url=$INPUT_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=$DEFAULT_PROBE_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: 探测 /api/brain/health
        id: health
        env:
          PROBE_URL: ${{ steps.resolve.outputs.url }}
        run: |
          set -euo pipefail
          echo "探测: $PROBE_URL/api/brain/health"
          RESPONSE=$(curl -sf --max-time 15 -w $'\n%{http_code}' "$PROBE_URL/api/brain/health" 2>/dev/null || echo "CURL_FAIL")

          if [[ ! "${RESPONSE##*$'\n'}" =~ ^2[0-9][0-9]$ ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "detail=不可达（curl 超时/连接拒绝）" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=${RESPONSE%$'\n'*}
          STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "parse_error")
          if [[ "$STATUS" == "healthy" || "$STATUS" == "ok" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "detail=响应异常 status=$STATUS" >> "$GITHUB_OUTPUT"
          fi

      - name: 探测 main Deep Regression 官方回执时效
        id: kv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail_probe() {
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "age_minutes=-1" >> "$GITHUB_OUTPUT"
            echo "detail=Deep Regression 官方回执缺失、失败或无效" >> "$GITHUB_OUTPUT"
            exit 1
          }
          [[ -n "${GH_TOKEN:-}" && "${GITHUB_REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail_probe
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-regression.yml/runs?branch=main&status=completed&per_page=1"
          RESPONSE=$(curl -sf --max-time 15 -w $'\n%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL" 2>/dev/null) || fail_probe
          [[ "${RESPONSE##*$'\n'}" == '200' ]] || fail_probe
          RESPONSE=${RESPONSE%$'\n'*}
          RECEIPT=$(printf '%s' "$RESPONSE" | python3 -c '
          import datetime, json, os, re, sys
          try:
              body = json.load(sys.stdin)
              assert isinstance(body, dict)
              assert type(body.get("total_count")) is int and body["total_count"] > 0
              runs = body.get("workflow_runs")
              assert isinstance(runs, list) and len(runs) == 1
              run = runs[0]
              assert isinstance(run, dict)
              assert run.get("path") == ".github/workflows/nightly-regression.yml"
              assert run.get("head_branch") == "main"
              assert run.get("status") == "completed" and run.get("conclusion") == "success"
              run_id, sha = run.get("id"), run.get("head_sha")
              assert type(run_id) is int and run_id > 0
              assert isinstance(sha, str) and re.fullmatch("[a-f0-9]{40}", sha)
              stamp = run.get("updated_at")
              assert isinstance(stamp, str) and re.search(r"(?:Z|[+-]\d{2}:\d{2})$", stamp)
              finished = datetime.datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              assert finished.tzinfo is not None
              age = (datetime.datetime.now(datetime.timezone.utc) - finished).total_seconds()
              assert 0 <= age <= 26 * 3600
              url = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + str(run_id)
              assert run.get("html_url") == url
          except (AssertionError, ValueError, TypeError, KeyError, OverflowError):
              sys.exit(1)
          print("ok=true")
          print("age_minutes=" + str(int(age // 60)))
          print("run_id=" + str(run_id))
          print("run_sha=" + sha)
          print("run_url=" + url)
          ' 2>/dev/null) || fail_probe
          printf '%s\n' "$RECEIPT" >> "$GITHUB_OUTPUT"

  alert:
    name: 告警（Issue + Bark）
    needs: probe
    if: always() && (needs.probe.result != 'success' || needs.probe.outputs.health_ok != 'true' || needs.probe.outputs.kv_ok != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT_BOT || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PROBE_URL: ${{ needs.probe.outputs.probe_url }}
      HEALTH_OK: ${{ needs.probe.outputs.health_ok }}
      KV_OK: ${{ needs.probe.outputs.kv_ok }}
      KV_AGE: ${{ needs.probe.outputs.kv_age_minutes }}

    steps:
      - name: 开 GitHub Issue（去重）
        run: |
          set -euo pipefail

          TODAY=$(date -u +%Y-%m-%d)
          TITLE="${ISSUE_TITLE_PREFIX} 生产探测失败 — ${TODAY}"

          EXISTING=$(gh api "repos/${REPO}/issues?state=open&labels=${ISSUE_LABEL}&per_page=50" \
            --jq "[.[] | select(.title==\"${TITLE}\")] | length")
          [[ "$EXISTING" =~ ^[0-9]+$ ]] || { echo "::error::Issue 去重读取无效"; exit 1; }
          if [ "$EXISTING" -gt 0 ]; then
            echo "已有同名 open issue，跳过: $TITLE"
          else
            BODY="## Heartbeat Sentinel 告警"$'\n\n'"**日期**: ${TODAY}"$'\n'"**CI Run**: ${RUN_URL}"$'\n'"**探测目标**: ${PROBE_URL}"$'\n\n'"### 失败项"
            if [ "$HEALTH_OK" != "true" ]; then
              BODY="$BODY"$'\n'"- ❌ \`/api/brain/health\` 不可达或 unhealthy"
            fi
            if [ "$KV_OK" != "true" ]; then
              BODY="$BODY"$'\n'"- ❌ main Deep Regression 无26h内有效成功回执（${KV_AGE}min）"
            fi

            gh issue create \
              --repo "${REPO}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label "${ISSUE_LABEL}" \
              2>/dev/null || \
            gh issue create \
              --repo "${REPO}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              || { echo "::error::Issue 创建失败"; exit 1; }
          fi

      - name: Bark 告警推送
        if: always()
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_TOKEN: ${{ secrets.BARK_TOKEN }}
        run: |
          set -euo pipefail

          FAILURES=""
          if [ "$HEALTH_OK" != "true" ]; then
            FAILURES="${FAILURES}Brain /health 不可达; "
          fi
          if [ "$KV_OK" != "true" ]; then
            FAILURES="${FAILURES}Deep Regression 失败或回执超期 ${KV_AGE}min; "
          fi

          TITLE="心跳哨兵告警"
          BODY="生产探测失败: ${FAILURES}目标=${PROBE_URL}"

          if [[ -n "${BARK_URL:-}" ]]; then
            ENCODED_TITLE=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$TITLE")
            ENCODED_BODY=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$BODY")
            HTTP_CODE=$(curl -sf --max-time 10 -o /dev/null -w '%{http_code}' \
              "${BARK_URL}/${ENCODED_TITLE}/${ENCODED_BODY}?group=heartbeat-sentinel&level=critical" \
              2>/dev/null) || { CURL_EXIT=$?; echo "::error::Bark 推送失败 curl_exit=$CURL_EXIT http=${HTTP_CODE:-000}"; exit 1; }
            [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]] || { echo "::error::Bark HTTP $HTTP_CODE"; exit 1; }
            echo "Bark ok"
          elif [[ -n "${BARK_TOKEN:-}" ]]; then
            ENCODED_TITLE=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$TITLE")
            ENCODED_BODY=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$BODY")
            HTTP_CODE=$(curl -sf --max-time 10 -o /dev/null -w '%{http_code}' \
              "https://api.day.app/${BARK_TOKEN}/${ENCODED_TITLE}/${ENCODED_BODY}?group=heartbeat-sentinel&level=critical" \
              2>/dev/null) || { CURL_EXIT=$?; echo "::error::Bark 推送失败 curl_exit=$CURL_EXIT http=${HTTP_CODE:-000}"; exit 1; }
            [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]] || { echo "::error::Bark HTTP $HTTP_CODE"; exit 1; }
            echo "Bark ok"
          else
            echo "::error::未配 BARK_URL / BARK_TOKEN，Bark 告警未完成"
            exit 1
          fi

  close-on-success:
    name: 恢复时关闭 Issue
    needs: probe
    if: always() && needs.probe.result == 'success' && needs.probe.outputs.health_ok == 'true' && needs.probe.outputs.kv_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT_BOT || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: 关闭 open 的 heartbeat-sentinel issues
        run: |
          set -euo pipefail
          OPEN_ISSUES=$(gh api "repos/${REPO}/issues?state=open&labels=${ISSUE_LABEL}&per_page=50" \
            --jq '.[].number')
          if [[ -z "$OPEN_ISSUES" ]]; then
            echo "无 open issues"
            exit 0
          fi
          for NUM in $OPEN_ISSUES; do
            gh issue close "$NUM" \
              --repo "${REPO}" \
              --comment "心跳哨兵恢复正常，自动关闭。Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              2>/dev/null
            echo "已关闭 Issue #$NUM"
          done
