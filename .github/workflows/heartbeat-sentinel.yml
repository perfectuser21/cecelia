name: Heartbeat Sentinel（机外心跳反向探测）

# 机外哨兵：从 GitHub Actions 反向探测生产 Brain。
# 生产机整体死亡时，住在地盘 B 的所有守卫陪葬——此 workflow 住地盘 A（GitHub）。
#
# 探测两项：
#   1. /api/brain/health 可达且 healthy
#   2. KV smoke-nightly-last-run 时效 <26h（证明 nightly 作业确实在跑）
#
# 任一失败 → 开 GitHub Issue（标题含 [heartbeat-sentinel]，已有 open 同款不重复开）
#           + Bark 推送（BARK_URL secret）
#
# 演习：把 workflow_dispatch 的 probe_url 改指死端口即可，无需碰生产。

on:
  schedule:
    # 每 30 分钟（UTC），北京时间 :00/:30
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      probe_url:
        description: '探测目标 URL（留空 = 生产；演习填死端口如 http://100.71.151.105:9999）'
        required: false
        default: ''

concurrency:
  group: heartbeat-sentinel
  cancel-in-progress: false

env:
  # 默认生产 Brain（Tailscale 内网）；workflow_dispatch 可覆盖
  DEFAULT_PROBE_URL: 'http://100.71.151.105:5221'
  ISSUE_LABEL: 'heartbeat-sentinel'
  ISSUE_TITLE_PREFIX: '[heartbeat-sentinel]'

jobs:
  probe:
    name: 反向探测生产 Brain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      health_ok: ${{ steps.health.outputs.ok }}
      kv_ok: ${{ steps.kv.outputs.ok }}
      probe_url: ${{ steps.resolve.outputs.url }}
      kv_age_minutes: ${{ steps.kv.outputs.age_minutes }}

    steps:
      - name: 解析探测 URL
        id: resolve
        run: |
          INPUT_URL="${{ github.event.inputs.probe_url }}"
          if [[ -n "$INPUT_URL" ]]; then
            echo "url=$INPUT_URL" >> "$GITHUB_OUTPUT"
            echo "probe_url=$INPUT_URL (workflow_dispatch 覆盖)"
          else
            echo "url=$DEFAULT_PROBE_URL" >> "$GITHUB_OUTPUT"
            echo "probe_url=$DEFAULT_PROBE_URL (默认生产)"
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: 探测 /api/brain/health
        id: health
        env:
          PROBE_URL: ${{ steps.resolve.outputs.url }}
        run: |
          set -uo pipefail
          echo "探测: $PROBE_URL/api/brain/health"
          RESPONSE=$(curl -sf --max-time 15 "$PROBE_URL/api/brain/health" 2>/dev/null || echo "CURL_FAIL")

          if [[ "$RESPONSE" == "CURL_FAIL" ]]; then
            echo "❌ /api/brain/health 不可达"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "detail=不可达（curl 超时/连接拒绝）" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "parse_error")
          if [[ "$STATUS" == "healthy" || "$STATUS" == "ok" ]]; then
            echo "✅ Brain healthy (status=$STATUS)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Brain unhealthy (status=$STATUS)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "detail=响应异常 status=$STATUS" >> "$GITHUB_OUTPUT"
          fi

      - name: 探测 KV smoke-nightly-last-run 时效
        id: kv
        env:
          PROBE_URL: ${{ steps.resolve.outputs.url }}
        run: |
          set -uo pipefail
          MAX_AGE_HOURS=26
          MAX_AGE_SECONDS=$(( MAX_AGE_HOURS * 3600 ))

          RESPONSE=$(curl -sf --max-time 15 "$PROBE_URL/api/brain/kv/smoke-nightly-last-run" 2>/dev/null || echo "CURL_FAIL")

          if [[ "$RESPONSE" == "CURL_FAIL" ]]; then
            # Brain 不可达时 KV 也必然不通，health 步骤已覆盖，此处标记跳过
            echo "⚠️ KV 不可达（Brain 探测已失败，KV 同样不通）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "age_minutes=-1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 解析 finished_at 字段（ISO8601）
          FINISHED_AT=$(echo "$RESPONSE" | python3 -c "
import json, sys
d = json.load(sys.stdin)
# KV endpoint 返回 {value: {...}, ...} 或直接返回 payload
v = d.get('value', d)
if isinstance(v, str):
    import json as j2
    v = j2.loads(v)
print(v.get('finished_at', ''))
" 2>/dev/null || echo "")

          if [[ -z "$FINISHED_AT" ]]; then
            echo "❌ KV smoke-nightly-last-run 无 finished_at 字段（从未运行或格式异常）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "age_minutes=-1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 计算时效（秒）
          NOW_EPOCH=$(date -u +%s)
          FINISHED_EPOCH=$(date -u -d "$FINISHED_AT" +%s 2>/dev/null || \
                           python3 -c "from datetime import datetime,timezone; print(int(datetime.fromisoformat('$FINISHED_AT'.replace('Z','+00:00')).timestamp()))")
          AGE_S=$(( NOW_EPOCH - FINISHED_EPOCH ))
          AGE_MINUTES=$(( AGE_S / 60 ))
          echo "age_minutes=$AGE_MINUTES" >> "$GITHUB_OUTPUT"

          if (( AGE_S > MAX_AGE_SECONDS )); then
            echo "❌ KV 已 ${AGE_MINUTES} 分钟未更新（阈值 $((MAX_AGE_HOURS*60)) 分钟）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ KV 时效正常（${AGE_MINUTES} 分钟前）"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  alert:
    name: 告警（Issue + Bark）
    needs: probe
    if: always() && (needs.probe.outputs.health_ok == 'false' || needs.probe.outputs.kv_ok == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT_BOT || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PROBE_URL: ${{ needs.probe.outputs.probe_url }}
      HEALTH_OK: ${{ needs.probe.outputs.health_ok }}
      KV_OK: ${{ needs.probe.outputs.kv_ok }}
      KV_AGE: ${{ needs.probe.outputs.kv_age_minutes }}

    steps:
      - name: 开 GitHub Issue（去重）
        run: |
          set -uo pipefail

          TODAY=$(date -u +%Y-%m-%d)
          TITLE="${ISSUE_TITLE_PREFIX} 生产探测失败 — ${TODAY}"

          # 去重：已有 open 同款 issue 则跳过
          EXISTING=$(gh api "repos/${REPO}/issues?state=open&labels=${ISSUE_LABEL}&per_page=50" \
            --jq "[.[] | select(.title==\"${TITLE}\")] | length" 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "已有同名 open issue，跳过: $TITLE"
          else
            BODY="## Heartbeat Sentinel 告警"
            BODY="$BODY"$'\n\n'"**日期**: ${TODAY}"
            BODY="$BODY"$'\n'"**CI Run**: ${RUN_URL}"
            BODY="$BODY"$'\n'"**探测目标**: ${PROBE_URL}"
            BODY="$BODY"$'\n\n'"### 失败项"
            if [ "$HEALTH_OK" != "true" ]; then
              BODY="$BODY"$'\n'"- ❌ \`/api/brain/health\` 不可达或返回非 healthy 状态"
            else
              BODY="$BODY"$'\n'"- ✅ \`/api/brain/health\` 正常"
            fi
            if [ "$KV_OK" != "true" ]; then
              if [ "$KV_AGE" = "-1" ]; then
                BODY="$BODY"$'\n'"- ❌ KV \`smoke-nightly-last-run\` 不可达或从未运行"
              else
                BODY="$BODY"$'\n'"- ❌ KV \`smoke-nightly-last-run\` 已 ${KV_AGE} 分钟未更新（阈值 1560 分钟）"
              fi
            else
              BODY="$BODY"$'\n'"- ✅ KV 时效正常"
            fi
            BODY="$BODY"$'\n\n'"### 排查建议"
            BODY="$BODY"$'\n'"1. SSH 登录生产机确认 Brain 容器状态：\`docker ps | grep cecelia-brain\`"
            BODY="$BODY"$'\n'"2. 检查 nightly smoke 是否正常运行：\`curl localhost:5221/api/brain/kv/smoke-nightly-last-run\`"
            BODY="$BODY"$'\n'"3. 检查 Tailscale 连通性：\`tailscale status\`"
            BODY="$BODY"$'\n\n'"> 本 Issue 由 heartbeat-sentinel.yml 自动创建。探测恢复正常后会在下次绿跑时自动关闭。"

            gh issue create \
              --repo "${REPO}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label "${ISSUE_LABEL}" \
              2>/dev/null || \
            gh issue create \
              --repo "${REPO}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              || echo "::warning::Issue 创建失败（可能标签不存在），跳过"

            echo "✅ GitHub Issue 已创建: $TITLE"
          fi

      - name: Bark 告警推送
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_TOKEN: ${{ secrets.BARK_TOKEN }}
        run: |
          set -uo pipefail

          # 组装告警摘要
          FAILURES=""
          if [ "$HEALTH_OK" != "true" ]; then
            FAILURES="${FAILURES}Brain /health 不可达; "
          fi
          if [ "$KV_OK" != "true" ]; then
            if [ "$KV_AGE" = "-1" ]; then
              FAILURES="${FAILURES}nightly KV 从未运行; "
            else
              FAILURES="${FAILURES}nightly KV 超期 ${KV_AGE}min; "
            fi
          fi

          TITLE="心跳哨兵告警"
          BODY="生产探测失败: ${FAILURES}目标=${PROBE_URL}"

          # 优先用 BARK_URL（完整 base URL），fallback 到 BARK_TOKEN
          if [[ -n "${BARK_URL:-}" ]]; then
            ENCODED_TITLE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$TITLE'))")
            ENCODED_BODY=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$BODY")
            curl -sf --max-time 10 \
              "${BARK_URL}/${ENCODED_TITLE}/${ENCODED_BODY}?group=heartbeat-sentinel&level=critical" \
              >/dev/null 2>&1 && echo "✅ Bark 推送成功（BARK_URL）" || echo "::warning::Bark 推送失败"
          elif [[ -n "${BARK_TOKEN:-}" ]]; then
            ENCODED_TITLE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$TITLE'))")
            ENCODED_BODY=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$BODY")
            curl -sf --max-time 10 \
              "https://api.day.app/${BARK_TOKEN}/${ENCODED_TITLE}/${ENCODED_BODY}?group=heartbeat-sentinel&level=critical" \
              >/dev/null 2>&1 && echo "✅ Bark 推送成功（BARK_TOKEN）" || echo "::warning::Bark 推送失败"
          else
            echo "::warning::未配 BARK_URL / BARK_TOKEN，跳过 Bark 推送"
          fi

  close-on-success:
    name: 恢复绿跑时关闭 Issue
    needs: probe
    if: always() && needs.probe.outputs.health_ok == 'true' && needs.probe.outputs.kv_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT_BOT || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: 关闭 open 的 heartbeat-sentinel issues
        run: |
          set -uo pipefail
          OPEN_ISSUES=$(gh api "repos/${REPO}/issues?state=open&labels=${ISSUE_LABEL}&per_page=50" \
            --jq '.[].number' 2>/dev/null || echo "")
          if [[ -z "$OPEN_ISSUES" ]]; then
            echo "无 open 的 heartbeat-sentinel issues，无需关闭"
            exit 0
          fi
          for NUM in $OPEN_ISSUES; do
            gh issue close "$NUM" \
              --repo "${REPO}" \
              --comment "✅ 心跳哨兵恢复正常，自动关闭。Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              2>/dev/null && echo "已关闭 Issue #$NUM" || echo "::warning::关闭 Issue #$NUM 失败"
          done
