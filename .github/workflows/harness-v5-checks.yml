name: Harness v5 Checks

# v5 Sprint C：合同纪律的 CI 硬校验
# 观察期已过，全部切硬门禁（PR cp-0427095721 移除 continue-on-error）
#
# 触发范围：合同相关改动才真跑（changes job 内部三点 diff 判定）。
# 2026-07-06 required 化：required context 必须每个 PR 出结论 → 去掉 workflow 级 paths
# 过滤，改为 changes 检测 + 各 job 条件 skip + 聚合 job「Harness V5 Gate Passed」
# （success|skipped 放行）。不相关 PR 秒绿零成本。

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─── Check 0: 变更路径检测（三点 diff = merge-base 语义，落后 main 的 PR 不误判）───
  changes:
    name: changes — 合同文件变更检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event: run all"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE...$HEAD")
          echo "$FILES"
          HIT=false
          if echo "$FILES" | grep -vE '^sprints/archive/' | grep -qE '^(sprints/.*(contract-draft\.md|sprint-contract\.md|contract-dod-ws[0-9]+\.md)$|sprints/.*/tests/.*\.test\.ts$|\.github/workflows/harness-v5-checks\.yml$)'; then
            HIT=true
          fi
          echo "contracts=$HIT" >> "$GITHUB_OUTPUT"

  # ─── Check 1: DoD 纯度（contract-dod-ws 禁 [BEHAVIOR]） ────────────
  dod-structure-purity:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    name: DoD 纯度检查 (v5.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run check-dod-purity
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node packages/engine/scripts/devgate/check-dod-purity.cjs

  # ─── Check 2: Test Contract 覆盖（测试文件必须存在） ─────────────────
  test-coverage-for-behavior:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    name: Test Contract 覆盖检查 (v5.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run check-test-coverage
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node packages/engine/scripts/devgate/check-test-coverage.cjs

  # ─── Check 3: TDD Red-Green commit 顺序 ───────────────────────────
  tdd-commit-order:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    name: TDD Commit 顺序检查 (v5.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run check-tdd-commit-order
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
        run: bash packages/engine/scripts/devgate/check-tdd-commit-order.sh

  # ─── Check 4: 测试实际通过（Red → Green 验证） ─────────────────────
  tests-actually-pass:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    name: Sprint Tests 实跑 (v5.0)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: cecelia
          POSTGRES_DB: cecelia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check if sprint tests changed
        id: check-tests
        env:
          BASE_REF: origin/${{ github.base_ref }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # 只保留仍存在的变更文件：删除/移出 sprints/ 的清理 PR（如测试大扫除）不应触发实跑，
          # 否则 npx vitest run <已删文件> 必红。存在性过滤让纯删除/改名 PR 干净跳过。
          ALL_TEST_FILES=$(git diff --name-only "${BASE_REF}...HEAD" | grep -E '^sprints/[^/]+/tests/.*\.test\.ts$' | while IFS= read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done || true)
          if [ -z "$ALL_TEST_FILES" ]; then
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "ℹ️  无 sprint 测试变更，后续步骤会跳过"
          else
            # 从分支名提取 workstream 序号（如 cp-05281036-ws-xxx-ws1 → 1）
            # 格式：cp-{date}-ws-{id}-ws{N} 或 cp-{date}-ws{N}
            WS_IDX=$(echo "${BRANCH_NAME:-}" | grep -oE '\-ws([0-9]+)$' | grep -oE '[0-9]+' || true)
            if [ -n "$WS_IDX" ]; then
              echo "🔍 分支 ${BRANCH_NAME} 检测到 workstream ws${WS_IDX}，只跑 ws${WS_IDX} 测试"
              TEST_FILES=$(echo "$ALL_TEST_FILES" | grep "/tests/ws${WS_IDX}/" || true)
              if [ -z "$TEST_FILES" ]; then
                echo "ℹ️  ws${WS_IDX} 无测试文件变更，回退到全量运行"
                TEST_FILES="$ALL_TEST_FILES"
              fi
            else
              echo "ℹ️  分支名未含 workstream 后缀，运行全量 sprint 测试"
              TEST_FILES="$ALL_TEST_FILES"
            fi
            echo "has_tests=true" >> $GITHUB_OUTPUT
            {
              echo "test_files<<TESTFILES"
              echo "$TEST_FILES"
              echo "TESTFILES"
            } >> $GITHUB_OUTPUT
          fi
      - name: Setup /workspace symlink
        if: steps.check-tests.outputs.has_tests == 'true'
        run: sudo ln -sf "$GITHUB_WORKSPACE" /workspace
      - name: Install dependencies (root workspaces)
        if: steps.check-tests.outputs.has_tests == 'true'
        run: npm ci
      - name: Bootstrap .env from .env.example
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          [ ! -f packages/brain/.env ] && cp packages/brain/.env.example packages/brain/.env || true
      - name: Run Brain migrations
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia
          DB_USER: cecelia
          DB_PASSWORD: cecelia
        run: cd packages/brain && node src/migrate.js
      - name: Create isolated sprint test database
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: cecelia
          PGPASSWORD: cecelia
        run: createdb cecelia_test
      - name: Start Brain server
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia
          DB_USER: cecelia
          DB_PASSWORD: cecelia
          BRAIN_PORT: 5221
          CECELIA_TICK_ENABLED: 'false'
        run: |
          cd packages/brain && node server.js &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5221/api/brain/tick/status >/dev/null 2>&1; then
              echo "✅ Brain healthy in ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Brain not healthy after 60s"
          exit 1
      - name: Seed smoke task for sprint tests
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          DB: postgresql://cecelia:cecelia@localhost:5432/cecelia
        run: |
          # claude-headed relay 精确判定优先（镜像 ci.yml dod-behavior-dynamic 的既有 seed 逻辑，
          # #3965 实证：该类 sprint 测试对固定 task_id 做 execSync 真实执行，
          # 若走下方通用随机 UUID 分支，TASK_ID 会被通用 smoke task 污染 env，
          # 导致脚本用错 task_id 查询 initiative_runs 而假红）。
          # sprint 测试若是 execSync 真实执行 e2e-verify.sh（非静态 readFileSync 内容检查），
          # claude-headed 标记不会出现在 *.test.ts 本体里，而在其同 sprint 目录的 e2e-verify.sh
          # 中——按测试文件路径反推 sprint 目录、检查同目录 e2e-verify.sh。
          TEST_FILES_RAW="${{ steps.check-tests.outputs.test_files }}"
          SPRINT_DIRS=$(echo "$TEST_FILES_RAW" | sed -E 's#^(sprints/[^/]+)/.*#\1#' | sort -u)
          CLAUDE_HEADED_DOD=false
          CLAUDE_HEADED_E2E=""
          for d in $SPRINT_DIRS; do
            E2E="$d/e2e-verify.sh"
            if [ -f "$E2E" ] && grep -q 'skill-relay-claude-headed' "$E2E"; then
              CLAUDE_HEADED_DOD=true
              CLAUDE_HEADED_E2E="$E2E"
              break
            fi
          done
          # 兼容静态 readFileSync 型测试（claude-headed 标记直接出现在 *.test.ts 本体）
          if [ "$CLAUDE_HEADED_DOD" != "true" ] && echo "$TEST_FILES_RAW" | xargs -I{} grep -lq 'skill-relay-claude-headed' {} 2>/dev/null; then
            CLAUDE_HEADED_DOD=true
          fi

          if [ "$CLAUDE_HEADED_DOD" = "true" ]; then
            if [ -n "$CLAUDE_HEADED_E2E" ]; then
              SMOKE_ID=$(grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' "$CLAUDE_HEADED_E2E" | head -1 || true)
            else
              SMOKE_ID=$(echo "$TEST_FILES_RAW" | xargs -I{} grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' {} 2>/dev/null | head -1 || true)
            fi
            if [[ "$SMOKE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              psql "$DB" -v ON_ERROR_STOP=1 -v smoke_id="$SMOKE_ID" <<'SQL'
          INSERT INTO tasks (
            id, title, status, priority, task_type, payload, trigger_source, domain, location, created_at, updated_at
          )
          VALUES (
            :'smoke_id'::uuid,
            'CI Sprint-Tests Claude Headed Relay Smoke Task',
            'completed',
            'P2',
            'harness_initiative',
            '{"mode":"headed","executor":"claude","orchestrator":"skill-relay","journey_id":"bb8cc561-b3ee-4fec-b74d-2255694bd963"}'::jsonb,
            'ci',
            'quality',
            'us',
            NOW(),
            NOW()
          )
          ON CONFLICT (id) DO UPDATE SET
            title = EXCLUDED.title,
            status = EXCLUDED.status,
            priority = EXCLUDED.priority,
            task_type = EXCLUDED.task_type,
            payload = EXCLUDED.payload,
            trigger_source = EXCLUDED.trigger_source,
            domain = EXCLUDED.domain,
            location = EXCLUDED.location,
            updated_at = NOW();

          DELETE FROM initiative_runs
           WHERE initiative_id = :'smoke_id'::uuid
             AND orchestrator_host = 'skill-relay-claude-headed';

          INSERT INTO initiative_runs (
            initiative_id, phase, journey_id, orchestrator_version, orchestrator_host, deadline_at, started_at, updated_at
          )
          VALUES (
            :'smoke_id'::uuid,
            'A_planning',
            'bb8cc561-b3ee-4fec-b74d-2255694bd963'::uuid,
            'v2',
            'skill-relay-claude-headed',
            NOW() + INTERVAL '8 hours',
            NOW(),
            NOW()
          );
          SQL
              echo "TASK_ID=$SMOKE_ID" >> "$GITHUB_ENV"
              echo "✅ Seeded claude-headed relay smoke task/run (精确匹配 sprint 测试内嵌 task_id): $SMOKE_ID"
            else
              echo "::warning::检测到 claude-headed pattern 但未能从测试文件提取 task_id UUID，回退通用分支"
              CLAUDE_HEADED_DOD=false
            fi
          fi

          if [ "$CLAUDE_HEADED_DOD" != "true" ]; then
            TASK_RESP=$(curl -sf -X POST http://localhost:5221/api/brain/tasks \
              -H "Content-Type: application/json" \
              -d '{"title":"CI Smoke Task","task_type":"harness_generate"}' 2>/dev/null || echo '{}')
            SMOKE_ID=$(echo "$TASK_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const p=JSON.parse(d);p.id&&process.stdout.write(p.id)}catch(e){}})" 2>/dev/null || true)
            if [ -n "$SMOKE_ID" ]; then
              curl -sf -X PATCH "http://localhost:5221/api/brain/tasks/$SMOKE_ID" \
                -H "Content-Type: application/json" \
                -d '{"status":"in_progress"}' > /dev/null || true
              curl -sf -X PATCH "http://localhost:5221/api/brain/tasks/$SMOKE_ID" \
                -H "Content-Type: application/json" \
                -d '{"status":"completed"}' > /dev/null || true
              echo "TASK_ID=$SMOKE_ID" >> "$GITHUB_ENV"
              echo "✅ Seeded smoke task: $SMOKE_ID (status=completed)"
            else
              echo "::warning::Could not create smoke task — Brain tasks test will use default ID"
            fi
          fi
      - name: Run sprint tests
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          DB: postgresql://cecelia:cecelia@localhost:5432/cecelia
          TEST_DATABASE_URL: postgresql://cecelia:cecelia@localhost:5432/cecelia_test
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia_test
          DB_USER: cecelia
          DB_PASSWORD: cecelia
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Capture test file list (GHA template expansion produces multiline string)
          TEST_FILES_RAW="${{ steps.check-tests.outputs.test_files }}"
          echo "📋 跑这些测试文件："
          echo "$TEST_FILES_RAW" | sed 's/^/  /'
          echo ""
          # Use readarray to handle multiline test file paths as array
          readarray -t TEST_FILE_ARR <<< "$TEST_FILES_RAW"
          npx vitest run "${TEST_FILE_ARR[@]}" --reporter=verbose || {
            echo "❌ 测试未通过（Green 阶段失败）"
            exit 1
          }

  # ─── Check 5: Skeleton 形状校验 ─────────────────────────────────────
  skeleton-shape-check:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    name: Skeleton 测试形状校验 (v1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run skeleton-shape-check
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node packages/engine/scripts/devgate/skeleton-shape-check.cjs

  # ─── Check 6: 测试文件不可变（commit1 后禁止修改）─────────────────────
  lint-contract-test-immutability:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    name: 测试文件不可变校验 (v1.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed sprint dirs and check immutability
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # 对于非 PR 事件，使用 HEAD~1 作为 base
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            BASE="HEAD~1"
            HEAD="HEAD"
          fi

          # 检测 PR diff 中是否含 sprints/* 变更
          SPRINT_FILES=$(git diff --name-only "${BASE}...${HEAD}" 2>/dev/null | grep -vE '^sprints/archive/' | grep -E '^sprints/' || true)

          if [ -z "$SPRINT_FILES" ]; then
            echo "No sprints/* changes, skipping lint-contract-test-immutability"
            exit 0
          fi

          # 提取唯一的 sprint 目录名
          SPRINT_DIRS=$(echo "$SPRINT_FILES" | sed -E 's|^sprints/([^/]+)/.*|\1|' | sort -u)

          echo "检测到 sprint 目录变更："
          echo "$SPRINT_DIRS"
          echo ""

          OVERALL_EXIT=0
          while IFS= read -r SPRINT; do
            echo "=== 检查 sprint: $SPRINT ==="
            bash scripts/lint-contract-test-immutability.sh "$GITHUB_WORKSPACE" "$SPRINT" || OVERALL_EXIT=1
          done <<< "$SPRINT_DIRS"

          exit $OVERALL_EXIT

  # ─── Gate job（required context，与 ci-passed 同款聚合）────────────────────
  harness-v5-gate:
    name: Harness V5 Gate Passed
    needs: [changes, dod-structure-purity, test-coverage-for-behavior, tdd-commit-order, tests-actually-pass, skeleton-shape-check, lint-contract-test-immutability]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harness V5 Gate
        run: |
          echo "changes=${{ needs.changes.result }} dod=${{ needs.dod-structure-purity.result }} cov=${{ needs.test-coverage-for-behavior.result }} tdd=${{ needs.tdd-commit-order.result }} tests=${{ needs.tests-actually-pass.result }} shape=${{ needs.skeleton-shape-check.result }} immut=${{ needs.lint-contract-test-immutability.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "FAIL: changes 检测未成功"; exit 1
          fi
          for r in "${{ needs.dod-structure-purity.result }}" "${{ needs.test-coverage-for-behavior.result }}" "${{ needs.tdd-commit-order.result }}" "${{ needs.tests-actually-pass.result }}" "${{ needs.skeleton-shape-check.result }}" "${{ needs.lint-contract-test-immutability.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "FAIL: 有 check 结果为 $r"; exit 1 ;;
            esac
          done
          echo "Harness V5 Gate Passed"
