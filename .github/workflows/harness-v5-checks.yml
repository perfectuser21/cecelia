name: Harness v5 Checks

# v5 Sprint C：合同纪律的 CI 硬校验
# 观察期已过，全部切硬门禁（PR cp-0427095721 移除 continue-on-error）
#
# 触发范围：只在 harness 相关改动时跑
#   - sprints/*/contract-*.md / contract-dod-ws*.md / tests/ws*/*.test.ts

on:
  pull_request:
    paths:
      - 'sprints/**/contract-draft.md'
      - 'sprints/**/sprint-contract.md'
      - 'sprints/**/contract-dod-ws*.md'
      - 'sprints/**/tests/**/*.test.ts'
      - 'sprints/**/contract-dod-ws0.md'
      # 排除归档：老 sprint 纯历史痕迹，格式可能不符 v5 规则，不应触发检查
      - '!sprints/archive/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─── Check 1: DoD 纯度（contract-dod-ws 禁 [BEHAVIOR]） ────────────
  dod-structure-purity:
    name: DoD 纯度检查 (v5.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run check-dod-purity
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node packages/engine/scripts/devgate/check-dod-purity.cjs

  # ─── Check 2: Test Contract 覆盖（测试文件必须存在） ─────────────────
  test-coverage-for-behavior:
    name: Test Contract 覆盖检查 (v5.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run check-test-coverage
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node packages/engine/scripts/devgate/check-test-coverage.cjs

  # ─── Check 3: TDD Red-Green commit 顺序 ───────────────────────────
  tdd-commit-order:
    name: TDD Commit 顺序检查 (v5.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run check-tdd-commit-order
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
        run: bash packages/engine/scripts/devgate/check-tdd-commit-order.sh

  # ─── Check 4: 测试实际通过（Red → Green 验证） ─────────────────────
  tests-actually-pass:
    name: Sprint Tests 实跑 (v5.0)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: cecelia
          POSTGRES_DB: cecelia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check if sprint tests changed
        id: check-tests
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          TEST_FILES=$(git diff --name-only "${BASE_REF}...HEAD" | grep -E '^sprints/[^/]+/tests/.*\.test\.ts$' || true)
          if [ -z "$TEST_FILES" ]; then
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "ℹ️  无 sprint 测试变更，后续步骤会跳过"
          else
            echo "has_tests=true" >> $GITHUB_OUTPUT
            {
              echo "test_files<<TESTFILES"
              echo "$TEST_FILES"
              echo "TESTFILES"
            } >> $GITHUB_OUTPUT
          fi
      - name: Install dependencies (root workspaces)
        if: steps.check-tests.outputs.has_tests == 'true'
        run: npm ci
      - name: Bootstrap .env from .env.example
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          [ ! -f packages/brain/.env ] && cp packages/brain/.env.example packages/brain/.env || true
      - name: Run Brain migrations
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia
          DB_USER: cecelia
          DB_PASSWORD: cecelia
        run: cd packages/brain && node src/migrate.js
      - name: Start Brain server
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: cecelia
          DB_USER: cecelia
          DB_PASSWORD: cecelia
          BRAIN_PORT: 5221
          NODE_ENV: development
          CECELIA_TICK_ENABLED: 'false'
        run: |
          cd packages/brain && node server.js &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5221/api/brain/tick/status >/dev/null 2>&1; then
              echo "✅ Brain healthy in ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Brain not healthy after 60s"
          exit 1
      - name: Seed smoke task for sprint tests
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          TASK_RESP=$(curl -sf -X POST http://localhost:5221/api/brain/tasks \
            -H "Content-Type: application/json" \
            -d '{"title":"CI Smoke Task","task_type":"harness_generate"}' 2>/dev/null || echo '{}')
          SMOKE_ID=$(echo "$TASK_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const p=JSON.parse(d);p.id&&process.stdout.write(p.id)}catch(e){}})" 2>/dev/null || true)
          if [ -n "$SMOKE_ID" ]; then
            curl -sf -X PATCH "http://localhost:5221/api/brain/tasks/$SMOKE_ID" \
              -H "Content-Type: application/json" \
              -d '{"status":"in_progress"}' > /dev/null || true
            curl -sf -X PATCH "http://localhost:5221/api/brain/tasks/$SMOKE_ID" \
              -H "Content-Type: application/json" \
              -d '{"status":"completed"}' > /dev/null || true
            echo "TASK_ID=$SMOKE_ID" >> "$GITHUB_ENV"
            echo "✅ Seeded smoke task: $SMOKE_ID (status=completed)"
          else
            echo "::warning::Could not create smoke task — Brain tasks test will use default ID"
          fi
      - name: Run sprint tests
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          DB: postgresql://cecelia:cecelia@localhost:5432/cecelia
        run: |
          set -euo pipefail
          # Capture test file list (GHA template expansion produces multiline string)
          TEST_FILES_RAW="${{ steps.check-tests.outputs.test_files }}"
          echo "📋 跑这些测试文件："
          echo "$TEST_FILES_RAW" | sed 's/^/  /'
          echo ""
          # Use readarray to handle multiline test file paths as array
          readarray -t TEST_FILE_ARR <<< "$TEST_FILES_RAW"
          npx vitest run "${TEST_FILE_ARR[@]}" --reporter=verbose || {
            echo "❌ 测试未通过（Green 阶段失败）"
            exit 1
          }

  # ─── Check 5: Skeleton 形状校验 ─────────────────────────────────────
  skeleton-shape-check:
    name: Skeleton 测试形状校验 (v1.0)
    runs-on: ubuntu-latest
    continue-on-error: true  # 观察期软门禁 — 确认无误报后去掉此行切硬门禁
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run skeleton-shape-check
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node packages/engine/scripts/devgate/skeleton-shape-check.cjs
