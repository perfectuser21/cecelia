name: Harness E2E (Android Real Device)

# Generic harness E2E entry point for android_realdevice target_environment.
# Triggered by evaluator SKILL when target_environment=android_realdevice on ZenithJoy sprints.
# Runs e2e-verify-android.sh from the sprint directory on the ROG Windows self-hosted runner,
# reaching the Honor test phone via USB (preferred, most stable) or ADB-over-TCP (Tailscale).
#
# 2026-07-05: 迁移 ubuntu-latest+tailscale → ROG Windows self-hosted runner。ROG 常年开、
# 微信已登录(windows_wechat 同机)，手机 USB 直插即可，一台机器伺候 Windows+Android 两条线。
# USB 直连比"云 runner 每次临时入网穿 Tailscale"更稳、无 authkey 外泄、无登录态暴露到云。
#
# ROG runner 前置(一次性，人工在 ROG 上做)：
#   1. 注册 GitHub self-hosted runner，打标签 [self-hosted, windows, android]
#   2. 装 Git for Windows —— 提供 git-bash，让下方 shell: bash 步骤在 Windows 上跑
#   3. 装 Android platform-tools(adb) 加入 PATH；装荣耀 OEM USB 驱动
#   4. 手机 USB 直插 ROG(DEVICE_SERIAL=USB serial，adb connect 被 || true 跳过)；
#      或走 TCP 时 DEVICE_SERIAL="100.x.x.x:5555"(ROG 已在 tailnet，无需 per-job tailscale)
#
# Script template: packages/engine/runners/android/e2e-verify-android-template.sh
#
# Secrets required:
#   HONOR_DEVICE_ADB_TARGET   — USB serial(直插) 或 "100.x.x.x:5555"(Tailscale TCP)
#   BRAIN_CALLBACK_TOKEN      — token for Brain task result callback

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Brain harness task ID (evaluate task UUID)'
        required: true
        type: string
      sprint_dir:
        description: 'Sprint directory path (e.g. sprints/run-20260704-1000)'
        required: true
        type: string
      pr_branch:
        description: 'PR branch to checkout before running E2E (empty = main)'
        required: false
        default: ''
        type: string
      apk_run_id:
        description: 'GitHub Actions run ID that produced the APK artifact (empty = use sprint_dir/apk/)'
        required: false
        default: ''
        type: string
      device_serial:
        description: 'ADB device serial override (empty = use HONOR_DEVICE_ADB_TARGET secret)'
        required: false
        default: ''
        type: string

jobs:
  android-e2e:
    name: Android Real Device E2E
    runs-on: [self-hosted, windows, android]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash   # ROG 上由 Git for Windows 提供 git-bash，跑下方 bash + adb 步骤
    env:
      TASK_ID: ${{ inputs.task_id }}
      SPRINT_DIR: ${{ inputs.sprint_dir }}
      DEVICE_SERIAL: ${{ inputs.device_serial || secrets.HONOR_DEVICE_ADB_TARGET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_branch || 'main' }}
          fetch-depth: 1

      - name: Verify adb is available (ROG 一次性前置装好 platform-tools)
        run: |
          set -euo pipefail
          if ! command -v adb >/dev/null 2>&1; then
            echo "❌ adb 不在 PATH。请在 ROG 上装 Android platform-tools 并加入 PATH（一次性前置）。"
            exit 1
          fi
          adb version

      - name: Verify ADB device connectivity
        run: |
          set -euo pipefail
          echo "Connecting to device: $DEVICE_SERIAL"
          adb connect "$DEVICE_SERIAL" || true
          # Wait up to 20s for device to appear
          for i in $(seq 1 10); do
            if adb -s "$DEVICE_SERIAL" get-state 2>/dev/null | grep -q "device"; then
              echo "✅ Device online: $DEVICE_SERIAL"
              break
            fi
            echo "Waiting for device... ($i/10)"
            sleep 2
          done
          adb -s "$DEVICE_SERIAL" get-state | grep -q "device" || \
            { echo "❌ Device not reachable: $DEVICE_SERIAL"; exit 1; }
          adb -s "$DEVICE_SERIAL" shell getprop ro.product.model

      - name: Download APK artifact (from previous run)
        if: ${{ inputs.apk_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: collector-apk
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ inputs.sprint_dir }}/apk/

      - name: Run E2E verification script
        run: |
          set -euo pipefail
          SCRIPT="${{ inputs.sprint_dir }}/e2e-verify-android.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "❌ E2E script not found: $SCRIPT"
            exit 1
          fi
          chmod +x "$SCRIPT"
          echo "▶ Running $SCRIPT for task=$TASK_ID device=$DEVICE_SERIAL"
          bash "$SCRIPT"

      - name: Collect ADB logcat
        if: always()
        run: |
          mkdir -p screenshots
          adb -s "$DEVICE_SERIAL" logcat -d -t 500 > screenshots/logcat.txt 2>/dev/null || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-${{ inputs.task_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
