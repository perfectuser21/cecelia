name: Preview Cleanup

# ⚠️ 预览环境在执行机（MMV:5241）起，不在 us-vps，也不走 MMV:5221：
#    · 起预览 = 起 Brain 实例 + 克隆数据库 = 执行活，违反 us-vps 零执行铁律（决策 96054a8b）
#    · MMV:5221 是 socat，会把流量整个转发到 us-vps —— 必须错开端口才能留在本机
#    · preview-env-start.sh 硬编码 Mac 路径、磁盘门槛 38.5G 按 Mac 盘设计，
#      us-vps 根分区仅 24G，数学上不可能通过
#    对端 = scripts/preview-agent.mjs（launchd 常驻，复用 routes/preview.js）

# PR merge or close: 清理对应的完整预览环境
# 调预览代理 /preview/stop/:pr，同步等待统一销毁器的终态回执。
# 仅 HTTP 2xx + 明确业务成功才确认清理；无记录响应作为合法幂等结果。
#
# 修复 2026-07-15：curl 失败旧版吞错仍 exit 0 → 评论谎报"已清理"导致孤儿堆积。
# HTTP、JSON 或业务终态失败均令 step 红；评论只报告未确认，不推断实际残留。

on:
  pull_request:
    types: [closed]

jobs:
  preview_cleanup:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 执行原预览步骤
        uses: ./.github/actions/preview-cleanup
        with:
          ts-authkey: ${{ secrets.TS_AUTHKEY }}
          deploy-token: ${{ secrets.DEPLOY_TOKEN }}
          brain-url: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.71.151.105:5241' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
