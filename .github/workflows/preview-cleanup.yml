name: Preview Cleanup

# PR merge 或 close → 清理对应的预览环境（停止进程 + 释放端口）

on:
  pull_request:
    types: [closed]

jobs:
  preview_cleanup:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 与 preview-deploy 同款兜底（2026-07-06）：HK_VPS secrets 未配置时 deploy 本来就没
      # 部署任何东西（跳过 SSH），cleanup 再去 SSH 必失败——21 连红即此因。secrets 配齐前
      # 干净跳过；预览体系真启用/删除待拍板（Brain issue 39452ad0）。
      - name: 检查 SSH secrets 是否配置
        id: check_secrets
        run: |
          if [ -n "$SECRET_HOST" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ HK_VPS_HOST secret 未配置，跳过清理（与 preview-deploy 的跳过行为对齐）"
          fi
        env:
          SECRET_HOST: ${{ secrets.HK_VPS_HOST }}

      - name: 计算预览端口
        if: steps.check_secrets.outputs.configured == 'true'
        id: port
        run: |
          PORT=$(bash scripts/preview-deploy.sh --print-port "${{ github.head_ref }}")
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "清理端口: $PORT (branch: ${{ github.head_ref }})"

      - name: SSH 清理 hk-vps 预览进程
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT || 22 }}
          command_timeout: 60s
          script: |
            bash ~/scripts/preview-cleanup.sh ${{ steps.port.outputs.port }} "${{ github.head_ref }}"

      - name: PR 评论写入清理结果
        if: always() && steps.check_secrets.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = '${{ github.head_ref }}';
            const port = '${{ steps.port.outputs.port }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🧹 预览环境已清理\n\n**Branch**: \`${branch}\`\n**Port**: ${port} 已释放`,
            });
