name: Staging Health Diagnostics

# 手动检查当前 staging（5222）的 HTTP 健康、tick 隔离及任务端点。
# 不创建候选，不证明某次发布的 SHA/镜像/数据库身份；发布回执由独立 staging 验证提供。

# 历史/环境诊断按需运行；通用源码保障归 ci.yml，深度回归归 nightly-regression.yml。
on:
  workflow_dispatch: {}

concurrency:
  group: nightly-real-machine
  cancel-in-progress: false

jobs:
  nightly-smoke:
    name: Diagnose current staging health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout（取 smoke 脚本）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Staging Smoke（真实机器 5222）
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
        run: |
          set -uo pipefail
          HOST=$(echo "$BRAIN_URL" | sed -E 's#^https?://##; s#:[0-9]+$##')
          echo "对真实 staging ${HOST}:5222 跑按需健康诊断..."
          STAGING_HOST="$HOST" STAGING_PORT="${STAGING_PORT:-5222}" bash scripts/auto-staging-smoke.sh

      - name: Staging 不可用时的诊断信息
        if: failure()
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
        run: |
          HOST=$(echo "$BRAIN_URL" | sed -E 's#^https?://##; s#:[0-9]+$##')
          echo "::error::staging 健康诊断失败 — staging ${HOST}:5222 不健康"
          echo "排查步骤："
          echo "  1. 检查 staging 容器：docker logs cecelia-node-brain-staging --tail 50"
          echo "  2. 检查机器磁盘/内存：df -h && free -h"
          echo "  4. 结合本工作流失败记录和 Staging 部署日志排查"
          curl -sf "http://${HOST}:5222/api/brain/health" 2>/dev/null \
            && echo "staging /health 实际可达（smoke 脚本逻辑问题）" \
            || echo "staging /health 不可达"
