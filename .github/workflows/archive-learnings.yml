name: Archive Old Learnings

# 每月 1 号自动把 30 天前的 docs/learnings/*.md 归档成 tar.gz，
# 按 YYYY-MM 分桶（以 git log 首次入库时间为准，不用文件 mtime）。
# 可手动触发（workflow_dispatch）跑一次性大清理。
# 归档只创建普通 PR，合并资格由当前源码检查和仓库保护决定。

on:
  schedule:
    - cron: '0 4 1 * *'   # 每月 1 号 04:00 UTC
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # 需要全 git log 拿每个文件首次入库时间

      - name: Archive learnings older than 30 days
        id: archive
        run: python3 scripts/ci/archive-learnings.py

      # 走普通 PR 流程；当前 ci.yml 没有 auto-merge job。
      - name: 开归档 PR（遵循当前源码检查与仓库保护）
        if: steps.archive.outputs.changed == 'true'
        env:
          # 必须 PAT：GITHUB_TOKEN 的 gh pr create 报 "Resource not accessible by
          # integration"（0701 月度 run 实锤），且 GITHUB_TOKEN 建的 PR 不触发 CI →
          # required checks 永远 pending。孤儿分支 cp-archive-20260701-0534-learnings 即此因。
          GH_TOKEN: ${{ secrets.GH_PAT_BOT }}
          TOTAL: ${{ steps.archive.outputs.total_archived }}
          BUCKETS: ${{ steps.archive.outputs.buckets }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT_BOT secret 未配置（开归档 PR 必需 PAT）"
            exit 1
          fi
          # 分支名必须匹配 branch-naming lint 的 ^cp-[0-9]{8,10}-（0706 首次真跑到此路径才暴露：
          # 旧格式 cp-archive-YYYYMMDD-HHMM 被 ci-passed 里的 branch-naming 拒 → PR 永远合不进）
          BRANCH="cp-$(TZ=Asia/Shanghai date +%m%d%H%M)-archive-learnings"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/learnings/archive/
          git commit -m "chore(learnings): 月度归档（${TOTAL} 文件 / ${BUCKETS} 月桶）[bot]"
          git push origin "$BRANCH"

          BODY=$(printf "自动触发：archive-learnings workflow。归档 ${TOTAL} 个 30 天前的 learning 到 ${BUCKETS} 个 YYYY-MM.tar.gz。\n\n合并前须通过当前源码检查及仓库保护；本工作流仅创建归档 PR。")
          PR_URL=$(gh pr create \
            --title "chore(learnings): 月度归档 ${TOTAL} 文件" \
            --body "$BODY" \
            --head "$BRANCH" \
            --base main)
          echo "✅ PR 已开: $PR_URL"
