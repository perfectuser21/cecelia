name: preview-deploy
description: 保留原预览工作流的部署或清理步骤
inputs:
  ts-authkey:
    description: 既有 Tailscale 登录密钥
    required: false
  deploy-token:
    description: 既有预览代理令牌
    required: false
  brain-url:
    description: 执行机预览代理地址
    required: false
    default: http://100.71.151.105:5241
  github-token:
    description: 仅供 PR 评论的令牌
    required: false
runs:
  using: composite
  steps:
    - name: 检查 Tailscale secret 是否配置
      id: check_ts
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "$SECRET_TS" ] || [ -z "$DEPLOY_TOKEN" ]; then
          echo "::error::TS_AUTHKEY 或 DEPLOY_TOKEN 未配置，预览未部署"
          exit 1
        fi
        echo "configured=true" >> "$GITHUB_OUTPUT"
      env:
        SECRET_TS: ${{ inputs.ts-authkey }}
        DEPLOY_TOKEN: ${{ inputs.deploy-token }}

    - name: Connect to Tailscale
      if: steps.check_ts.outputs.configured == 'true'
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ inputs.ts-authkey }}

    - name: 触发 preview-env-start（Brain API）
      id: start_preview
      if: steps.check_ts.outputs.configured == 'true'
      env:
        BRAIN_URL: ${{ inputs.brain-url }}
        DEPLOY_TOKEN: ${{ inputs.deploy-token }}
        PR_NUMBER: ${{ github.event.number }}
        BRANCH_NAME: ${{ github.head_ref }}
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      shell: bash
      run: |
        set -euo pipefail
        echo "调用 Brain API /preview/start..."
        BRAIN_UPTIME=$(curl -sf --connect-timeout 5 --max-time 10 \
          "${BRAIN_URL}/api/brain/health" 2>/dev/null \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('uptime_seconds',''))" \
          2>/dev/null || echo "")
        RESP=$(bash scripts/request-preview-start.sh)
        echo "Brain 响应: $RESP"
        PORT=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['port'])" 2>/dev/null)
        if [ -z "$PORT" ]; then
          echo "无法获取预览端口，Brain 响应: $RESP"
          exit 1
        fi
        echo "port=$PORT" >> "$GITHUB_OUTPUT"
        echo "brain_uptime=$BRAIN_UPTIME" >> "$GITHUB_OUTPUT"
        echo "预览端口已分配: $PORT"

    - name: 轮询 preview 状态直到 active（max 600s）
      id: wait_active
      if: steps.check_ts.outputs.configured == 'true'
      env:
        BRAIN_URL: ${{ inputs.brain-url }}
        DEPLOY_TOKEN: ${{ inputs.deploy-token }}
        PR_NUMBER: ${{ github.event.number }}
        BRANCH_NAME: ${{ github.head_ref }}
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        EXPECTED_PORT: ${{ steps.start_preview.outputs.port }}
        PREVIEW_INITIAL_BRAIN_UPTIME: ${{ steps.start_preview.outputs.brain_uptime }}
        # 冷启动（lock 变动导致 node_modules 无法复用时）光 npm ci 就要十几分钟，
        # 默认 600s 不够，实测会停在 status=starting 超时。给到 20 分钟。
        PREVIEW_WAIT_MAX_SECONDS: '1200'
      shell: bash
      run: |
        bash scripts/wait-preview-active.sh

    - name: 从 BRAIN_URL 解析主机地址
      id: get_host
      if: steps.check_ts.outputs.configured == 'true'
      env:
        BRAIN_URL: ${{ inputs.brain-url }}
      shell: bash
      run: |
        HOST=$(echo "$BRAIN_URL" | sed -E 's#^https?://##; s#:[0-9]+$##')
        echo "host=$HOST" >> "$GITHUB_OUTPUT"

    - name: 健康检查预览 Brain
      id: healthcheck
      if: steps.check_ts.outputs.configured == 'true'
      env:
        PREVIEW_HOST: ${{ steps.get_host.outputs.host }}
        EXPECTED_PORT: ${{ steps.start_preview.outputs.port }}
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        EXPECTED_DB_NAME: cecelia_preview_${{ github.event.number }}
        PR_NUMBER: ${{ github.event.number }}
      shell: bash
      run: |
        bash scripts/verify-preview-identity.sh

    - name: PR 评论写入预览 URL（成功）
      if: steps.check_ts.outputs.configured == 'true' && success()
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const previewUrl = '${{ steps.healthcheck.outputs.preview_url }}';
          const branch = context.payload.pull_request.head.ref;
          const port = '${{ steps.start_preview.outputs.port }}';
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: [
              '## 🚀 完整预览环境已就绪',
              '',
              `**Branch**: \`${branch}\``,
              `**Preview URL**: ${previewUrl}`,
              `**Port**: ${port}`,
              '',
              '**包含**: 预览 Brain（PR 后端代码）+ 隔离数据库快照 + 前端 UI',
              '',
              '> 此预览环境在 PR 关闭时自动销毁。数据隔离：写入不会污染生产库。',
            ].join('\n'),
          });

    - name: PR 评论写入失败原因
      if: failure() && steps.check_ts.outputs.configured == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const branch = context.payload.pull_request.head.ref;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `## ❌ 预览环境部署失败\n\n**Branch**: \`${branch}\`\n\n请检查 [GitHub Actions 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 获取详细失败原因。`,
          });
