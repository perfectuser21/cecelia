name: Restore pinned skills
description: Restore and verify the business repository's locked skill documents
inputs:
  ssh-key:
    description: Read-only deploy key for zenithjoy-skills
    required: true
  expected-public-sha256:
    description: SHA256 of the registered SSH public key algorithm and body
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SKILLS_SOURCE_SSH_KEY: ${{ inputs.ssh-key }}
        SKILLS_SOURCE_PUBLIC_KEY_SHA256: ${{ inputs.expected-public-sha256 }}
        GIT_TERMINAL_PROMPT: "0"
      run: |
        python_bin=python3
        command -v python3 >/dev/null 2>&1 || python_bin=python
        "$python_bin" scripts/ci/check-skill-source-identity.py
        bash scripts/ensure-skills-source.sh "$GITHUB_WORKSPACE"
        "$python_bin" scripts/skill_source_ownership.py
