  - id: W1-004
    feature: W1
    name: "p0 阶段完整流程"
    scope: workflow
    priority: P0
    trigger: [PR, Release]
    method: manual
    tags: [dev, p0, v2.0.0, two-phase]
    owner: workflow
    steps:
      given: "进入 p0 阶段（本地开发）"
      when: "执行 PRD → DoD → Code → Audit (PASS) → Test (L1) → PR（Step 8 不调用 Step 9）"
      then: "创建 PR 后结束，不等待 CI（Stop Hook 检查 phase=p0，直接 exit 0）"
    evidence:
