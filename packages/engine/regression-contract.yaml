# ============================================================================
# Regression Contract - ZenithJoy Engine
# ============================================================================
# Schema: regression-contract-v1.yaml (internal)
#
# 全量回归的唯一合法定义来源
#
# Trigger 规则：
#   - PR Gate:      跑 trigger 包含 PR 的条目
#   - Release Gate: 跑 trigger 包含 Release 的条目
#   - Nightly:      (已废弃) Nightly workflow 已被移除，此 trigger 暂不可用
#
# Method 规则：
#   - auto:   必须有 test 字段指向自动化测试
#   - manual: 无 test 字段，需人工验证
#
# ============================================================================
#
# 编号说明：
# 历史条目使用旧编号体系（Step 7-11），对应关系：
#   Step 7-8 (PR+Push) → Stage 3: Integrate
#   Step 9 (CI)        → Stage 3: Integrate
#   Step 10 (Learning) → Stage 4: Ship
#   Step 11 (Cleanup)  → Stage 4: Ship
#   Step 6.5 (Simplify) → 已删除，融入 code_review_gate
# 新条目统一使用 4-Stage 编号：Spec/Code/Integrate/Ship
# ============================================================================

# NOTE: version 需要与 package.json 保持同步
# 更新 package.json 时同步更新此处
version: 19.7.6
updated: 2026-06-02

# ============================================================================
# Hooks 回归契约
# ============================================================================
hooks:
  # --------------------------------------------------------------------------
  # H1: branch-protect
  # --------------------------------------------------------------------------
  - id: H1-001
    feature: H1
    name: "分支保护拦截 main/develop 写入"
    scope: hook
    priority: P0
    trigger: [PR, Release]
    method: auto
    tags: [branch, write-protect, security]
    owner: infra
    steps:
      given: "当前在 main 或 develop 分支"
      when: "尝试写入代码文件（Write/Edit 工具）"
      then: "Hook 阻止并提示切换到 cp-* 或 feature/* 分支"
    evidence:
      type: log
      contains: "请先创建工作分支"
    test: "tests/hooks/branch-protect.test.ts"

  - id: H1-002
    feature: H1
    name: "cp-* 分支允许写入"
    scope: hook
    priority: P0
    trigger: [PR, Release]
    method: auto
    tags: [branch, write-protect]
    owner: infra
    steps:
      given: "当前在 cp-* 分支"
      when: "尝试写入代码文件"
      then: "Hook 放行（exit 0）"
    evidence:
      type: exit_code
      equals: 0
    test: "tests/hooks/branch-protect.test.ts"

  - id: H1-003
    feature: H1
    name: "feature/* 分支允许写入"
    scope: hook
    priority: P1
    trigger: [Release]
    method: auto
    tags: [branch, write-protect]
    owner: infra
    steps:
      given: "当前在 feature/* 分支"
      when: "尝试写入代码文件"
      then: "Hook 放行（exit 0）"
    evidence:
      type: exit_code
      equals: 0
    test: "tests/hooks/branch-protect.test.ts"

  - id: H1-004
    feature: H1
    name: "主仓库禁止 checkout/switch 到任务分支"
    scope: hook
    priority: P1
    trigger: [PR, Release]
    method: auto
    tags: [branch, worktree, isolation]
    owner: infra
    steps:
      given: "在主仓库目录（git-dir 不含 worktrees）"
      when: "执行 git checkout/switch 切到 cp-*/feature 分支"
      then: "worktree-checkout-guard 阻止（exit 2）并提示在独立 worktree 开发"
    evidence:
      type: exit_code
      equals: 2
    test: "tests/integration/worktree-checkout-guard.test.sh"

  # --------------------------------------------------------------------------
  # H1-010~H1-012: v8.24.0 安全修复 (branch-protect.sh)
  # --------------------------------------------------------------------------
  - id: H1-010
    feature: H1
    name: "JSON 预验证防止注入 (branch-protect)"
    scope: hook
    priority: P0
    trigger: [PR, Release]
    method: auto
    tags: [security, json, injection, v8.24.0]
    owner: infra
    steps:
      given: "Hook 接收包含特殊字符的输入"
      when: "解析 JSON 输入前"
      then: "使用 jq 预验证 JSON 格式，无效 JSON 直接报错退出"
    evidence:
      type: code
      file: "hooks/branch-protect.sh"
      contains: "jq -e . >/dev/null 2>&1"
    test: "tests/hooks/branch-protect.test.ts"

  - id: H1-011
    feature: H1
    name: "路径遍历检查 (branch-protect)"
    scope: hook
    priority: P0
    trigger: [PR, Release]
    method: auto
    tags: [security, path-traversal, v8.24.0]
    owner: infra
    steps:
      given: "Hook 接收文件路径参数"
      when: "处理路径前"
      then: "拒绝包含 .. 的路径，防止目录遍历攻击"
    evidence:
      type: code
      file: "hooks/branch-protect.sh"
      contains: "reject_path_traversal"
    test: "tests/hooks/branch-protect.test.ts"

  - id: H1-012
    feature: H1
    name: "活跃 Worktree 必须有 .dev-mode（v23）"
    scope: hook
    priority: P0
    trigger: [PR, Release]
    method: auto
    tags: [security, dev-mode, worktree, session-guard, v23]
    owner: infra
    steps:
      given: "在活跃 worktree（非僵尸）中，没有 .dev-mode 文件"
      when: "尝试写入代码文件"
      then: "阻止写入，输出 [SKILL_REQUIRED: dev]，提示运行 /dev"
    evidence:
      type: code
      file: "hooks/branch-protect.sh"
      contains: "没有活跃的 /dev 会话"
    test: "manual:bash -n packages/engine/hooks/branch-protect.sh"

  - id: H7-006
    feature: H7
    name: "Stop Hook session_id 验证（同分支多会话隔离）"
    scope: hook
    priority: P0
    trigger: [PR, Release]
    method: auto
    tags: [stop, session, isolation, concurrency]
    owner: infra
    steps:
      given: ".dev-mode 有 session_id 且当前会话有 CLAUDE_SESSION_ID，两者不匹配"
      when: "Stop Hook 执行 session_id 验证"
      then: "exit 0 忽略该 .dev-mode（不属于当前会话）"
    evidence:
      type: code
      file: "hooks/stop.sh"
      contains: "SESSION_ID_IN_FILE"

  - id: H7-007
    feature: H7
    name: "共享锁工具库原子操作（.dev-mode 并发安全）"
    scope: lib
    priority: P0
    trigger: [PR, Release]
    method: auto
    tags: [lock, atomic, concurrency]
    owner: infra
    steps:
      given: "多个进程同时操作 .dev-mode 文件"
      when: "使用 lib/lock-utils.sh 的原子操作函数"
      then: "mktemp + mv 保证写入原子性，flock 保证互斥"
    evidence:
      type: code
      file: "lib/lock-utils.sh"
      contains: "atomic_write_dev_mode"

  - id: H7-009
    feature: H7
    name: "SubagentStop Hook - 子 agent 循环控制"
    scope: hook
    priority: P0
    trigger: [PR, Release]
    method: manual
    tags: [stop, subagent, loop, explore, plan]
    owner: infra
    steps:
      given: "Subagent (Explore/Plan) 正在执行任务"
      when: "SubagentStop Hook 检测到任务未完成"
      then: "返回 JSON API 格式阻止并继续循环，超过 5 次上限则退出"
    evidence:
      type: code
      file: "hooks/subagent-stop.sh"
      contains: "decision.*block"

  - id: H7-016
    feature: H7
    name: "Cleanup .dev-mode 支持 per-branch 格式"
    scope: script
    priority: P0
    trigger: [PR, Release]
    method: auto
    tags: [cleanup, dev-mode, per-branch, bug-fix]
    owner: infra
    steps:
      given: "per-branch 格式 .dev-mode.${branch} 存在"
      when: "cleanup.sh Section 10 和 Section 7.6 操作 .dev-mode"
      then: "优先使用 per-branch 格式，fallback 到旧格式"
    evidence:
      type: code
      file: "skills/dev/scripts/cleanup.sh"
      contains: "dev-mode.${CP_BRANCH}"

  - id: H7-017
    feature: H7
    name: "Cleanup 分支检测不使用 git branch --merged"
    scope: script
    priority: P1
    trigger: [PR, Release]
    method: auto
    tags: [cleanup, squash-merge, branch-detection, bug-fix]
    owner: infra
    steps:
      given: "cp-* 分支通过 squash merge 合并"
      when: "cleanup.sh Section 9 检测已合并分支"
      then: "使用 gh pr list --state merged 而非 git branch --merged"
    evidence:
      type: code
      file: "skills/dev/scripts/cleanup.sh"
      contains: "gh pr list"

  - id: H7-018
    feature: H7
    name: "Cleanup 不在 worktree 内启动 GC"
    scope: script
    priority: P2
    trigger: [PR, Release]
    method: auto
    tags: [cleanup, worktree-gc, race-condition, bug-fix]
    owner: infra
    steps:
      given: "cleanup.sh 在 worktree 内部运行"
      when: "Section 4.5 Worktree 清理"
      then: "不 fire-and-forget 启动 GC（由 stop hook 在 cleanup 完成后触发）"
    evidence:
      type: code
      file: "skills/dev/scripts/cleanup.sh"
      not_contains: "(bash.*worktree-gc.*&)"

