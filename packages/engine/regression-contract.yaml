      when: "第二个会话运行 /dev"
      then: "不判定为僵尸，创建 worktree 隔离"
    evidence:
      type: log
      contains: ".dev-mode 文件新鲜"

  - id: W6-001-2
    feature: W6
    name: "僵尸检测 - 文件旧且分支不存在"
    scope: workflow
    priority: P1
