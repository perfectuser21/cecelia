<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill 评估上传 — ZenithJoy 内部</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 560px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 32px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
    label span.req { color: #e53e3e; margin-left: 2px; }
    input[type="text"], select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    input[type="text"]:focus, select:focus { border-color: #5b6af0; }
    .dropzone {
      border: 2px dashed #c3c9f4;
      border-radius: 10px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
      background: #f8f9ff;
    }
    .dropzone:hover, .dropzone.dragover { border-color: #5b6af0; background: #eef0ff; }
    .dropzone .icon { font-size: 36px; margin-bottom: 10px; }
    .dropzone p { color: #555; font-size: 14px; }
    .dropzone .hint { font-size: 12px; color: #999; margin-top: 6px; }
    #fileInput { display: none; }
    .file-info {
      display: none;
      background: #e9f7ef;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #27ae60;
      margin-top: -12px;
      margin-bottom: 20px;
    }
    .file-info.shown { display: block; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #5b6af0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover:not(:disabled) { background: #4a59d8; }
    .btn:disabled { background: #a0a8f5; cursor: not-allowed; }
    .error-msg {
      color: #e53e3e;
      font-size: 13px;
      margin-top: 12px;
      padding: 10px 14px;
      background: #fff5f5;
      border-radius: 8px;
      border: 1px solid #fed7d7;
      display: none;
    }
    .error-msg.shown { display: block; }
    .status-panel {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
    }
    .status-panel.shown { display: block; }
    .status-label { font-size: 13px; color: #666; margin-bottom: 6px; }
    .status-value { font-size: 16px; font-weight: 700; color: #1a1a2e; }
    .status-value.pending { color: #d69e2e; }
    .status-value.running { color: #3182ce; }
    .status-value.completed { color: #38a169; }
    .status-value.failed { color: #e53e3e; }
    .task-id { font-size: 12px; color: #999; margin-top: 4px; font-family: monospace; }
    .queue-info { font-size: 13px; color: #555; margin-top: 8px; }
    .report-link {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #38a169;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .report-link:hover { background: #2f855a; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #c3c9f4;
      border-top-color: #5b6af0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Skill 评估上传</h1>
    <p class="subtitle">将 Skill zip 包上传至评估台，获取验收报告</p>

    <form id="uploadForm" novalidate>
      <label>Skill 名称<span class="req">*</span></label>
      <input type="text" id="skillName" name="skill_name" placeholder="例：日报生成 Skill" maxlength="100" />

      <label>来源平台<span class="req">*</span></label>
      <select id="platform" name="platform">
        <option value="">请选择平台</option>
        <option value="Claude">Claude</option>
        <option value="Codex">Codex</option>
        <option value="ChatGPT">ChatGPT</option>
        <option value="Other">其他</option>
      </select>

      <label>归属线<span class="req">*</span></label>
      <select id="journeyId" name="journey_id">
        <option value="">请选择归属线</option>
        <option value="line00">Line 00 — ZenithJoy 运营中枢</option>
        <option value="line01">Line 01 — 智能发布</option>
        <option value="line02">Line 02 — 客户智能获客路径</option>
        <option value="line03">Line 03 — GEO</option>
        <option value="line04">Line 04 — 客户私域 AI 接管</option>
        <option value="line05">Line 05 — 视频剪辑</option>
        <option value="line06">Line 06 — 小龙虾</option>
        <option value="line07">Line 07 — AI 爆款视频翻拍</option>
        <option value="line10">Line 10 — ZenithJoy 客户管理</option>
      </select>

      <label>提交人（选填）</label>
      <input type="text" id="submitter" name="submitter" placeholder="你的姓名或花名" maxlength="50" />

      <label>Skill zip 包<span class="req">*</span></label>
      <div class="dropzone" id="dropzone">
        <div class="icon">📦</div>
        <p>拖拽 .zip 文件到这里，或点击选择</p>
        <p class="hint">仅支持 .zip 格式，最大 10MB</p>
        <input type="file" id="fileInput" accept=".zip" />
      </div>
      <div class="file-info" id="fileInfo"></div>

      <div class="error-msg" id="errorMsg"></div>

      <button type="submit" class="btn" id="submitBtn">提交评估</button>
    </form>

    <div class="status-panel" id="statusPanel">
      <div class="status-label">评估状态</div>
      <div class="status-value" id="statusValue">--</div>
      <div class="task-id" id="taskIdDisplay"></div>
      <div class="queue-info" id="queueInfo"></div>
      <div id="reportArea"></div>
    </div>
  </div>

  <script>
    // ─── 配置 ─────────────────────────────────────────────────────────────
    const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB
    // 轮询退避：5s 起，×1.5，上限 30s（用整数运算，不用 bc）
    const POLL_MIN_MS = 5000;
    const POLL_MAX_MS = 30000;

    // ─── 元素引用 ──────────────────────────────────────────────────────────
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const form = document.getElementById('uploadForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const statusPanel = document.getElementById('statusPanel');
    const statusValue = document.getElementById('statusValue');
    const taskIdDisplay = document.getElementById('taskIdDisplay');
    const queueInfo = document.getElementById('queueInfo');
    const reportArea = document.getElementById('reportArea');

    let selectedFile = null;
    let pollTimer = null;
    let currentTaskId = null;

    // ─── 拖拽 & 点击选文件 ─────────────────────────────────────────────────
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) setFile(file);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    function setFile(file) {
      clearError();
      if (!file.name.toLowerCase().endsWith('.zip')) {
        showError('请选择 .zip 格式文件');
        return;
      }
      if (file.size > MAX_FILE_SIZE) {
        showError(`文件过大：${(file.size / 1024 / 1024).toFixed(1)}MB，最大 10MB`);
        return;
      }
      selectedFile = file;
      fileInfo.textContent = `已选择：${file.name}（${(file.size / 1024).toFixed(0)} KB）`;
      fileInfo.classList.add('shown');
    }

    // ─── 错误显示 ──────────────────────────────────────────────────────────
    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('shown');
    }
    function clearError() {
      errorMsg.classList.remove('shown');
    }

    // ─── 表单提交 ──────────────────────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const skillName = document.getElementById('skillName').value.trim();
      const platform = document.getElementById('platform').value;
      const journeyId = document.getElementById('journeyId').value;
      const submitter = document.getElementById('submitter').value.trim();

      if (!skillName) { showError('请填写 Skill 名称'); return; }
      if (!platform) { showError('请选择来源平台'); return; }
      if (!journeyId) { showError('请选择归属线'); return; }
      if (!selectedFile) { showError('请选择 .zip 文件'); return; }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>提交中…';

      try {
        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('skill_name', skillName);
        formData.append('platform', platform);
        formData.append('journey_id', journeyId);
        if (submitter) formData.append('submitter', submitter);

        const resp = await fetch('/eval-api/upload', {
          method: 'POST',
          body: formData,
        });

        const data = await resp.json();

        if (!resp.ok) {
          showError(data.error || `上传失败（HTTP ${resp.status}）`);
          submitBtn.disabled = false;
          submitBtn.textContent = '提交评估';
          return;
        }

        // 成功
        currentTaskId = data.task_id;
        taskIdDisplay.textContent = `任务 ID：${currentTaskId}`;

        if (data.deduped && data.report_url) {
          showCompleted(data.report_url);
          return;
        }

        const pos = data.queue_position || 1;
        queueInfo.textContent = `已进队列，前面还有 ${Math.max(0, pos - 1)} 个任务`;

        statusPanel.classList.add('shown');
        setStatus('pending');
        startPolling(currentTaskId);

        submitBtn.disabled = false;
        submitBtn.textContent = '提交评估';
      } catch (err) {
        showError('网络错误，请检查连接后重试');
        submitBtn.disabled = false;
        submitBtn.textContent = '提交评估';
      }
    });

    // ─── 状态展示 ──────────────────────────────────────────────────────────
    function setStatus(status, extraMsg) {
      const labels = {
        pending: '⏳ 排队中',
        running: '🔄 评估中',
        completed: '✅ 评估完成',
        failed: '❌ 评估失败',
        unknown: '⚪ 未知',
      };
      statusValue.textContent = labels[status] || status;
      statusValue.className = 'status-value ' + status;
      if (extraMsg) queueInfo.textContent = extraMsg;
    }

    function showCompleted(reportUrl) {
      setStatus('completed');
      statusPanel.classList.add('shown');
      queueInfo.textContent = '评估已完成！';
      reportArea.innerHTML = `<a class="report-link" href="${reportUrl}" target="_blank" rel="noopener">查看验收报告 →</a>`;
    }

    // ─── 指数退避轮询（awk 等价整数计算）──────────────────────────────────
    function calcNextInterval(currentMs) {
      // 退避：current * 1.5，上限 30000ms（整数运算）
      const next = Math.floor(currentMs * 3 / 2);
      return Math.min(next, POLL_MAX_MS);
    }

    function startPolling(taskId) {
      let intervalMs = POLL_MIN_MS;

      function poll() {
        fetch(`/eval-api/status/${taskId}`)
          .then((r) => r.json())
          .then((data) => {
            const status = data.status || 'unknown';

            if (status === 'completed') {
              showCompleted(data.report_url || '#');
              return;
            }

            if (status === 'failed') {
              setStatus('failed', `评估失败：${data.failure_reason || '未知原因'}，可重新提交`);
              return;
            }

            if (status === 'pending') {
              const pos = data.queue_position || '?';
              setStatus('pending', `排队中，队列位置：${pos}`);
            } else if (status === 'running') {
              setStatus('running', '容器正在评估 Skill…');
            }

            // 继续轮询
            intervalMs = calcNextInterval(intervalMs);
            pollTimer = setTimeout(poll, intervalMs);
          })
          .catch(() => {
            // 网络抖动：不误判失败，继续轮询
            queueInfo.textContent = '连接中断，任务仍在运行中…';
            intervalMs = calcNextInterval(intervalMs);
            pollTimer = setTimeout(poll, intervalMs);
          });
      }

      pollTimer = setTimeout(poll, intervalMs);
    }
  </script>
</body>
</html>
