# HK nginx 反代配置 — Skill Evaluator eval-api 路由
# Sprint: 07072314-skill-eval-service
#
# 部署说明：
#   1. 将此文件内容 patch 到 HK nginx docs 域 server block 内
#   2. 替换占位符 {{US_BRAIN_TAILSCALE_IP}} 为运行时 `tailscale status` 取得的地址
#   3. 替换 {{EVAL_PROXY_TOKEN}} 为 1Password CS "Skill Eval Proxy Token" 的值
#   4. 重载 nginx: sudo nginx -t && sudo systemctl reload nginx
#
# 铁律：
#   - US Brain IP / Tailscale 地址禁止写死（此文件为模板，运维 apply 时填入）
#   - EVAL_PROXY_TOKEN 不进 git（此文件是占位符，真实 token 只存 1Password CS）
#   - docs 域已有 Basic Auth 保护，此 location 继承 server 级 auth_basic
#
# 用法：
#   bash scripts/apply-hk-nginx-eval.sh  （运维脚本，从 1Password 取值后替换占位符）

# ─── 上传页入口（Basic Auth 已在 server 级保护）────────────────────────────────
location = /eval {
    # 返回上传页 HTML
    alias /data/docs/skill-eval/index.html;
    add_header Content-Type "text/html; charset=utf-8";
}

location /eval-api/ {
    # Basic Auth 继承 server 级（docs 域已配置，此处无需重复声明）
    # 注入 X-Eval-Proxy-Token（值从运维脚本替换，不进 git）
    proxy_set_header X-Eval-Proxy-Token "{{EVAL_PROXY_TOKEN}}";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 转发到 US Brain（地址从 Tailscale 运行时获取，禁止写死）
    proxy_pass http://{{US_BRAIN_TAILSCALE_IP}}:5221/api/skill-eval/;

    # 上传超时（zip 最大 10MB，放宽到 60s）
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 上传大小限制（nginx 层也限制，与 Brain multer 保持一致）
    client_max_body_size 12m;
}

# ─── 评估报告静态文件（Basic Auth 保护）────────────────────────────────────────
location /data/docs/skill-evals/ {
    # 继承 server 级 Basic Auth
    alias /data/docs/skill-evals/;
    autoindex on;
    autoindex_format html;
}
