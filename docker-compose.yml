# == Production Environment ==
# Uses pre-built immutable image (brain/Dockerfile).
# Build first: bash scripts/brain-build.sh
# Deploy:      bash scripts/brain-deploy.sh

# 项目名与目录解耦，防换部署根跑 compose 时容器名冲突
name: cecelia

services:
  node-brain:
    image: cecelia-brain:${BRAIN_VERSION:-latest}
    container_name: cecelia-node-brain
    # macOS/OrbStack: network_mode:host 不支持，用 bridge + port forward
    ports:
      - "5221:5221"
      # Acceptance 公网 listener（刀1，决策 c08c2173/4303a326）：容器内 0.0.0.0:5223，
      # 宿主侧 pf 封 en0/en1 公网网卡，仅 cloudflared(brain-acceptance.zenjoymedia.media)→localhost:5223 可达。
      # env 注入走 env_file(.env.docker)：ACCEPTANCE_API_TOKEN（缺省=listener 不启动 fail-closed）+ ACCEPTANCE_PUBLIC_HOST=0.0.0.0
      - "5223:5223"
      # 预览 Brain 端口范围（per-PR preview environments，由 preview-env-start.sh 在容器内启动）
      # 容器内的预览 Brain 进程绑定到 5300-5399，需对外暴露才能被 GitHub Actions 健康检查到（via Tailscale）
      - "5300-5399:5300-5399"
    read_only: true
    tmpfs:
      - /tmp:size=100M
    volumes:
      # Docker socket: Brain 调 dockerd spawn 兄弟 pipeline 容器
      - /var/run/docker.sock:/var/run/docker.sock
      # Skills + cecelia-run (read-only)
      - /Users/administrator/.claude:/Users/administrator/.claude:ro
      # B57: zenithjoy-skills SSOT — .claude/skills/* 是指向这里的 symlink，
      # 不 mount 则容器内 symlink 悬空 → harness SKILL 加载失败（loadSkillContent 全 miss → 空 SKILL 凑合跑 / B56 后 fail-fast）
      - /Users/administrator/perfect21/zenithjoy-skills:/Users/administrator/perfect21/zenithjoy-skills:ro
      # B58(2026-07-05): relay 三 skill 的 .claude/skills/* symlink 实际指向 zenithjoy-skills-DIST
      # （git archive origin/main，根治工作 checkout 停 feature 分支读旧版的坑），dist 未 mount 则
      # 容器内 loadSkillContent 悬空 → Brain 无法 dispatch relay / watchdog 无法重点火（只能宿主 ignite）。
      - /Users/administrator/perfect21/zenithjoy-skills-dist:/Users/administrator/perfect21/zenithjoy-skills-dist:ro
      # Credentials + Claude accounts — 保持宿主路径不 remap
      # HOST_HOME=/Users/administrator + Dockerfile ENV HOME 也对齐宿主路径，
      # 这样 Brain os.homedir() 和 docker-executor 构造的子容器 mount 源都能解析。
      - /Users/administrator/.credentials:/Users/administrator/.credentials:ro
      - /Users/administrator/.claude-account1:/Users/administrator/.claude-account1:ro
      - /Users/administrator/.claude-account2:/Users/administrator/.claude-account2:ro
      - /Users/administrator/.claude-account3:/Users/administrator/.claude-account3:ro
      # Provider-neutral Kernel preflight 需要看到本机已验证的全部账号状态。
      # codex home 须可写（rw）：codex 0.146 起启动即写 cache/sessions/locks，:ro 直接
      # Read-only file system 崩死 triggerCodexReview（2026-08-05 事故，决策 c62c423a）。
      - /Users/administrator/.codex-team1:/Users/administrator/.codex-team1:rw
      - /Users/administrator/.codex-team2:/Users/administrator/.codex-team2:rw
      - /Users/administrator/.codex-team3:/Users/administrator/.codex-team3:rw
      - /Users/administrator/.codex-team4:/Users/administrator/.codex-team4:rw
      - /Users/administrator/.codex-team5:/Users/administrator/.codex-team5:rw
      - /Users/administrator/.grok:/Users/administrator/.grok:ro
      # Workflows: staff + skills + agents (read-only for staff/skills-registry API)
      - /Users/administrator/perfect21/cecelia/packages/workflows:/Users/administrator/perfect21/cecelia/packages/workflows:ro
      # Config: OKR validation spec (read-only, mounted at /config for validate-okr-structure.js)
      - /Users/administrator/perfect21/cecelia/packages/config:/config:ro
      # HEARTBEAT.md (read-write for GET/PUT API)
      - /Users/administrator/perfect21/cecelia/HEARTBEAT.md:/HEARTBEAT.md:rw
      # workers.config.json (read-write for PUT /staff/workers API)
      - /Users/administrator/perfect21/cecelia/packages/workflows/staff/workers.config.json:/Users/administrator/perfect21/cecelia/packages/workflows/staff/workers.config.json:rw
      # Worktree 根目录（Brain spawn harness/pipeline 容器时要 mount 宿主 worktree）
      - /Users/administrator/perfect21/cecelia/.claude/worktrees:/Users/administrator/perfect21/cecelia/.claude/worktrees:rw
      - /Users/administrator/worktrees:/Users/administrator/worktrees:rw
      # Content pipeline 产物目录（docker-executor existsFn 检查要求 Brain 可见宿主该路径，
      # 否则不挂给 pipeline container，产物写到 ephemeral 空间 --rm 丢失。见 PR #2527 后续修）
      - /Users/administrator/content-output:/Users/administrator/content-output:rw
      - /Users/administrator/claude-output:/Users/administrator/claude-output:rw
      # SSH：pipeline-export.sh 跑 "ssh nas" 上传 NAS，docker-executor 挂给 pipeline container
      - /Users/administrator/.ssh:/Users/administrator/.ssh:ro
      # Git + gh config（harness / pipeline container 做 git commit / gh pr 需要）
      - /Users/administrator/.gitconfig:/Users/administrator/.gitconfig:ro
      - /Users/administrator/.config/gh:/Users/administrator/.config/gh:ro
      # 主仓库全目录（deploy webhook 需要 git pull/tag + scripts/ — rw 允许写 .git）
      - /Users/administrator/perfect21/cecelia:/Users/administrator/perfect21/cecelia:rw
      # CD 专用部署根（REPO_ROOT 指向此仓，deploy-local.sh 在这里 pull/reset/build）
      - /Users/administrator/perfect21/cecelia-deploy-main:/Users/administrator/perfect21/cecelia-deploy-main:rw
      # Prompt 文件目录：Brain 写 prompt 文件这里（docker-executor writePromptFile），
      # 子容器 mount 源必须由宿主 docker daemon 解析 → 必须宿主路径。compose 里 bind-mount
      # 宿主 ~/claude-output/cecelia-prompts → Brain 容器 /tmp/cecelia-prompts，
      # 配合 HOST_PROMPT_DIR env 让 docker-executor 构造子容器 mount 走宿主路径。
      - /Users/administrator/claude-output/cecelia-prompts:/tmp/cecelia-prompts:rw
      # Timezone (read-only)
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env.docker
    environment:
      - TZ=Asia/Shanghai
      - ENV_REGION=${ENV_REGION:-us}
      # Kernel controller 固定留在 US M4；Docker hostname 不是可调度机器身份。
      - CECELIA_MACHINE_ID=${CECELIA_MACHINE_ID:-us-mac-m4}
      # Fleet Node admission is mandatory. Brain accepts only these canonical
      # server-owned Worker endpoints and caches their evidence for at most 90s.
      - FLEET_WORKER_US_MAC_M4_URL=${FLEET_WORKER_US_MAC_M4_URL:-http://host.docker.internal:5231}
      - FLEET_WORKER_XIAN_MAC_M4_URL=${FLEET_WORKER_XIAN_MAC_M4_URL:-http://100.86.57.69:5231}
      - FLEET_WORKER_XIAN_MAC_M1_URL=${FLEET_WORKER_XIAN_MAC_M1_URL:-http://100.88.166.55:5231}
      - FLEET_NODE_ADMISSION_CACHE_TTL_MS=${FLEET_NODE_ADMISSION_CACHE_TTL_MS:-1000}
      # Phase 4B: all canonical machines use the authenticated Fleet Worker
      # Attempt API. An absent/short token remains fail-closed in the transport.
      - KERNEL_FLEET_REMOTE_ENABLED=${KERNEL_FLEET_REMOTE_ENABLED:-true}
      - KERNEL_FLEET_BRIDGE_TOKEN=${KERNEL_FLEET_BRIDGE_TOKEN:-}
      # Workspace + PostgreSQL + stopped Runner preparation is intentionally
      # heavier than inspect/start/cancel, so it has an independent budget.
      - KERNEL_FLEET_PREPARE_TIMEOUT_MS=${KERNEL_FLEET_PREPARE_TIMEOUT_MS:-180000}
      # Xian Workers must be able to call the US Brain over Tailscale.
      - KERNEL_FLEET_REMOTE_CALLBACK_BASE_URL=${KERNEL_FLEET_REMOTE_CALLBACK_BASE_URL:-http://100.71.151.105:5221}
      # host.docker.internal: OrbStack 原生支持，容器内此地址到宿主 127.0.0.1
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-cecelia}
      - DB_USER=${DB_USER:-cecelia}
      - DB_PASSWORD=${DB_PASSWORD:-cecelia}
      # review 门审批 token（issue afc50c30）：只注入 Brain 本容器，relay/harness 执行体
      # 容器不挂载——执行体物理上无法伪造人工批准。值从部署机根 .env（gitignored）/
      # ~/.credentials/cecelia-brain.env 注入；缺省空 → 路由 503 fail-closed。
      - HARNESS_REVIEW_APPROVER_TOKEN=${HARNESS_REVIEW_APPROVER_TOKEN:-}
      - BRAIN_PORT=5221
      - CECELIA_TICK_ENABLED=${CECELIA_TICK_ENABLED:-true}
      # Concurrency: auto-calculated from hardware (CPU/memory) via slot-allocator.js
      # CECELIA_MAX_SEATS: hard cap on concurrent slots (overrides auto-calc, set 0 to disable)
      - CECELIA_MAX_SEATS=10
      # CECELIA_BUDGET_SLOTS: budget-layer cap (< MAX_SEATS), reserves 3 slots for burst buffer + INTERACTIVE_RESERVE
      - CECELIA_BUDGET_SLOTS=7
      - CECELIA_TICK_INTERVAL_MS=${CECELIA_TICK_INTERVAL_MS:-5000}
      - DISPATCH_TIMEOUT_MINUTES=${DISPATCH_TIMEOUT_MINUTES:-60}
      - FEISHU_BOT_WEBHOOK=${FEISHU_BOT_WEBHOOK:-}
      # Bark 告警推送 token（source ~/.credentials/bark.env 后由宿主 shell 展开）
      - BARK_TOKEN=${BARK_TOKEN:-}
      - CECELIA_RUN_PATH=/Users/administrator/perfect21/cecelia/packages/brain/scripts/cecelia-run.sh
      - HOST_HOME=/Users/administrator
      # 部署根=CD 专用仓（非活人主仓），deploy-local.sh 从此仓 pull/reset origin/main 后 build
      - REPO_ROOT=/Users/administrator/perfect21/cecelia-deploy-main
      # 专用部署根，deploy-local.sh 守卫自愈到 origin/main（脏/落后时硬 reset 而非静默降级）
      - CECELIA_DEPLOY_AUTORESET=1
      # Codex CLI 容器内位置（由 Dockerfile npm install -g @openai/codex 装到 /usr/local/bin/codex）
      # 覆盖 executor.js 默认值 /opt/homebrew/bin/codex（host 路径，容器里不存在）
      - CODEX_BIN=/usr/local/bin/codex
      # Codex CLI 找凭据用 $CODEX_HOME/auth.json（mount 自 host ~/.codex-team1）
      - CODEX_HOME=/Users/administrator/.codex-team1
      # B6: codex relay 子容器（executor=codex）凭据挂载源目录，由 harness-skill-relay.js
      # 读取拼 extraMounts=[`${CODEX_RELAY_HOME}:/home/cecelia/.codex:rw`]。
      # compose 在宿主插值 ${HOME}，容器内拿到的是宿主绝对路径字符串——语义正确，
      # 因为 docker -v 的 source 路径由宿主 docker daemon 解析，不是容器内路径。
      - CODEX_RELAY_HOME=${CODEX_RELAY_HOME:-${HOME}/.codex-team2}
      # Brain 容器里 /tmp/cecelia-prompts 对应的宿主路径（docker-executor 用它构造子容器 mount 源）
      - HOST_PROMPT_DIR=/Users/administrator/claude-output/cecelia-prompts
      # ZenithJoy API — harness-sprint-state skill 写 sprint_states/journey_steps 用
      - BRAIN_API=http://host.docker.internal:5200
      # ZenithJoy 蓝绿护栏：staging-e2e-runner.js 健康检查 :5201，需指向宿主（容器内 localhost 不通宿主端口）
      - ZJ_STAGING_HOST=host.docker.internal
      # P0-fix: Brain 写发布回执到独立 zenithjoy 库（zenithjoy-db.js 依赖此变量）
      # 未设 → 静默落回 cecelia.zenithjoy schema（拆库目的失效）
      - ZENITHJOY_DB_NAME=zenithjoy
      # OPENAI_API_KEY is provided via env_file (.env.docker) — do NOT override here
      # Overriding with ${OPENAI_API_KEY} causes empty string when host shell has no export
      # FEISHU_OWNER_OPEN_IDS is provided via env_file (.env.docker) — same reason, do NOT override here
    # compose standalone cgroup 限额（deploy.resources 只在 Docker Swarm 模式生效）
    # 容器 memory cap 必须 ≥ 运行时 node 堆上限 + 容器开销余量。
    # Dockerfile CMD: node --max-old-space-size=3072 → 3G 堆；4G = 3G 堆 + ~1G 容器/native 开销。
    # 旧值 1G 双 LangGraph 负载下必然 OOM kill（伪装成"神秘 Brain 重启"打断在飞 harness run）。
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 2.0
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5221/api/brain/tick/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: node:20-alpine
    container_name: cecelia-frontend
    network_mode: host
    working_dir: /app
    volumes:
      - ./apps/dashboard/dist:/app
      - ./frontend-proxy.js:/frontend-proxy.js:ro
    command: node /frontend-proxy.js
    depends_on:
      node-brain:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
