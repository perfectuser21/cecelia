# ZenithJoy HK 独立 postgres 栈（拆库刀3-T2）
# SSOT: docs/architecture/2026-07-14-zj-migrate-hk/architecture.md §1 候选 A
# 部署位置: hk-vps /opt/zenithjoy/db/docker-compose.yml
# 启动: COMPOSE_PROJECT_NAME=zenithjoy-db docker compose up -d
# 回滚: COMPOSE_PROJECT_NAME=zenithjoy-db docker compose down -v（见 T1 回滚表 T2-1）
services:
  postgres:
    image: postgres:17
    container_name: zenithjoy-db-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: zenithjoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # 来自同目录 .env（chmod 600），1Password CS "ZenithJoy HK Postgres" 为源
      POSTGRES_DB: zenithjoy
    volumes:
      - zenithjoy_pgdata:/var/lib/postgresql/data
    mem_limit: 1g

volumes:
  zenithjoy_pgdata:
