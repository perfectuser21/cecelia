# == Development Environment ==
# Uses source-code mount for hot-reload.
# Usage: docker compose -f docker-compose.dev.yml up -d

# 项目名与 docker-compose.yml(prod) 隔离：不设置时会继承 .env 的
# COMPOSE_PROJECT_NAME=cecelia，与 prod 撞名，导致 `up -d --remove-orphans`
# 把 prod 的 node-brain/frontend 当作本项目"孤儿"用 dev 的坏定义重建。
# staging(docker-compose.staging.yml) 已用 name:cecelia-staging 隔离，dev 之前没有。
name: cecelia-dev

services:
  node-brain-dev:
    image: node:20-alpine
    container_name: cecelia-node-brain-dev
    network_mode: host
    pid: host
    working_dir: /app
    volumes:
      - ./packages/brain:/app
      - ./node_modules:/node_modules:ro  # npm workspaces 提升依赖(含dotenv)到根，需只读挂载
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=cecelia_dev
      - DB_USER=${DB_USER:-cecelia}
      - DB_PASSWORD=${DB_PASSWORD}
      - BRAIN_PORT=5220
      - CECELIA_TICK_ENABLED=${CECELIA_TICK_ENABLED:-false}
      - CECELIA_TICK_INTERVAL_MS=${CECELIA_TICK_INTERVAL_MS:-5000}
      - DISPATCH_TIMEOUT_MINUTES=${DISPATCH_TIMEOUT_MINUTES:-60}
      - FEISHU_BOT_WEBHOOK=${FEISHU_BOT_WEBHOOK:-}
    command: sh -c "apk add --no-cache curl bash procps && (test -f /node_modules/dotenv/package.json || npm install --production --legacy-peer-deps) && node server.js"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5220/api/brain/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-dev:
    image: node:20-alpine
    container_name: cecelia-frontend-dev
    network_mode: host
    working_dir: /app
    volumes:
      - ./apps/dashboard/dist:/app
      - /Users/administrator/perfect21/cecelia/apps/dashboard/dist:/Users/administrator/perfect21/cecelia/apps/dashboard/dist:ro
      - ./frontend-proxy.js:/frontend-proxy.js:ro
    environment:
      - FRONTEND_PORT=5213
      - BRAIN_PORT_TARGET=5220
      - LANGFUSE_PROXY_PORT=3003
    command: node /frontend-proxy.js
    depends_on:
      node-brain-dev:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
